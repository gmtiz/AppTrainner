<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AppTrainner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --fondo:#F6F4F1; --panel:#FFFFFF; --tinta:#2E3A3F; --suave:#7A8891; --linea:#E3DFDA;
    --verde:#4C9A82; --verde-claro:#E7F2EE; --durazno:#F2A65A; --durazno-claro:#FDF0E2;
    --coral:#D9705F; --coral-claro:#FBEBE8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--fondo)}
  body{font-family:'Nunito',system-ui,-apple-system,sans-serif;color:var(--tinta);
       line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
  h1{font-size:26px} h2{font-size:22px} h3{font-size:17px}
  p{margin:0}

  .topbar{background:var(--tinta);color:#fff;padding:16px 16px 0;position:sticky;top:0;z-index:20;
          border-radius:0 0 18px 18px}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .brand h1{color:#fff;font-size:22px}
  .brand .hola{color:#B9C6CB;font-size:14px;font-weight:600}
  .brand button{margin-left:auto;background:rgba(255,255,255,.12);border:0;color:#fff;
                font-size:13px;font-weight:700;cursor:pointer;padding:7px 13px;border-radius:20px}
  .tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
  .tab{flex:1 0 auto;background:transparent;border:0;color:#A8B7BD;font-family:inherit;font-size:15px;
       font-weight:700;padding:10px 10px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  .tab.on{color:#fff;border-bottom-color:var(--durazno)}

  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 70px}
  .card{background:var(--panel);border:1px solid var(--linea);border-radius:16px;
        padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(46,58,63,.04)}
  .card.tap{cursor:pointer}
  .card.tap:active{border-color:var(--verde)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .suave{color:var(--suave);font-size:14.5px}
  .chico{font-size:13px;color:var(--suave)}

  button{font-family:inherit}
  .btn{background:var(--verde);color:#fff;border:0;border-radius:12px;padding:14px 18px;
       font-size:15.5px;font-weight:700;cursor:pointer;width:100%}
  .btn.naranja{background:var(--durazno);color:#fff}
  .btn.linea{background:#fff;color:var(--tinta);border:1.5px solid var(--linea)}
  .btn.riesgo{background:#fff;color:var(--coral);border:1.5px solid var(--coral-claro)}
  .btn.chico{width:auto;padding:9px 15px;font-size:14px;border-radius:10px}
  .btn:disabled{opacity:.45;cursor:default}
  .btn:focus-visible,input:focus,select:focus,textarea:focus{outline:3px solid var(--durazno);outline-offset:2px}

  input,select,textarea{font-family:inherit;font-size:16px;color:var(--tinta);width:100%;
    padding:13px;border:1.5px solid var(--linea);border-radius:12px;background:#fff;margin-top:6px}
  label{display:block;font-size:13.5px;font-weight:700;margin-bottom:12px}

  .globo{display:inline-block;font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:20px;
         background:#EEEBE6;color:var(--suave)}
  .globo.ok{background:var(--verde-claro);color:#2F6B58}
  .globo.aviso{background:var(--durazno-claro);color:#9A5A12}
  .globo.alerta{background:var(--coral-claro);color:#A6432F}

  .vacio{border:1.5px dashed var(--linea);border-radius:16px;padding:30px 20px;text-align:center;background:#fff}
  .vacio p{margin-bottom:16px;color:var(--suave)}

  /* progreso del plan, en lugar del cartel de renovación */
  .plan{display:flex;align-items:center;gap:10px;margin-top:10px}
  .barra{flex:1;height:7px;border-radius:6px;background:#EAE6E1;overflow:hidden}
  .barra i{display:block;height:100%;border-radius:6px;background:var(--verde)}
  .barra.cerca i{background:var(--durazno)}
  .barra.vencido i{background:var(--coral)}
  .plan .txt{font-size:12.5px;font-weight:700;color:var(--suave);white-space:nowrap}

  .recordatorio{background:#fff;border:1px solid var(--linea);border-left:4px solid var(--durazno);
    border-radius:14px;padding:14px 16px;margin-bottom:16px}
  .recordatorio h3{font-size:15px;margin-bottom:4px}

  .dia{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:16px;margin-bottom:14px}
  .ej{border-top:1px solid var(--linea);padding:12px 0;background:#fff}
  .ej.arrastrando{opacity:.4}
  .ej.encima{border-top:2px solid var(--verde)}
  .ej-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .mango{cursor:grab;color:var(--suave);font-size:18px;line-height:1;padding:2px 8px 2px 0;user-select:none}
  .video{color:var(--verde);font-weight:700;font-size:14px;text-decoration:none}
  .series{font-size:19px;font-weight:800;white-space:nowrap;color:var(--verde)}
  .mini{background:#fff;border:1.5px solid var(--linea);border-radius:8px;width:30px;height:30px;
        cursor:pointer;font-size:14px;color:var(--suave);padding:0}
  .lista{border:1.5px solid var(--linea);border-radius:12px;margin-top:8px;background:#fff;overflow:hidden}
  .op{padding:13px 14px;cursor:pointer;border:0;border-bottom:1px solid var(--linea);
      font-size:15px;width:100%;text-align:left;background:none;font-family:inherit;color:var(--tinta)}
  .op:last-child{border-bottom:0}
  .op:hover{background:var(--verde-claro)}
  .volver{background:none;border:0;color:var(--suave);font-size:14.5px;font-weight:700;cursor:pointer;padding:0 0 14px}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .anotar{display:flex;gap:8px;margin-top:10px}
  .anotar input{margin-top:0}
  .centro{max-width:410px;margin:50px auto;padding:0 16px}
  .hechas{background:var(--verde-claro);border-radius:10px;padding:8px 12px;margin-top:8px}
  .hechas .fila{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:#2F6B58}
  .hechas button{background:none;border:0;color:#2F6B58;font-size:12.5px;cursor:pointer;font-weight:700;opacity:.7}

  .semana{border-left:3px solid var(--linea);padding-left:14px;margin-bottom:16px}
  .fondo-modal{position:fixed;inset:0;background:rgba(46,58,63,.45);display:flex;
    align-items:flex-end;justify-content:center;z-index:60}
  .modal{background:#fff;border-radius:20px 20px 0 0;padding:22px 20px 26px;width:100%;
    max-width:520px;max-height:88vh;overflow:auto}
  @media (min-width:560px){.fondo-modal{align-items:center;padding:20px}.modal{border-radius:20px}}
  .modal h3{margin-bottom:6px}
  .modal .sub{color:var(--suave);font-size:14.5px;margin-bottom:16px}

  .mensajes{position:fixed;left:0;right:0;bottom:18px;display:flex;flex-direction:column;
    align-items:center;gap:8px;z-index:80;pointer-events:none;padding:0 16px}
  .mensaje{background:var(--tinta);color:#fff;padding:12px 18px;border-radius:14px;
    font-size:14.5px;font-weight:600;box-shadow:0 6px 18px rgba(46,58,63,.22);max-width:460px}
  .mensaje.mal{background:var(--coral)}
  .mensaje.bien{background:var(--verde)}
  .tabla{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
  .tabla th,.tabla td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--linea)}
  .tabla th{color:var(--suave);font-size:12.5px}
  @media (max-width:430px){.dos{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef, createContext, useContext } = React;

const CLAVE = 'apptrainner_token';
let sesion = localStorage.getItem(CLAVE) || null;

async function api(path, opts = {}) {
  const r = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers: Object.assign({ 'Content-Type': 'application/json' },
      sesion ? { Authorization: 'Bearer ' + sesion } : {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status === 401) { sesion = null; localStorage.removeItem(CLAVE); location.reload(); }
    const e = new Error(d.error || 'Algo no salió bien. Probá de nuevo.');
    e.status = r.status; e.datos = d; throw e;
  }
  return d;
}

const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const fmt = d => d ? d.split('-').reverse().slice(0, 2).join('/') : '—';
const fmtLargo = d => { if (!d) return '—'; const [a, m, dd] = d.split('-'); return `${dd}/${m}`; };
const hora = iso => iso ? new Date(iso).toTimeString().slice(0, 5) : '';
const hoyISO = () => new Date().toISOString().slice(0, 10);
const semanaDe = i => i ? Math.max(1, Math.floor((Date.now() - new Date(i + 'T00:00:00')) / (7 * 864e5)) + 1) : 1;
function finPlan(inicio) {
  if (!inicio) return null;
  const d = new Date(inicio + 'T00:00:00'); d.setDate(d.getDate() + 28);
  return d.toISOString().slice(0, 10);
}
const diasRestantes = inicio => {
  const f = finPlan(inicio); if (!f) return null;
  return Math.ceil((new Date(f + 'T00:00:00') - new Date().setHours(0, 0, 0, 0)) / 864e5);
};

/* Progreso del plan: reemplaza al cartel de "renueva en 3 días". */
function Progreso({ inicio, compacto }) {
  if (!inicio) return null;
  const sem = Math.min(semanaDe(inicio), 5);
  const dias = diasRestantes(inicio);
  const pct = Math.min(100, Math.max(6, ((28 - Math.max(dias, 0)) / 28) * 100));
  const estado = dias < 0 ? 'vencido' : dias <= 7 ? 'cerca' : '';
  const texto = dias < 0 ? 'Plan cumplido' : `Semana ${Math.min(sem, 4)} de 4`;
  return (
    <div className="plan">
      <div className={'barra ' + estado}><i style={{ width: pct + '%' }} /></div>
      <span className="txt">{compacto ? texto : `${texto} · hasta el ${fmtLargo(finPlan(inicio))}`}</span>
    </div>);
}

/* ---------- avisos y ventanas propias ---------- */
const Aviso = createContext(null);
const usarAviso = () => useContext(Aviso);

function ProveedorAviso({ children }) {
  const [mensajes, setMensajes] = useState([]);
  const [pregunta, setPregunta] = useState(null);

  const avisar = useCallback((texto, tipo = 'bien') => {
    const id = Math.random();
    setMensajes(m => [...m, { id, texto, tipo }]);
    setTimeout(() => setMensajes(m => m.filter(x => x.id !== id)), 3600);
  }, []);

  const confirmar = useCallback((texto, detalle, etiqueta) =>
    new Promise(res => setPregunta({ texto, detalle, etiqueta: etiqueta || 'Sí, dale', res })), []);

  // Memorizado: si no, cambia en cada render y hace recargar datos en bucle.
  const valor = useMemo(() => ({ avisar, confirmar }), [avisar, confirmar]);

  return (
    <Aviso.Provider value={valor}>
      {children}
      <div className="mensajes">
        {mensajes.map(m => <div key={m.id} className={'mensaje ' + m.tipo}>{m.texto}</div>)}
      </div>
      {pregunta &&
        <div className="fondo-modal" onClick={() => { pregunta.res(false); setPregunta(null); }}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>{pregunta.texto}</h3>
            {pregunta.detalle && <p className="sub">{pregunta.detalle}</p>}
            <button className="btn riesgo" onClick={() => { pregunta.res(true); setPregunta(null); }}>
              {pregunta.etiqueta}</button>
            <button className="btn linea" style={{ marginTop: 10 }}
              onClick={() => { pregunta.res(false); setPregunta(null); }}>Mejor no</button>
          </div>
        </div>}
    </Aviso.Provider>);
}

function Modal({ titulo, sub, children, cerrar }) {
  useEffect(() => {
    const esc = e => e.key === 'Escape' && cerrar();
    window.addEventListener('keydown', esc);
    return () => window.removeEventListener('keydown', esc);
  }, [cerrar]);
  return (
    <div className="fondo-modal" onClick={cerrar}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <h3>{titulo}</h3>
        {sub && <p className="sub">{sub}</p>}
        {children}
      </div>
    </div>);
}

/* Si una pantalla falla, se muestra el error en vez de quedar trabada. */
class Escudo extends React.Component {
  constructor(p) { super(p); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidUpdate(prev) { if (prev.clave !== this.props.clave && this.state.error) this.setState({ error: null }); }
  render() {
    if (this.state.error)
      return (<div className="vacio">
        <p>Se trabó esta pantalla. Probá volver a entrar.</p>
        <button className="btn chico" onClick={() => this.setState({ error: null })}>Reintentar</button>
      </div>);
    return this.props.children;
  }
}

/* ---------- entrada ---------- */
function Entrar({ onEntrar }) {
  const [modo, setModo] = useState('login');
  const [f, setF] = useState({ email: '', password: '', nombre: '' });
  const [cargando, setCargando] = useState(false);
  const { avisar } = usarAviso();
  const set = k => e => setF({ ...f, [k]: e.target.value });

  async function enviar() {
    setCargando(true);
    try {
      const r = await api(modo === 'login' ? '/login' : '/registro', { method: 'POST', body: f });
      sesion = r.token; localStorage.setItem(CLAVE, r.token);
      avisar(modo === 'login' ? '¡Hola de nuevo!' : '¡Cuenta creada! Bienvenido.');
      onEntrar(r);
    } catch (e) { avisar(e.message, 'mal'); } finally { setCargando(false); }
  }

  return (
    <div className="centro">
      <h1 style={{ marginBottom: 8 }}>AppTrainner</h1>
      <p className="suave" style={{ marginBottom: 24 }}>
        Armá las rutinas de tus alumnos sin volver a pegar un video nunca más.
      </p>
      <div className="card">
        {modo === 'registro' &&
          <label>¿Cómo te llamás?<input value={f.nombre} onChange={set('nombre')} placeholder="Tu nombre" /></label>}
        <label>Mail<input type="email" value={f.email} onChange={set('email')} autoComplete="email" /></label>
        <label>Contraseña
          <input type="password" value={f.password} onChange={set('password')}
            autoComplete={modo === 'login' ? 'current-password' : 'new-password'}
            onKeyDown={e => e.key === 'Enter' && enviar()} />
          {modo === 'registro' && <span className="chico">Mínimo 8 caracteres.</span>}
        </label>
        <button className="btn" onClick={enviar} disabled={cargando}>
          {cargando ? 'Un segundito...' : modo === 'login' ? 'Entrar' : 'Crear mi cuenta'}</button>
        <button className="btn linea" style={{ marginTop: 10 }}
          onClick={() => setModo(modo === 'login' ? 'registro' : 'login')}>
          {modo === 'login' ? 'Todavía no tengo cuenta' : 'Ya tengo cuenta'}</button>
      </div>
    </div>);
}

/* ---------- banco de ejercicios ---------- */
function Ejercicios({ ejercicios, grupos, recargar }) {
  const [form, setForm] = useState(null);
  const { avisar, confirmar } = usarAviso();

  async function guardar() {
    try {
      if (form.id) { await api('/ejercicios/' + form.id, { method: 'PATCH', body: form }); avisar('Ejercicio actualizado'); }
      else {
        const r = await api('/ejercicios', { method: 'POST', body: form });
        avisar(r.ya_existia ? 'Ese ejercicio ya estaba en tu banco' : 'Ejercicio guardado');
      }
      setForm(null); await recargar();
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function borrar(ej) {
    if (!await confirmar('¿Sacamos este ejercicio del banco?',
      `"${ej.nombre}" ya no va a aparecer cuando armes rutinas nuevas.`, 'Sí, sacarlo')) return;
    try { await api('/ejercicios/' + ej.id, { method: 'DELETE' }); await recargar(); avisar('Listo, lo sacamos'); }
    catch (e) {
      if (e.status === 409) {
        if (!await confirmar('Ojo: lo estás usando',
          `${e.datos.usos === 1 ? 'Aparece en 1 rutina tuya' : 'Aparece en ' + e.datos.usos + ' rutinas tuyas'}. Si lo sacás, también desaparece de ahí. Esto no afecta a ningún otro entrenador.`,
          'Sacarlo igual')) return;
        try { await api('/ejercicios/' + ej.id + '?forzar=1', { method: 'DELETE' }); await recargar();
          avisar('Lo sacamos del banco y de tus rutinas'); }
        catch (e2) { avisar(e2.message, 'mal'); }
      } else avisar(e.message, 'mal');
    }
  }

  const porGrupo = {};
  ejercicios.forEach(e => { (porGrupo[e.grupo || 'Sin grupo'] ||= []).push(e); });

  return (<div>
    <div className="row" style={{ marginBottom: 8 }}>
      <h2>Tu banco de ejercicios</h2>
      <button className="btn chico" onClick={() => setForm({ nombre: '', grupo: '', video_url: '' })}>Sumar uno</button>
    </div>
    <p className="suave" style={{ marginBottom: 18 }}>
      {ejercicios.length} ejercicio{ejercicios.length === 1 ? '' : 's'} cargados. El video se pega una sola vez.
    </p>

    {!ejercicios.length &&
      <div className="vacio"><p>Tu banco todavía está vacío. El primero es el que más cuesta.</p>
        <button className="btn chico" onClick={() => setForm({ nombre: '', grupo: '', video_url: '' })}>Cargar el primero</button></div>}

    {Object.keys(porGrupo).sort().map(g => (
      <div key={g}>
        <h3 style={{ margin: '20px 0 10px' }}>{g}</h3>
        {porGrupo[g].map(e => (
          <div className="card" key={e.id} style={{ padding: '14px 16px' }}>
            <div className="row">
              <div>
                <b>{e.nombre}</b>
                {e.video_url
                  ? <div><a className="video" href={e.video_url} target="_blank" rel="noopener">Ver el video</a></div>
                  : <div className="chico">Sin video todavía</div>}
              </div>
              <div style={{ display: 'flex', gap: 6 }}>
                <button className="btn linea chico" onClick={() => setForm(e)}>Editar</button>
                <button className="btn riesgo chico" onClick={() => borrar(e)}>Sacar</button>
              </div>
            </div>
          </div>))}
      </div>))}

    {form &&
      <Modal titulo={form.id ? 'Editar ejercicio' : 'Nuevo ejercicio'}
        sub="Queda guardado en tu banco y lo reutilizás siempre." cerrar={() => setForm(null)}>
        <label>Nombre<input autoFocus value={form.nombre || ''}
          onChange={e => setForm({ ...form, nombre: e.target.value })} placeholder="Sentadilla con barra" /></label>
        <label>Grupo muscular
          <input list="grupos" value={form.grupo || ''}
            onChange={e => setForm({ ...form, grupo: e.target.value })} placeholder="Piernas" />
          <datalist id="grupos">{grupos.map(g => <option key={g} value={g} />)}</datalist>
          <span className="chico">No importa cómo lo escribas: "pecho" y "Pecho" son el mismo grupo.</span>
        </label>
        <label>Link del video<input value={form.video_url || ''}
          onChange={e => setForm({ ...form, video_url: e.target.value })}
          placeholder="Pegá el link de YouTube o Instagram" /></label>
        <button className="btn" onClick={guardar} disabled={!String(form.nombre || '').trim()}>Guardar</button>
        <button className="btn linea" style={{ marginTop: 10 }} onClick={() => setForm(null)}>Cancelar</button>
      </Modal>}
  </div>);
}

/* ---------- alumnos ---------- */
function Alumnos({ clientes, recargar, abrir }) {
  const [form, setForm] = useState(null);
  const { avisar } = usarAviso();

  async function crear() {
    try { await api('/clientes', { method: 'POST', body: form }); setForm(null); await recargar(); avisar('Alumno agregado'); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  const porRenovar = clientes.filter(c => { const d = diasRestantes(c.inicio); return d !== null && d <= 7; });

  return (<div>
    {!!porRenovar.length &&
      <div className="recordatorio">
        <h3>Se termina el plan de {porRenovar.length === 1 ? porRenovar[0].nombre : porRenovar.length + ' alumnos'}</h3>
        <p className="suave">
          {porRenovar.map(c => {
            const d = diasRestantes(c.inicio);
            return c.nombre + (d < 0 ? ' (ya cumplido)' : d === 0 ? ' (hoy)' : ` (${fmtLargo(finPlan(c.inicio))})`);
          }).join(' · ')}
        </p>
      </div>}

    <div className="row" style={{ marginBottom: 16 }}>
      <h2>Tus alumnos</h2>
      <button className="btn chico" onClick={() => setForm({ nombre: '', contacto: '', inicio: hoyISO() })}>Sumar alumno</button>
    </div>

    {!clientes.length &&
      <div className="vacio"><p>Todavía no cargaste ningún alumno.</p>
        <button className="btn chico" onClick={() => setForm({ nombre: '', contacto: '', inicio: hoyISO() })}>Sumar el primero</button></div>}

    {clientes.map(c => (
      <div className="card tap" key={c.id} onClick={() => abrir(c.id)}>
        <div className="row"><h3>{c.nombre}</h3><span className="chico">Ver ficha →</span></div>
        <Progreso inicio={c.inicio} />
      </div>))}

    {form &&
      <Modal titulo="Nuevo alumno" sub="Después le armás la rutina." cerrar={() => setForm(null)}>
        <label>Nombre<input autoFocus value={form.nombre} onChange={e => setForm({ ...form, nombre: e.target.value })} /></label>
        <label>Teléfono o mail<input value={form.contacto} placeholder="Opcional"
          onChange={e => setForm({ ...form, contacto: e.target.value })} /></label>
        <label>¿Cuándo arrancó el plan?<input type="date" value={form.inicio}
          onChange={e => setForm({ ...form, inicio: e.target.value })} /></label>
        <button className="btn" onClick={crear} disabled={!form.nombre.trim()}>Guardar alumno</button>
      </Modal>}
  </div>);
}

/* ---------- importar Excel ---------- */
function Importar({ clienteId, cerrar, listo }) {
  const [filas, setFilas] = useState(null);
  const [nombre, setNombre] = useState('Rutina importada');
  const [subiendo, setSubiendo] = useState(false);
  const { avisar } = usarAviso();

  function leer(archivo) {
    const lector = new FileReader();
    lector.onload = ev => {
      try {
        const libro = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
        const crudas = XLSX.utils.sheet_to_json(libro.Sheets[libro.SheetNames[0]], { defval: '' });
        const norm = crudas.map(r => {
          const o = {};
          Object.keys(r).forEach(k => { o[String(k).trim().toLowerCase()] = r[k]; });
          return {
            dia: o['dia'] || o['día'] || 'Día 1',
            dia_sugerido: o['dia sugerido'] || o['día sugerido'] || '',
            ejercicio: o['ejercicio'] || '', grupo: o['grupo'] || '',
            series: o['series'] || '', reps: o['reps'] || o['repeticiones'] || '',
            nota: o['nota'] || '', video: o['video'] || o['link'] || ''
          };
        }).filter(r => String(r.ejercicio).trim());
        if (!norm.length) { avisar('No encontramos ejercicios. Fijate que tenga la columna "ejercicio".', 'mal'); return; }
        setFilas(norm);
        if (archivo.name) setNombre(archivo.name.replace(/\.(xlsx|xls|csv)$/i, ''));
      } catch { avisar('No pudimos leer ese archivo. ¿Es un Excel o CSV?', 'mal'); }
    };
    lector.readAsArrayBuffer(archivo);
  }

  async function importar() {
    setSubiendo(true);
    try {
      const r = await api('/clientes/' + clienteId + '/importar', { method: 'POST', body: { nombre, filas } });
      avisar(`Importamos ${r.resumen.ejercicios} ejercicios en ${r.resumen.dias} días`);
      listo(r.rutina.id);
    } catch (e) { avisar(e.message, 'mal'); setSubiendo(false); }
  }

  return (
    <Modal titulo="Traer una rutina desde Excel"
      sub="Los ejercicios que ya estén en tu banco se reutilizan, no se duplican." cerrar={cerrar}>
      {!filas ? (<div>
        <label>Archivo (.xlsx o .csv)
          <input type="file" accept=".xlsx,.xls,.csv" onChange={e => e.target.files[0] && leer(e.target.files[0])} /></label>
        <p className="chico">Columnas: <b>dia, ejercicio, series, reps, nota, video, grupo</b>. El orden no importa.</p>
        <a className="video" href="/plantilla-rutina.xlsx" download style={{ display: 'block', marginTop: 12 }}>
          Bajar la plantilla de ejemplo</a>
        <button className="btn linea" style={{ marginTop: 14 }} onClick={cerrar}>Cancelar</button>
      </div>) : (<div>
        <label>Nombre de la rutina<input value={nombre} onChange={e => setNombre(e.target.value)} /></label>
        <p className="chico">Encontramos <b>{filas.length} ejercicios</b> en {new Set(filas.map(f => f.dia)).size} días.</p>
        <table className="tabla">
          <thead><tr><th>Día</th><th>Ejercicio</th><th>Series</th><th>Reps</th></tr></thead>
          <tbody>{filas.slice(0, 6).map((f, i) =>
            <tr key={i}><td>{f.dia}</td><td>{f.ejercicio}</td><td>{f.series}</td><td>{f.reps}</td></tr>)}</tbody>
        </table>
        {filas.length > 6 && <p className="chico">y {filas.length - 6} más...</p>}
        <button className="btn" style={{ marginTop: 14 }} onClick={importar} disabled={subiendo}>
          {subiendo ? 'Importando...' : 'Importar esta rutina'}</button>
        <button className="btn linea" style={{ marginTop: 10 }} onClick={() => setFilas(null)}>Elegir otro archivo</button>
      </div>)}
    </Modal>);
}

/* ---------- ficha del alumno ---------- */
function Ficha({ id, volver, abrirRutina, clientes, plantillas, recargarPlantillas }) {
  const [c, setC] = useState(null);
  const [nueva, setNueva] = useState(null);
  const [importar, setImportar] = useState(false);
  const [duplicar, setDuplicar] = useState(null);
  const [usarPlantilla, setUsarPlantilla] = useState(false);
  const [editar, setEditar] = useState(null);
  const { avisar, confirmar } = usarAviso();

  const cargar = useCallback(async () => {
    try { setC(await api('/clientes/' + id)); } catch (e) { avisar(e.message, 'mal'); }
  }, [id, avisar]);
  useEffect(() => { cargar(); }, [cargar]);

  if (!c) return <p className="suave">Cargando...</p>;
  const link = location.origin + '/r/' + c.token;

  async function crearRutina() {
    const dias = [];
    for (let i = 0; i < nueva.cantidad; i++)
      dias.push({ nombre: (nueva.dias[i] || {}).nombre || `Día ${i + 1}`,
                  dia_sugerido: (nueva.dias[i] || {}).dia || '' });
    try {
      const r = await api('/clientes/' + id + '/rutinas', { method: 'POST', body: { nombre: nueva.nombre, dias } });
      setNueva(null); avisar('Rutina creada'); abrirRutina(r.id);
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function copiarA(destinoId) {
    try {
      const r = await api('/rutinas/' + duplicar + '/duplicar', { method: 'POST', body: { cliente_id: destinoId } });
      setDuplicar(null); avisar('Rutina copiada'); abrirRutina(r.id);
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function aplicarPlantilla(plantillaId) {
    try {
      const r = await api('/plantillas/' + plantillaId + '/usar', { method: 'POST', body: { cliente_id: id } });
      setUsarPlantilla(false); avisar('Rutina creada desde la plantilla'); abrirRutina(r.id);
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function guardarPlantilla(rutinaId, nombreRutina) {
    try {
      await api('/rutinas/' + rutinaId + '/plantilla', { method: 'POST', body: { nombre: nombreRutina } });
      await recargarPlantillas(); avisar('Guardada como plantilla');
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function borrarRutina(r) {
    if (!await confirmar('¿Eliminamos esta rutina?', `"${r.nombre}" y todos sus días.`, 'Sí, eliminar')) return;
    try { await api('/rutinas/' + r.id, { method: 'DELETE' }); cargar(); avisar('Rutina eliminada'); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  async function guardarDatos() {
    try { await api('/clientes/' + id, { method: 'PATCH', body: editar }); setEditar(null); cargar(); avisar('Datos actualizados'); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  async function borrarAlumno() {
    if (!await confirmar('¿Eliminamos a ' + c.nombre + '?', 'Se borran sus rutinas y su seguimiento.', 'Sí, eliminar')) return;
    try { await api('/clientes/' + id, { method: 'DELETE' }); avisar('Alumno eliminado'); volver(); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  return (<div>
    <button className="volver" onClick={volver}>← Tus alumnos</button>
    <div className="row"><h2>{c.nombre}</h2>
      <button className="btn linea chico" onClick={() => setEditar({ nombre: c.nombre, contacto: c.contacto || '', inicio: c.inicio })}>Editar</button>
    </div>
    <p className="suave">{c.contacto || 'Sin contacto cargado'}</p>
    <Progreso inicio={c.inicio} />

    <div className="card" style={{ marginTop: 16 }}>
      <h3>Su link personal</h3>
      <p className="suave" style={{ margin: '4px 0 12px' }}>Entra sin contraseña, desde el celular.</p>
      <input readOnly value={link} onFocus={e => e.target.select()} />
      <div className="dos" style={{ marginTop: 10 }}>
        <button className="btn linea chico" onClick={() =>
          navigator.clipboard.writeText(link).then(() => avisar('Link copiado')).catch(() => avisar('Copialo a mano', 'mal'))}>
          Copiar link</button>
        <a className="btn linea chico" style={{ textAlign: 'center', textDecoration: 'none', display: 'block' }}
          href={'https://wa.me/?text=' + encodeURIComponent('Hola ' + c.nombre + ', acá tenés tu rutina: ' + link)}
          target="_blank" rel="noopener">Mandar por WhatsApp</a>
      </div>
    </div>

    <div className="row" style={{ margin: '20px 0 12px' }}>
      <h3>Rutinas</h3>
      <button className="btn chico" onClick={() => setNueva({ nombre: 'Mes ' + (c.rutinas.length + 1), cantidad: 3, dias: [] })}>Nueva</button>
    </div>
    <div className="dos" style={{ marginBottom: 14 }}>
      <button className="btn linea chico" onClick={() => setImportar(true)}>Importar Excel</button>
      <button className="btn linea chico" onClick={() => setUsarPlantilla(true)}>Usar plantilla</button>
    </div>

    {!c.rutinas.length && <div className="vacio"><p>Todavía no tiene rutinas.</p></div>}
    {c.rutinas.map(r => (
      <div className="card" key={r.id}>
        <div className="row"><h3>{r.nombre}</h3><span className="chico">desde {fmt(r.inicio)}</span></div>
        <div className="dos" style={{ marginTop: 12 }}>
          <button className="btn linea chico" onClick={() => abrirRutina(r.id)}>Editar</button>
          <button className="btn linea chico" onClick={() => setDuplicar(r.id)}>Copiar a otro</button>
          <button className="btn linea chico" onClick={() => guardarPlantilla(r.id, r.nombre)}>Guardar plantilla</button>
          <button className="btn riesgo chico" onClick={() => borrarRutina(r)}>Eliminar</button>
        </div>
      </div>))}

    <h3 style={{ margin: '22px 0 10px' }}>Lo que carga tu alumno</h3>
    {!c.registros.length && !c.seguimiento.length &&
      <div className="vacio"><p>Todavía no registró entrenamientos.</p></div>}

    {c.registros.map(sem => (
      <div className="semana" key={sem.semana}>
        <h3 style={{ marginBottom: 8 }}>Semana {sem.semana}</h3>
        {sem.dias.map((d, i) => (
          <div className="card" key={i} style={{ padding: '14px 16px' }}>
            <div className="row">
              <b>{d.dia || 'Sin día'}</b>
              <span className="chico">{fmt(d.fecha)}</span>
            </div>
            {d.rutina && <p className="chico">{d.rutina}</p>}
            {d.ejercicios.map((e, j) => (
              <p className="suave" key={j} style={{ marginTop: 6 }}>
                <b style={{ color: 'var(--tinta)' }}>{e.nombre}</b>{' — '}
                {e.series.map(s => `${s.kg}kg × ${s.reps}`).join(' · ')}
              </p>))}
          </div>))}
      </div>))}

    {!!c.seguimiento.length &&
      <div className="card">
        <h3>Peso corporal</h3>
        {c.seguimiento.map(s =>
          <p className="suave" key={s.id} style={{ marginTop: 6 }}>
            {fmt(s.fecha)}{s.semana ? ` · semana ${s.semana}` : ''} · {s.peso} kg {s.nota ? '· ' + s.nota : ''}</p>)}
      </div>}

    <button className="btn riesgo chico" onClick={borrarAlumno}>Eliminar alumno</button>

    {editar &&
      <Modal titulo="Editar datos" cerrar={() => setEditar(null)}>
        <label>Nombre<input value={editar.nombre} onChange={e => setEditar({ ...editar, nombre: e.target.value })} /></label>
        <label>Teléfono o mail<input value={editar.contacto} onChange={e => setEditar({ ...editar, contacto: e.target.value })} /></label>
        <label>Arranque del plan
          <input type="date" value={editar.inicio || ''} onChange={e => setEditar({ ...editar, inicio: e.target.value })} />
          <span className="chico">Cambiala cuando renueve, así el conteo de semanas arranca de nuevo.</span>
        </label>
        <button className="btn" onClick={guardarDatos}>Guardar</button>
      </Modal>}

    {nueva &&
      <Modal titulo="Nueva rutina" sub="Definí los días y después cargás los ejercicios." cerrar={() => setNueva(null)}>
        <label>Nombre<input autoFocus value={nueva.nombre} onChange={e => setNueva({ ...nueva, nombre: e.target.value })} /></label>
        <label>¿Cuántos días entrena?
          <select value={nueva.cantidad} onChange={e => setNueva({ ...nueva, cantidad: +e.target.value })}>
            {[1, 2, 3, 4, 5, 6].map(n => <option key={n} value={n}>{n} días</option>)}
          </select></label>
        {Array.from({ length: nueva.cantidad }).map((_, i) => (
          <div className="dos" key={i}>
            <label>Día {i + 1}<input placeholder="Tren inferior" onChange={e => {
              const ds = [...nueva.dias]; ds[i] = { ...ds[i], nombre: e.target.value }; setNueva({ ...nueva, dias: ds });
            }} /></label>
            <label>Día sugerido<input placeholder="Lunes (opcional)" onChange={e => {
              const ds = [...nueva.dias]; ds[i] = { ...ds[i], dia: e.target.value }; setNueva({ ...nueva, dias: ds });
            }} /></label>
          </div>))}
        <button className="btn" onClick={crearRutina}>Crear rutina</button>
      </Modal>}

    {importar && <Importar clienteId={id} cerrar={() => setImportar(false)}
      listo={rid => { setImportar(false); abrirRutina(rid); }} />}

    {duplicar &&
      <Modal titulo="¿A quién se la copiamos?" cerrar={() => setDuplicar(null)}>
        <div className="lista">
          {clientes.map(x => <button className="op" key={x.id} onClick={() => copiarA(x.id)}>{x.nombre}</button>)}
        </div>
      </Modal>}

    {usarPlantilla &&
      <Modal titulo="Tus plantillas" sub="Se crea una rutina nueva para este alumno." cerrar={() => setUsarPlantilla(false)}>
        {!plantillas.length
          ? <p className="suave">Todavía no guardaste ninguna. Armá una rutina y tocá "Guardar plantilla".</p>
          : <div className="lista">
              {plantillas.map(p => <button className="op" key={p.id} onClick={() => aplicarPlantilla(p.id)}>
                <b>{p.nombre}</b> <span className="chico">{p.dias} días</span></button>)}
            </div>}
      </Modal>}
  </div>);
}

/* ---------- editor de rutina ---------- */
function Editor({ id, volver, ejercicios, recargarEjercicios }) {
  const [r, setR] = useState(null);
  const [busq, setBusq] = useState({});
  const [form, setForm] = useState(null);
  const [diaForm, setDiaForm] = useState(null);
  const arrastrando = useRef(null);
  const { avisar, confirmar } = usarAviso();

  const cargar = useCallback(async () => {
    try { setR(await api('/rutinas/' + id)); } catch (e) { avisar(e.message, 'mal'); }
  }, [id, avisar]);
  useEffect(() => { cargar(); }, [cargar]);
  if (!r) return <p className="suave">Cargando...</p>;

  async function guardarItem() {
    try {
      if (form.item_id) {
        await api('/items/' + form.item_id, { method: 'PATCH',
          body: { series: form.series, reps: form.reps, nota: form.nota } });
        avisar('Ejercicio actualizado');
      } else {
        let ejId = form.ejercicio_id;
        if (!ejId) {
          const e = await api('/ejercicios', { method: 'POST',
            body: { nombre: form.nombreNuevo, grupo: form.grupo, video_url: form.video } });
          ejId = e.id; await recargarEjercicios();
        }
        await api('/dias/' + form.diaId + '/items', { method: 'POST',
          body: { ejercicio_id: ejId, series: form.series, reps: form.reps, nota: form.nota } });
        setBusq({ ...busq, [form.diaId]: '' });
        avisar('Ejercicio agregado');
      }
      setForm(null); cargar();
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function quitar(it) {
    if (!await confirmar('¿Sacamos este ejercicio de la rutina?', it.ejercicio, 'Sí, sacarlo')) return;
    try { await api('/items/' + it.id, { method: 'DELETE' }); setForm(null); cargar(); avisar('Listo'); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  async function guardarDia() {
    try {
      if (diaForm.id) { await api('/dias/' + diaForm.id, { method: 'PATCH', body: diaForm }); avisar('Día actualizado'); }
      else { await api('/rutinas/' + id + '/dias', { method: 'POST', body: diaForm }); avisar('Día agregado'); }
      setDiaForm(null); cargar();
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function borrarDia(d) {
    if (!await confirmar('¿Eliminamos este día?', `"${d.nombre}" y sus ejercicios.`, 'Sí, eliminar')) return;
    try { await api('/dias/' + d.id, { method: 'DELETE' }); setDiaForm(null); cargar(); avisar('Día eliminado'); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  // Reordenar: arrastre en escritorio, flechas en el celular.
  async function reordenar(dia, desde, hacia) {
    if (hacia < 0 || hacia >= dia.items.length || desde === hacia) return;
    const ids = dia.items.map(i => i.id);
    const [m] = ids.splice(desde, 1); ids.splice(hacia, 0, m);
    const copia = { ...r, dias: r.dias.map(d => d.id !== dia.id ? d
      : { ...d, items: ids.map(i => d.items.find(x => x.id === i)) }) };
    setR(copia);
    try { await api('/dias/' + dia.id + '/orden', { method: 'PATCH', body: { ids } }); }
    catch (e) { avisar(e.message, 'mal'); cargar(); }
  }

  return (<div>
    <button className="volver" onClick={volver}>← Volver a la ficha</button>
    <h2>{r.nombre}</h2>
    <p className="suave" style={{ marginBottom: 18 }}>
      Tocá un ejercicio para cambiarle series o repeticiones. Arrastralo (o usá las flechas) para reordenar.
    </p>

    {r.dias.map((d, i) => {
      const q = busq[d.id] || '';
      const hits = q ? ejercicios.filter(e => e.nombre.toLowerCase().includes(q.toLowerCase())).slice(0, 5) : [];
      return (
        <div className="dia" key={d.id}>
          <div className="row">
            <h3>{d.nombre || 'Día ' + (i + 1)}</h3>
            <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
              {d.dia_sugerido && <span className="globo">{d.dia_sugerido}</span>}
              <button className="btn linea chico" onClick={() => setDiaForm(d)}>Editar día</button>
            </div>
          </div>

          {!d.items.length && <p className="suave" style={{ margin: '10px 0' }}>Sin ejercicios todavía.</p>}
          {d.items.map((it, idx) => (
            <div className="ej" key={it.id} draggable
              onDragStart={() => { arrastrando.current = { dia: d.id, idx }; }}
              onDragOver={e => e.preventDefault()}
              onDrop={e => { e.preventDefault();
                if (arrastrando.current && arrastrando.current.dia === d.id) reordenar(d, arrastrando.current.idx, idx);
                arrastrando.current = null; }}>
              <div className="ej-top">
                <div style={{ display: 'flex', gap: 4 }}>
                  <span className="mango" title="Arrastrar">⠿</span>
                  <div>
                    <b>{it.ejercicio}</b>
                    {it.video_url
                      ? <div><a className="video" href={it.video_url} target="_blank" rel="noopener">Ver el video</a></div>
                      : <div className="chico">Sin video</div>}
                    {it.nota && <div className="chico">{it.nota}</div>}
                  </div>
                </div>
                <div style={{ textAlign: 'right' }}>
                  <div className="series">{it.series}×{it.reps}</div>
                  <div style={{ display: 'flex', gap: 4, marginTop: 6, justifyContent: 'flex-end' }}>
                    <button className="mini" onClick={() => reordenar(d, idx, idx - 1)} disabled={idx === 0} title="Subir">↑</button>
                    <button className="mini" onClick={() => reordenar(d, idx, idx + 1)} disabled={idx === d.items.length - 1} title="Bajar">↓</button>
                    <button className="btn linea chico" style={{ padding: '5px 10px', fontSize: 12.5 }}
                      onClick={() => setForm({ item_id: it.id, titulo: it.ejercicio, series: it.series || '',
                        reps: it.reps || '', nota: it.nota || '' })}>Cambiar</button>
                  </div>
                </div>
              </div>
            </div>))}

          <label style={{ marginTop: 14 }}>Buscar en tu banco
            <input value={q} placeholder="Escribí el nombre..." autoComplete="off"
              onChange={e => setBusq({ ...busq, [d.id]: e.target.value })} /></label>
          {q &&
            <div className="lista">
              {hits.map(e => (
                <button className="op" key={e.id} onClick={() => setForm({ diaId: d.id, ejercicio_id: e.id,
                  titulo: e.nombre, series: '4', reps: '10', nota: '' })}>
                  <b>{e.nombre}</b> <span className="chico">{e.grupo || ''}</span></button>))}
              <button className="op" style={{ color: 'var(--verde)' }}
                onClick={() => setForm({ diaId: d.id, ejercicio_id: null, nombreNuevo: q, titulo: q,
                  series: '4', reps: '10', nota: '', grupo: '', video: '' })}>
                <b>Crear "{q}"</b> y sumarlo al banco</button>
            </div>}
        </div>);
    })}

    <button className="btn linea" onClick={() => setDiaForm({ nombre: 'Día ' + (r.dias.length + 1), dia_sugerido: '' })}>
      Agregar otro día</button>

    {form &&
      <Modal titulo={form.titulo} sub={form.item_id ? 'Cambiá lo que necesites.' : '¿Cómo lo hace tu alumno?'}
        cerrar={() => setForm(null)}>
        {form.ejercicio_id === null && !form.item_id && (<div>
          <label>Link del video<input value={form.video} placeholder="Opcional"
            onChange={e => setForm({ ...form, video: e.target.value })} /></label>
          <label>Grupo muscular<input value={form.grupo} placeholder="Opcional"
            onChange={e => setForm({ ...form, grupo: e.target.value })} /></label>
        </div>)}
        <div className="dos">
          <label>Series<input value={form.series} onChange={e => setForm({ ...form, series: e.target.value })} /></label>
          <label>Repeticiones<input value={form.reps} onChange={e => setForm({ ...form, reps: e.target.value })} /></label>
        </div>
        <label>Nota para el alumno<input value={form.nota} placeholder="Opcional"
          onChange={e => setForm({ ...form, nota: e.target.value })} /></label>
        <button className="btn" onClick={guardarItem}>{form.item_id ? 'Guardar cambios' : 'Agregar a la rutina'}</button>
        {form.item_id &&
          <button className="btn riesgo" style={{ marginTop: 10 }}
            onClick={() => quitar({ id: form.item_id, ejercicio: form.titulo })}>Sacar de la rutina</button>}
      </Modal>}

    {diaForm &&
      <Modal titulo={diaForm.id ? 'Editar día' : 'Nuevo día'} cerrar={() => setDiaForm(null)}>
        <label>Nombre<input autoFocus value={diaForm.nombre || ''}
          onChange={e => setDiaForm({ ...diaForm, nombre: e.target.value })} /></label>
        <label>Día sugerido<input value={diaForm.dia_sugerido || ''} placeholder="Lunes (opcional)"
          onChange={e => setDiaForm({ ...diaForm, dia_sugerido: e.target.value })} /></label>
        <button className="btn" onClick={guardarDia}>Guardar</button>
        {diaForm.id &&
          <button className="btn riesgo" style={{ marginTop: 10 }} onClick={() => borrarDia(diaForm)}>Eliminar este día</button>}
      </Modal>}
  </div>);
}

/* ---------- agenda ---------- */
function Agenda({ clientes }) {
  const [turnos, setTurnos] = useState([]);
  const [form, setForm] = useState(null);
  const { avisar, confirmar } = usarAviso();

  const cargar = useCallback(async () => {
    try { setTurnos(await api('/turnos')); } catch (e) { avisar(e.message, 'mal'); }
  }, [avisar]);
  useEffect(() => { cargar(); }, [cargar]);

  async function guardar() {
    try {
      if (form.id) await api('/turnos/' + form.id, { method: 'PATCH', body: form });
      else await api('/turnos', { method: 'POST', body: form });
      setForm(null); await cargar(); avisar('Turno guardado');
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function borrar(t) {
    if (!await confirmar('¿Eliminamos este turno?', `${t.alumno}, ${DIAS[t.dia_semana]} ${t.hora}`, 'Sí, eliminar')) return;
    try { await api('/turnos/' + t.id, { method: 'DELETE' }); await cargar(); avisar('Turno eliminado'); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  const choques = turnos.filter(t => t.choca);
  const finDe = t => {
    const [h, m] = t.hora.split(':').map(Number);
    const total = h * 60 + m + (t.duracion || 60);
    return String(Math.floor(total / 60) % 24).padStart(2, '0') + ':' + String(total % 60).padStart(2, '0');
  };

  return (<div>
    <div className="row" style={{ marginBottom: 8 }}>
      <h2>Tu semana</h2>
      <button className="btn chico" disabled={!clientes.length}
        onClick={() => setForm({ cliente_id: clientes[0].id, dia_semana: 1, hora: '09:00', duracion: 60, nota: '' })}>
        Sumar turno</button>
    </div>

    {!clientes.length && <div className="vacio"><p>Primero cargá alumnos para poder darles horario.</p></div>}

    {!!choques.length &&
      <div className="recordatorio" style={{ borderLeftColor: 'var(--coral)' }}>
        <h3>Tenés {choques.length / 2 >= 1 ? 'horarios superpuestos' : 'un horario superpuesto'}</h3>
        <p className="suave">{[...new Set(choques.map(t => DIAS[t.dia_semana]))].join(', ')}: fijate los turnos marcados abajo.</p>
      </div>}

    {[1, 2, 3, 4, 5, 6, 0].map(d => {
      const delDia = turnos.filter(t => t.dia_semana === d);
      if (!delDia.length) return null;
      return (
        <div className="dia" key={d}>
          <h3 style={{ marginBottom: 10 }}>{DIAS[d]}</h3>
          {delDia.map(t => (
            <div className="ej" key={t.id}>
              <div className="ej-top">
                <div>
                  <b>{t.alumno}</b>
                  <div className="chico">{t.hora} a {finDe(t)} · {t.duracion} min {t.nota ? '· ' + t.nota : ''}</div>
                  {t.choca && <span className="globo alerta" style={{ marginTop: 6 }}>Se pisa con otro turno</span>}
                </div>
                <div style={{ display: 'flex', gap: 6 }}>
                  <button className="btn linea chico" onClick={() => setForm(t)}>Editar</button>
                  <button className="btn riesgo chico" onClick={() => borrar(t)}>Quitar</button>
                </div>
              </div>
            </div>))}
        </div>);
    })}

    {!turnos.length && !!clientes.length &&
      <div className="vacio"><p>Todavía no cargaste horarios.</p>
        <button className="btn chico"
          onClick={() => setForm({ cliente_id: clientes[0].id, dia_semana: 1, hora: '09:00', duracion: 60, nota: '' })}>
          Cargar el primero</button></div>}

    {form &&
      <Modal titulo={form.id ? 'Editar turno' : 'Nuevo turno'}
        sub="Es el horario fijo semanal del alumno." cerrar={() => setForm(null)}>
        {!form.id &&
          <label>Alumno
            <select value={form.cliente_id} onChange={e => setForm({ ...form, cliente_id: e.target.value })}>
              {clientes.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
            </select></label>}
        <label>Día
          <select value={form.dia_semana} onChange={e => setForm({ ...form, dia_semana: +e.target.value })}>
            {[1, 2, 3, 4, 5, 6, 0].map(d => <option key={d} value={d}>{DIAS[d]}</option>)}
          </select></label>
        <div className="dos">
          <label>Hora<input type="time" value={form.hora} onChange={e => setForm({ ...form, hora: e.target.value })} /></label>
          <label>Duración (min)<input type="number" value={form.duracion}
            onChange={e => setForm({ ...form, duracion: +e.target.value })} /></label>
        </div>
        <label>Nota<input value={form.nota || ''} placeholder="Opcional"
          onChange={e => setForm({ ...form, nota: e.target.value })} /></label>
        <button className="btn" onClick={guardar}>Guardar turno</button>
      </Modal>}
  </div>);
}

/* ---------- plantillas ---------- */
function Plantillas({ plantillas, recargar, clientes }) {
  const [ver, setVer] = useState(null);
  const [usar, setUsar] = useState(null);
  const { avisar, confirmar } = usarAviso();

  async function abrir(id) {
    try { setVer(await api('/plantillas/' + id)); } catch (e) { avisar(e.message, 'mal'); }
  }
  async function aplicar(clienteId) {
    try { await api('/plantillas/' + usar + '/usar', { method: 'POST', body: { cliente_id: clienteId } });
      setUsar(null); avisar('Rutina creada para el alumno'); }
    catch (e) { avisar(e.message, 'mal'); }
  }
  async function borrar(p) {
    if (!await confirmar('¿Eliminamos esta plantilla?', p.nombre, 'Sí, eliminar')) return;
    try { await api('/plantillas/' + p.id, { method: 'DELETE' }); await recargar(); avisar('Plantilla eliminada'); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  return (<div>
    <h2>Tus plantillas</h2>
    <p className="suave" style={{ marginBottom: 18 }}>
      Rutinas base que reutilizás con cualquier alumno. Se crean desde la ficha, con "Guardar plantilla".
    </p>
    {!plantillas.length && <div className="vacio"><p>Todavía no guardaste ninguna plantilla.</p></div>}
    {plantillas.map(p => (
      <div className="card" key={p.id}>
        <div className="row"><h3>{p.nombre}</h3><span className="globo">{p.dias} días</span></div>
        <div className="dos" style={{ marginTop: 12 }}>
          <button className="btn linea chico" onClick={() => abrir(p.id)}>Ver</button>
          <button className="btn chico" onClick={() => setUsar(p.id)} disabled={!clientes.length}>Usar con un alumno</button>
          <button className="btn riesgo chico" onClick={() => borrar(p)}>Eliminar</button>
        </div>
      </div>))}

    {ver &&
      <Modal titulo={ver.nombre} cerrar={() => setVer(null)}>
        {ver.dias.map(d => (
          <div key={d.id} style={{ marginBottom: 14 }}>
            <b>{d.nombre}</b>{d.dia_sugerido ? <span className="globo" style={{ marginLeft: 8 }}>{d.dia_sugerido}</span> : null}
            {d.items.map(i => <p className="suave" key={i.id}>{i.ejercicio} — {i.series}×{i.reps}</p>)}
          </div>))}
      </Modal>}

    {usar &&
      <Modal titulo="¿Para qué alumno?" cerrar={() => setUsar(null)}>
        <div className="lista">
          {clientes.map(c => <button className="op" key={c.id} onClick={() => aplicar(c.id)}>{c.nombre}</button>)}
        </div>
      </Modal>}
  </div>);
}

/* ---------- administración ---------- */
function Admin() {
  const [cuentas, setCuentas] = useState(null);
  const { avisar, confirmar } = usarAviso();

  const cargar = useCallback(async () => {
    try { setCuentas(await api('/admin/cuentas')); } catch (e) { avisar(e.message, 'mal'); setCuentas([]); }
  }, [avisar]);
  useEffect(() => { cargar(); }, [cargar]);

  if (cuentas === null) return <p className="suave">Cargando...</p>;

  async function cambiarPlan(c, plan) {
    try { await api('/admin/cuentas/' + c.id, { method: 'PATCH', body: { plan } }); await cargar(); avisar('Plan actualizado'); }
    catch (e) { avisar(e.message, 'mal'); }
  }
  async function borrar(c) {
    if (!await confirmar('¿Eliminar la cuenta de ' + c.nombre + '?',
      'Se borran sus alumnos, rutinas y ejercicios. No hay vuelta atrás.', 'Sí, eliminar')) return;
    try { await api('/admin/cuentas/' + c.id, { method: 'DELETE' }); await cargar(); avisar('Cuenta eliminada'); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  return (<div>
    <h2>Cuentas del sistema</h2>
    <p className="suave" style={{ marginBottom: 18 }}>
      {cuentas.length} cuenta{cuentas.length === 1 ? '' : 's'} · activás, pausás o eliminás entrenadores.
    </p>
    {cuentas.map(c => (
      <div className="card" key={c.id}>
        <div className="row">
          <div>
            <h3>{c.nombre} {c.rol === 'admin' && <span className="globo">admin</span>}</h3>
            <p className="suave">{c.email}</p>
            <p className="chico">{c.alumnos} alumnos · {c.ejercicios} ejercicios · desde {fmt(c.creada)}</p>
          </div>
          <span className={'globo ' + (c.plan === 'activo' ? 'ok' : c.plan === 'pausado' ? 'aviso' : '')}>{c.plan}</span>
        </div>
        <div className="dos" style={{ marginTop: 12 }}>
          <select value={c.plan} onChange={e => cambiarPlan(c, e.target.value)} style={{ marginTop: 0 }}>
            <option value="prueba">En prueba</option>
            <option value="activo">Activo (paga)</option>
            <option value="pausado">Pausado</option>
          </select>
          {c.rol !== 'admin' && <button className="btn riesgo chico" onClick={() => borrar(c)}>Eliminar cuenta</button>}
        </div>
      </div>))}
  </div>);
}

/* ---------- vista del alumno ---------- */
function VistaAlumno({ token }) {
  const [d, setD] = useState(null);
  const [error, setError] = useState('');
  const [peso, setPeso] = useState('');
  const [nota, setNota] = useState('');
  const [log, setLog] = useState({});
  const { avisar } = usarAviso();

  const cargar = useCallback(() => {
    fetch('/api/alumno/' + token).then(r => r.json())
      .then(x => x.error ? setError(x.error) : setD(x))
      .catch(() => setError('No pudimos cargar tu rutina.'));
  }, [token]);
  useEffect(cargar, [cargar]);

  async function anotar(item) {
    const v = log[item.id] || {};
    if (!v.kg || !v.reps) { avisar('Cargá el peso y las repeticiones', 'mal'); return; }
    const r = await fetch('/api/alumno/' + token + '/series', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ item_id: item.id, kg: v.kg, reps: v.reps })
    }).then(x => x.json());
    setLog({ ...log, [item.id]: {} });
    if (r.hoy) setD(prev => ({ ...prev, hoy: r.hoy }));
  }

  async function borrarSerie(id) {
    const r = await fetch('/api/alumno/' + token + '/series/' + id, { method: 'DELETE' }).then(x => x.json());
    if (r.hoy) setD(prev => ({ ...prev, hoy: r.hoy }));
    avisar('Serie borrada');
  }

  async function guardarPeso() {
    if (!peso) { avisar('Cargá tu peso', 'mal'); return; }
    await fetch('/api/alumno/' + token + '/seguimiento', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ peso, nota })
    });
    setPeso(''); setNota(''); avisar('Seguimiento guardado'); cargar();
  }

  if (error) return <div className="wrap"><div className="vacio"><p>{error}</p></div></div>;
  if (!d) return <div className="wrap"><p className="suave">Cargando...</p></div>;

  const hoyPorItem = {};
  (d.hoy || []).forEach(s => { (hoyPorItem[s.item_id] ||= []).push(s); });

  return (<div>
    <div className="topbar"><div className="brand"><h1>AppTrainner</h1><span className="hola">tu rutina</span></div></div>
    <div className="wrap">
      <h2>Hola, {(d.nombre || '').split(' ')[0]}</h2>
      {!d.rutina
        ? <div className="vacio" style={{ marginTop: 16 }}><p>Tu profe todavía no cargó tu rutina.</p></div>
        : (<div>
          <p className="suave" style={{ marginBottom: 18 }}>{d.rutina.nombre} · semana {d.semana}</p>
          {d.rutina.dias.map((dia, i) => (
            <div className="dia" key={dia.id}>
              <div className="row">
                <h3>{dia.nombre || 'Día ' + (i + 1)}</h3>
                {dia.dia_sugerido && <span className="globo">{dia.dia_sugerido}</span>}
              </div>
              {dia.items.map(it => {
                const hechas = hoyPorItem[it.id] || [];
                return (
                  <div className="ej" key={it.id}>
                    <div className="ej-top">
                      <div>
                        <b>{it.ejercicio}</b>
                        {it.video_url && <div><a className="video" href={it.video_url} target="_blank" rel="noopener">Ver el video</a></div>}
                        {it.nota && <div className="chico">{it.nota}</div>}
                      </div>
                      <div className="series">{it.series}×{it.reps}</div>
                    </div>

                    {!!hechas.length &&
                      <div className="hechas">
                        {hechas.map((s, n) => (
                          <div className="fila" key={s.id}>
                            <span>Serie {n + 1}: {s.kg} kg × {s.reps} {s.creado ? '· ' + hora(s.creado) : ''}</span>
                            <button onClick={() => borrarSerie(s.id)}>borrar</button>
                          </div>))}
                      </div>}

                    <div className="anotar">
                      <input type="number" inputMode="decimal" placeholder="kg"
                        value={(log[it.id] || {}).kg || ''}
                        onChange={e => setLog({ ...log, [it.id]: { ...log[it.id], kg: e.target.value } })} />
                      <input type="number" inputMode="numeric" placeholder="reps"
                        value={(log[it.id] || {}).reps || ''}
                        onChange={e => setLog({ ...log, [it.id]: { ...log[it.id], reps: e.target.value } })} />
                      <button className="btn chico" onClick={() => anotar(it)}>
                        {hechas.length ? 'Otra serie' : 'Anotar'}</button>
                    </div>
                  </div>);
              })}
            </div>))}
        </div>)}

      <div className="card">
        <h3>Tu seguimiento</h3>
        <p className="suave" style={{ marginBottom: 12 }}>Cargá tu peso cada tanto así tu profe ve cómo venís.</p>
        <div className="dos">
          <label>Peso corporal (kg)<input type="number" inputMode="decimal" value={peso} onChange={e => setPeso(e.target.value)} /></label>
          <label>¿Cómo te sentiste?<input value={nota} onChange={e => setNota(e.target.value)} placeholder="Opcional" /></label>
        </div>
        <button className="btn naranja" onClick={guardarPeso}>Guardar</button>
        {(d.seguimiento || []).slice(0, 8).map(s =>
          <p className="suave" key={s.id} style={{ marginTop: 8 }}>{fmt(s.fecha)} · {s.peso} kg</p>)}
      </div>
    </div>
  </div>);
}

/* ---------- app ---------- */
function App() {
  const ruta = location.pathname.match(/^\/r\/([A-Za-z0-9]+)/);
  const tokenAlumno = ruta ? ruta[1] : new URLSearchParams(location.search).get('alumno');

  const [entrado, setEntrado] = useState(!!sesion);
  const [perfil, setPerfil] = useState(null);
  const [tab, setTab] = useState('alumnos');
  const [clientes, setClientes] = useState([]);
  const [ejercicios, setEjercicios] = useState([]);
  const [grupos, setGrupos] = useState([]);
  const [plantillas, setPlantillas] = useState([]);
  const [clienteId, setClienteId] = useState(null);
  const [rutinaId, setRutinaId] = useState(null);
  const { avisar } = usarAviso();

  const recargarClientes = useCallback(async () => {
    try { setClientes(await api('/clientes')); } catch (e) { avisar(e.message, 'mal'); }
  }, [avisar]);
  const recargarEjercicios = useCallback(async () => {
    try { const r = await api('/ejercicios'); setEjercicios(r.ejercicios); setGrupos(r.grupos); }
    catch (e) { avisar(e.message, 'mal'); }
  }, [avisar]);
  const recargarPlantillas = useCallback(async () => {
    try { setPlantillas(await api('/plantillas')); } catch (e) { avisar(e.message, 'mal'); }
  }, [avisar]);

  useEffect(() => {
    if (!entrado || tokenAlumno) return;
    api('/perfil').then(setPerfil).catch(() => {});
    recargarClientes(); recargarEjercicios(); recargarPlantillas();
  }, [entrado, tokenAlumno, recargarClientes, recargarEjercicios, recargarPlantillas]);

  if (tokenAlumno) return <VistaAlumno token={tokenAlumno} />;
  if (!entrado) return <Entrar onEntrar={() => setEntrado(true)} />;

  const esAdmin = perfil && perfil.rol === 'admin';
  const tabs = [['alumnos', 'Alumnos'], ['agenda', 'Agenda'], ['ejercicios', 'Ejercicios'], ['plantillas', 'Plantillas']];
  if (esAdmin) tabs.push(['admin', 'Cuentas']);

  // Al cambiar de pestaña se refrescan los datos que esa vista necesita.
  function irA(k) {
    setClienteId(null); setRutinaId(null); setTab(k);
    if (k === 'alumnos') recargarClientes();
    if (k === 'ejercicios') recargarEjercicios();
    if (k === 'plantillas') recargarPlantillas();
  }

  let contenido;
  if (tab === 'admin' && esAdmin) contenido = <Admin />;
  else if (tab === 'agenda') contenido = <Agenda clientes={clientes} />;
  else if (tab === 'plantillas') contenido =
    <Plantillas plantillas={plantillas} recargar={recargarPlantillas} clientes={clientes} />;
  else if (tab === 'ejercicios') contenido =
    <Ejercicios ejercicios={ejercicios} grupos={grupos} recargar={recargarEjercicios} />;
  else if (rutinaId) contenido =
    <Editor id={rutinaId} volver={() => setRutinaId(null)} ejercicios={ejercicios} recargarEjercicios={recargarEjercicios} />;
  else if (clienteId) contenido =
    <Ficha id={clienteId} clientes={clientes} plantillas={plantillas} recargarPlantillas={recargarPlantillas}
      volver={() => { setClienteId(null); recargarClientes(); }} abrirRutina={setRutinaId} />;
  else contenido = <Alumnos clientes={clientes} recargar={recargarClientes} abrir={setClienteId} />;

  return (<div>
    <div className="topbar">
      <div className="brand">
        <h1>AppTrainner</h1>
        <span className="hola">{perfil ? perfil.nombre : ''}</span>
        <button onClick={() => { localStorage.removeItem(CLAVE); sesion = null; location.href = '/'; }}>Salir</button>
      </div>
      <div className="tabs">
        {tabs.map(([k, t]) => (
          <button key={k} className={'tab ' + (tab === k ? 'on' : '')} onClick={() => irA(k)}>{t}</button>))}
      </div>
    </div>
    <div className="wrap">
      <Escudo clave={tab + (clienteId || '') + (rutinaId || '')}>{contenido}</Escudo>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root'))
  .render(<ProveedorAviso><App /></ProveedorAviso>);
</script>
</body>
