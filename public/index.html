<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AppTrainner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@600;700;900&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --papel:#EDF0F3;        /* hoja cuadriculada */
    --grilla:#DDE3E9;
    --hoja:#FFFFFF;
    --tinta:#0F2231;        /* azul tinta, casi negro pero con temperatura */
    --gris:#5E7185;
    --borde:#D3DBE3;
    --cobalto:#1B5FD0;      /* la lapicera: acciones y números */
    --cobalto-suave:#E8EFFB;
    --carmin:#C42B3E;       /* solo errores y borrados */
    --carmin-suave:#FBEAEC;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background-color:var(--papel);
    background-image:
      linear-gradient(var(--grilla) 1px, transparent 1px),
      linear-gradient(90deg, var(--grilla) 1px, transparent 1px);
    background-size:28px 28px;
    background-position:-1px -1px;
    font-family:'Public Sans',system-ui,-apple-system,sans-serif;
    color:var(--tinta);
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0;font-family:'Chivo',system-ui,sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.15}
  h1{font-size:25px} h2{font-size:24px} h3{font-size:17px}
  p{margin:0}
  a{color:var(--cobalto)}

  /* ---------- barra superior ---------- */
  .topbar{
    background:var(--tinta);color:#fff;padding:15px 16px 0;position:sticky;top:0;z-index:20;
    border-bottom:3px solid var(--cobalto);
  }
  .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .brand h1{color:#fff;font-family:'Chivo',sans-serif;font-weight:900;font-size:20px;letter-spacing:-.03em}
  .brand .hola{color:#8FA6BA;font-size:14px}
  .brand button{
    margin-left:auto;background:none;border:0;color:#8FA6BA;font-family:inherit;
    font-size:13.5px;font-weight:600;cursor:pointer;padding:6px 2px;border-bottom:1.5px solid transparent;
  }
  .brand button:hover{color:#fff;border-bottom-color:#8FA6BA}
  .tabs{display:flex;gap:20px;overflow-x:auto}
  .tab{
    flex:0 0 auto;background:none;border:0;color:#8FA6BA;font-family:'Chivo',sans-serif;
    font-size:15px;font-weight:600;padding:6px 0 11px;cursor:pointer;
    border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap;letter-spacing:-.01em;
  }
  .tab.on{color:#fff;border-bottom-color:#fff}

  .wrap{max-width:720px;margin:0 auto;padding:22px 16px 72px}

  /* ---------- hojas ---------- */
  .card{
    background:var(--hoja);border:1px solid var(--borde);border-left:3px solid var(--cobalto);
    border-radius:4px;padding:16px 18px;margin-bottom:10px;
  }
  .card.tap{cursor:pointer}
  .card.tap:hover{border-color:var(--cobalto)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .suave{color:var(--gris);font-size:14.5px}
  .chico{font-size:13px;color:var(--gris)}

  /* ---------- botones ---------- */
  button{font-family:inherit}
  .btn{
    background:var(--cobalto);color:#fff;border:0;border-radius:4px;padding:13px 18px;
    font-family:'Chivo',sans-serif;font-size:15px;font-weight:700;letter-spacing:-.01em;
    cursor:pointer;width:100%;
  }
  .btn:hover{background:#144CAB}
  .btn.naranja{background:var(--tinta)}
  .btn.naranja:hover{background:#1B3648}
  .btn.linea{background:var(--hoja);color:var(--tinta);border:1.5px solid var(--borde)}
  .btn.linea:hover{border-color:var(--tinta)}
  .btn.riesgo{background:var(--hoja);color:var(--carmin);border:1.5px solid #EBC8CD}
  .btn.riesgo:hover{background:var(--carmin-suave)}
  .btn.chico{width:auto;padding:8px 13px;font-size:13.5px}
  .btn:disabled{opacity:.4;cursor:default}
  .btn:disabled:hover{background:var(--cobalto)}
  .btn.linea:disabled:hover{background:var(--hoja);border-color:var(--borde)}
  :focus-visible{outline:2.5px solid var(--cobalto);outline-offset:2px}

  /* ---------- formularios ---------- */
  input,select,textarea{
    font-family:inherit;font-size:16px;color:var(--tinta);width:100%;padding:11px 12px;
    border:1.5px solid var(--borde);border-radius:4px;background:var(--hoja);margin-top:6px;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--cobalto)}
  input[type=file]{padding:9px;font-size:14px}
  label{display:block;font-size:13.5px;font-weight:600;margin-bottom:14px;color:var(--tinta)}

  /* ---------- etiquetas ---------- */
  .globo{
    display:inline-block;font-family:'Chivo',sans-serif;font-size:12.5px;font-weight:600;
    padding:2px 9px;border-radius:3px;background:#EAEEF2;color:var(--gris);
  }
  .globo.ok{background:var(--cobalto-suave);color:var(--cobalto)}
  .globo.aviso{background:#FFF3D9;color:#8A5B00}
  .globo.alerta{background:var(--carmin-suave);color:var(--carmin)}

  .vacio{
    background:var(--hoja);border:1px dashed var(--borde);border-radius:4px;
    padding:28px 20px;text-align:center;
  }
  .vacio p{margin-bottom:14px;color:var(--gris)}

  /* ---------- cinta métrica del plan ---------- */
  .plan{margin-top:12px}
  .cinta{
    position:relative;height:26px;background:var(--hoja);border:1px solid var(--borde);
    border-radius:3px;overflow:hidden;
  }
  .cinta .lleno{position:absolute;inset:0 auto 0 0;background:var(--cobalto-suave);border-right:2px solid var(--cobalto)}
  .cinta .marca{position:absolute;top:0;bottom:0;width:1px;background:var(--borde)}
  .cinta .marca.alta{background:#B9C4CE}
  .cinta.cerca .lleno{background:#FFF3D9;border-right-color:#D99B12}
  .cinta.cumplido .lleno{background:var(--carmin-suave);border-right-color:var(--carmin)}
  .plan .pie{display:flex;justify-content:space-between;margin-top:5px}
  .plan .pie b{font-family:'Chivo',sans-serif;font-size:13px;font-weight:700}
  .plan .pie span{font-size:12.5px;color:var(--gris)}

  .recordatorio{
    background:var(--hoja);border:1px solid var(--borde);border-top:3px solid #D99B12;
    border-radius:4px;padding:14px 16px;margin-bottom:18px;
  }
  .recordatorio h3{font-size:15.5px;margin-bottom:3px}

  /* ---------- días y ejercicios ---------- */
  .dia{background:var(--hoja);border:1px solid var(--borde);border-radius:4px;padding:16px 18px;margin-bottom:12px}
  .ej{border-top:1px solid var(--borde);padding:12px 0;background:var(--hoja)}
  .ej.arrastrando{opacity:.35}
  .ej-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .mango{cursor:grab;color:#B9C4CE;font-size:17px;line-height:1.3;padding-right:8px;user-select:none}
  .video{color:var(--cobalto);font-weight:600;font-size:13.5px;text-decoration:none;border-bottom:1px solid #B9CCEC}
  .video:hover{border-bottom-color:var(--cobalto)}
  .series{
    font-family:'Chivo',sans-serif;font-size:25px;font-weight:900;letter-spacing:-.03em;
    color:var(--tinta);white-space:nowrap;font-variant-numeric:tabular-nums;
  }
  .mini{
    background:var(--hoja);border:1.5px solid var(--borde);border-radius:3px;width:29px;height:29px;
    cursor:pointer;font-size:14px;color:var(--gris);padding:0;
  }
  .mini:hover:not(:disabled){border-color:var(--tinta);color:var(--tinta)}
  .mini:disabled{opacity:.35;cursor:default}

  .lista{border:1.5px solid var(--borde);border-radius:4px;margin-top:8px;background:var(--hoja);overflow:hidden}
  .op{
    padding:12px 14px;cursor:pointer;border:0;border-bottom:1px solid var(--borde);
    font-family:inherit;font-size:15px;width:100%;text-align:left;background:none;color:var(--tinta);
  }
  .op:last-child{border-bottom:0}
  .op:hover{background:var(--cobalto-suave)}

  .volver{
    background:none;border:0;color:var(--gris);font-size:14px;font-weight:600;
    cursor:pointer;padding:0 0 14px;font-family:inherit;
  }
  .volver:hover{color:var(--cobalto)}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .anotar{display:flex;gap:8px;margin-top:10px}
  .anotar input{margin-top:0;text-align:center;font-family:'Chivo',sans-serif;font-weight:700;font-size:17px}
  .centro{max-width:390px;margin:48px auto;padding:0 16px}
  .portada{margin-bottom:26px}
  .portada .cifra{
    display:block;font-family:'Chivo',sans-serif;font-size:64px;font-weight:900;
    letter-spacing:-.05em;color:var(--cobalto);line-height:.9;font-variant-numeric:tabular-nums;
  }
  .portada h1{margin-top:14px;font-size:29px}
  .portada p{color:var(--gris);font-size:15px;margin-top:8px;max-width:32ch}

  /* ---------- series ya anotadas ---------- */
  .hechas{border-left:2px solid var(--cobalto);padding-left:12px;margin-top:10px}
  .hechas .fila{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 0}
  .hechas .fila span{font-family:'Chivo',sans-serif;font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .hechas button{
    background:none;border:0;color:var(--gris);font-size:12.5px;cursor:pointer;font-family:inherit;
    text-decoration:underline;
  }
  .hechas button:hover{color:var(--carmin)}

  .semana{margin-bottom:20px}
  .semana > h3{
    display:inline-block;background:var(--tinta);color:#fff;font-size:13.5px;
    padding:3px 10px;border-radius:3px;margin-bottom:8px;
  }

  /* ---------- navegación por día ---------- */
  .navdia{
    display:flex;align-items:center;gap:12px;background:var(--hoja);
    border:1px solid var(--borde);border-radius:4px;padding:12px 14px;margin-bottom:12px;
  }
  .navdia .mini{width:36px;height:36px;font-size:19px;font-weight:700;color:var(--tinta)}
  .navdia .fecha{
    margin-top:5px;padding:4px 6px;font-size:13px;border:0;border-bottom:1.5px solid var(--borde);
    border-radius:0;background:none;color:var(--gris);width:auto;
  }
  .acciones{display:flex;flex-wrap:wrap;gap:6px}
  .card.turno{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .card.turno .quien{flex:1 1 140px;min-width:0}
  .card.turno .acciones{flex:0 0 auto}
  .horario{
    font-family:'Chivo',sans-serif;font-size:20px;font-weight:900;letter-spacing:-.03em;
    color:var(--cobalto);min-width:56px;font-variant-numeric:tabular-nums;
  }

  /* ---------- ventanas ---------- */
  .fondo-modal{position:fixed;inset:0;background:rgba(15,34,49,.5);display:flex;align-items:flex-end;justify-content:center;z-index:60}
  .modal{
    background:var(--hoja);border-radius:6px 6px 0 0;padding:22px 20px 26px;width:100%;
    max-width:520px;max-height:88vh;overflow:auto;border-top:3px solid var(--cobalto);
    animation:entra .16s ease-out;
  }
  @keyframes entra{from{transform:translateY(12px)}to{transform:none}}
  @media (prefers-reduced-motion:reduce){.modal{animation:none}}
  @media (min-width:560px){
    .fondo-modal{align-items:center;padding:20px}
    .modal{border-radius:6px}
  }
  .modal h3{font-size:19px;margin-bottom:5px}
  .modal .sub{color:var(--gris);font-size:14.5px;margin-bottom:18px}

  /* ---------- mensajes ---------- */
  .mensajes{
    position:fixed;left:0;right:0;bottom:20px;display:flex;flex-direction:column;
    align-items:center;gap:8px;z-index:80;pointer-events:none;padding:0 16px;
  }
  .mensaje{
    background:var(--tinta);color:#fff;padding:11px 17px;border-radius:4px;
    font-size:14.5px;font-weight:500;max-width:440px;border-left:3px solid var(--cobalto);
  }
  .mensaje.mal{border-left-color:var(--carmin)}
  .mensaje.bien{border-left-color:#5FA8FF}

  .tabla{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
  .tabla th,.tabla td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--borde)}
  .tabla th{color:var(--gris);font-size:12.5px;font-weight:600}
  .tabla td b{font-family:'Chivo',sans-serif;font-variant-numeric:tabular-nums}

  @media (max-width:430px){
    .dos{grid-template-columns:1fr}
    h2{font-size:22px}
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef, createContext, useContext } = React;

const CLAVE = 'apptrainner_token';
let sesion = localStorage.getItem(CLAVE) || null;

async function api(path, opts = {}) {
  const r = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers: Object.assign({ 'Content-Type': 'application/json' },
      sesion ? { Authorization: 'Bearer ' + sesion } : {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status === 401) { sesion = null; localStorage.removeItem(CLAVE); location.reload(); }
    const e = new Error(d.error || 'Algo no salió bien. Probá de nuevo.');
    e.status = r.status; e.datos = d; throw e;
  }
  return d;
}

const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const fmt = d => d ? d.split('-').reverse().slice(0, 2).join('/') : '—';
const fmtLargo = d => { if (!d) return '—'; const [a, m, dd] = d.split('-'); return `${dd}/${m}`; };
const hora = iso => iso ? new Date(iso).toTimeString().slice(0, 5) : '';
const hoyISO = () => new Date().toISOString().slice(0, 10);
const semanaDe = i => i ? Math.max(1, Math.floor((Date.now() - new Date(i + 'T00:00:00')) / (7 * 864e5)) + 1) : 1;
function finPlan(inicio) {
  if (!inicio) return null;
  const d = new Date(inicio + 'T00:00:00'); d.setDate(d.getDate() + 28);
  return d.toISOString().slice(0, 10);
}
const diasRestantes = inicio => {
  const f = finPlan(inicio); if (!f) return null;
  return Math.ceil((new Date(f + 'T00:00:00') - new Date().setHours(0, 0, 0, 0)) / 864e5);
};

/* La cinta métrica del plan: cuatro semanas con marcas, como una cinta de medir. */
function Progreso({ inicio, compacto }) {
  if (!inicio) return null;
  const dias = diasRestantes(inicio);
  const transcurridos = Math.min(28, Math.max(0, 28 - Math.max(dias, 0)));
  const pct = (transcurridos / 28) * 100;
  const estado = dias < 0 ? 'cumplido' : dias <= 7 ? 'cerca' : '';
  const semana = Math.min(4, Math.max(1, Math.ceil((transcurridos + 1) / 7)));
  const marcas = [];
  for (let d = 1; d < 28; d++)
    marcas.push(<i key={d} className={'marca' + (d % 7 === 0 ? ' alta' : '')}
      style={{ left: (d / 28) * 100 + '%', top: d % 7 === 0 ? 0 : 8, bottom: d % 7 === 0 ? 0 : 8 }} />);

  return (
    <div className="plan">
      <div className={'cinta ' + estado}>
        <i className="lleno" style={{ width: Math.max(pct, 1.5) + '%' }} />
        {marcas}
      </div>
      <div className="pie">
        <b>{dias < 0 ? 'Plan cumplido' : 'Semana ' + semana + ' de 4'}</b>
        {!compacto && <span>{dias < 0 ? 'toca renovar' : 'termina el ' + fmtLargo(finPlan(inicio))}</span>}
      </div>
    </div>);
}

/* ---------- avisos y ventanas propias ---------- */
const Aviso = createContext(null);
const usarAviso = () => useContext(Aviso);

function ProveedorAviso({ children }) {
  const [mensajes, setMensajes] = useState([]);
  const [pregunta, setPregunta] = useState(null);

  const avisar = useCallback((texto, tipo = 'bien') => {
    const id = Math.random();
    setMensajes(m => [...m, { id, texto, tipo }]);
    setTimeout(() => setMensajes(m => m.filter(x => x.id !== id)), 3600);
  }, []);

  const confirmar = useCallback((texto, detalle, etiqueta) =>
    new Promise(res => setPregunta({ texto, detalle, etiqueta: etiqueta || 'Sí, dale', res })), []);

  // Memorizado: si no, cambia en cada render y hace recargar datos en bucle.
  const valor = useMemo(() => ({ avisar, confirmar }), [avisar, confirmar]);

  return (
    <Aviso.Provider value={valor}>
      {children}
      <div className="mensajes">
        {mensajes.map(m => <div key={m.id} className={'mensaje ' + m.tipo}>{m.texto}</div>)}
      </div>
      {pregunta &&
        <div className="fondo-modal" onClick={() => { pregunta.res(false); setPregunta(null); }}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>{pregunta.texto}</h3>
            {pregunta.detalle && <p className="sub">{pregunta.detalle}</p>}
            <button className="btn riesgo" onClick={() => { pregunta.res(true); setPregunta(null); }}>
              {pregunta.etiqueta}</button>
            <button className="btn linea" style={{ marginTop: 10 }}
              onClick={() => { pregunta.res(false); setPregunta(null); }}>Mejor no</button>
          </div>
        </div>}
    </Aviso.Provider>);
}

function Modal({ titulo, sub, children, cerrar }) {
  useEffect(() => {
    const esc = e => e.key === 'Escape' && cerrar();
    window.addEventListener('keydown', esc);
    return () => window.removeEventListener('keydown', esc);
  }, [cerrar]);
  return (
    <div className="fondo-modal" onClick={cerrar}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <h3>{titulo}</h3>
        {sub && <p className="sub">{sub}</p>}
        {children}
      </div>
    </div>);
}

/* Si una pantalla falla, se muestra el error en vez de quedar trabada. */
class Escudo extends React.Component {
  constructor(p) { super(p); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidUpdate(prev) { if (prev.clave !== this.props.clave && this.state.error) this.setState({ error: null }); }
  render() {
    if (this.state.error)
      return (<div className="vacio">
        <p>Se trabó esta pantalla. Probá volver a entrar.</p>
        <button className="btn chico" onClick={() => this.setState({ error: null })}>Reintentar</button>
      </div>);
    return this.props.children;
  }
}

/* ---------- entrada ---------- */
function Entrar({ onEntrar }) {
  const [modo, setModo] = useState('login');
  const [f, setF] = useState({ email: '', password: '', nombre: '' });
  const [cargando, setCargando] = useState(false);
  const { avisar } = usarAviso();
  const set = k => e => setF({ ...f, [k]: e.target.value });

  async function enviar() {
    setCargando(true);
    try {
      const r = await api(modo === 'login' ? '/login' : '/registro', { method: 'POST', body: f });
      sesion = r.token; localStorage.setItem(CLAVE, r.token);
      avisar(modo === 'login' ? '¡Hola de nuevo!' : '¡Cuenta creada! Bienvenido.');
      onEntrar(r);
    } catch (e) { avisar(e.message, 'mal'); } finally { setCargando(false); }
  }

  return (
    <div className="centro">
      <div className="portada">
        <span className="cifra">4×10</span>
        <h1>AppTrainner</h1>
        <p>Armá las rutinas de tus alumnos sin volver a pegar un video nunca más.</p>
      </div>
      <div className="card">
        {modo === 'registro' &&
          <label>¿Cómo te llamás?<input value={f.nombre} onChange={set('nombre')} placeholder="Tu nombre" /></label>}
        <label>Mail<input type="email" value={f.email} onChange={set('email')} autoComplete="email" /></label>
        <label>Contraseña
          <input type="password" value={f.password} onChange={set('password')}
            autoComplete={modo === 'login' ? 'current-password' : 'new-password'}
            onKeyDown={e => e.key === 'Enter' && enviar()} />
          {modo === 'registro' && <span className="chico">Mínimo 8 caracteres.</span>}
        </label>
        <button className="btn" onClick={enviar} disabled={cargando}>
          {cargando ? 'Un segundito...' : modo === 'login' ? 'Entrar' : 'Crear mi cuenta'}</button>
        <button className="btn linea" style={{ marginTop: 10 }}
          onClick={() => setModo(modo === 'login' ? 'registro' : 'login')}>
          {modo === 'login' ? 'Todavía no tengo cuenta' : 'Ya tengo cuenta'}</button>
      </div>
    </div>);
}

/* ---------- grupos musculares ---------- */
function Grupos({ grupos, recargar, ejercicios, cerrar }) {
  const [nuevo, setNuevo] = useState('');
  const [editando, setEditando] = useState(null);
  const [fusion, setFusion] = useState(null);
  const { avisar, confirmar } = usarAviso();

  const cuantos = nombre => ejercicios.filter(e => e.grupo === nombre).length;

  async function crear() {
    if (!nuevo.trim()) return;
    try { await api('/grupos', { method: 'POST', body: { nombre: nuevo } }); setNuevo(''); await recargar(); avisar('Grupo creado'); }
    catch (e) { avisar(e.message, 'mal'); }
  }
  async function renombrar() {
    try { await api('/grupos/' + editando.id, { method: 'PATCH', body: { nombre: editando.nombre } });
      setEditando(null); await recargar(); avisar('Grupo renombrado'); }
    catch (e) { avisar(e.message, 'mal'); }
  }
  async function fusionar(destinoId) {
    try { await api('/grupos/' + fusion.id + '/fusionar', { method: 'POST', body: { destino: destinoId } });
      setFusion(null); await recargar(); avisar('Grupos fusionados'); }
    catch (e) { avisar(e.message, 'mal'); }
  }
  async function borrar(g) {
    const n = cuantos(g.nombre);
    if (!await confirmar('¿Eliminamos el grupo ' + g.nombre + '?',
      n ? `${n} ejercicio${n === 1 ? '' : 's'} van a quedar sin grupo. No se borran.` : 'No lo usa ningún ejercicio.',
      'Sí, eliminar')) return;
    try { await api('/grupos/' + g.id, { method: 'DELETE' }); await recargar(); avisar('Grupo eliminado'); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  return (
    <Modal titulo="Grupos musculares"
      sub="Los que definas acá son los que vas a poder elegir al cargar un ejercicio." cerrar={cerrar}>
      <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
        <input value={nuevo} placeholder="Piernas, Pecho, Espalda..." style={{ marginTop: 0 }}
          onChange={e => setNuevo(e.target.value)} onKeyDown={e => e.key === 'Enter' && crear()} />
        <button className="btn chico" onClick={crear} disabled={!nuevo.trim()}>Agregar</button>
      </div>

      {!grupos.length && <p className="suave">Creá los grupos que uses: piernas, pecho, espalda.</p>}
      {grupos.map(g => (
        <div className="ej" key={g.id}>
          <div className="ej-top">
            <div><b>{g.nombre}</b><div className="chico">{cuantos(g.nombre)} ejercicios</div></div>
            <div style={{ display: 'flex', gap: 6 }}>
              <button className="btn linea chico" onClick={() => setEditando({ ...g })}>Renombrar</button>
              {grupos.length > 1 &&
                <button className="btn linea chico" onClick={() => setFusion(g)}>Fusionar</button>}
              <button className="btn riesgo chico" onClick={() => borrar(g)}>Borrar</button>
            </div>
          </div>
        </div>))}

      {editando &&
        <div style={{ marginTop: 16 }}>
          <label>Nuevo nombre para "{grupos.find(x => x.id === editando.id).nombre}"
            <input autoFocus value={editando.nombre}
              onChange={e => setEditando({ ...editando, nombre: e.target.value })} /></label>
          <p className="chico">Los ejercicios de ese grupo se actualizan solos.</p>
          <button className="btn" onClick={renombrar}>Guardar</button>
          <button className="btn linea" style={{ marginTop: 8 }} onClick={() => setEditando(null)}>Cancelar</button>
        </div>}

      {fusion &&
        <div style={{ marginTop: 16 }}>
          <p className="suave" style={{ marginBottom: 8 }}>
            Pasar los ejercicios de <b>{fusion.nombre}</b> a:</p>
          <div className="lista">
            {grupos.filter(g => g.id !== fusion.id).map(g =>
              <button className="op" key={g.id} onClick={() => fusionar(g.id)}>{g.nombre}</button>)}
          </div>
          <button className="btn linea" style={{ marginTop: 8 }} onClick={() => setFusion(null)}>Cancelar</button>
        </div>}
    </Modal>);
}

/* ---------- banco de ejercicios ---------- */
function Ejercicios({ ejercicios, grupos, recargar }) {
  const [form, setForm] = useState(null);
  const [verGrupos, setVerGrupos] = useState(false);
  const { avisar, confirmar } = usarAviso();

  async function guardar() {
    try {
      if (form.id) { await api('/ejercicios/' + form.id, { method: 'PATCH', body: form }); avisar('Ejercicio actualizado'); }
      else {
        const r = await api('/ejercicios', { method: 'POST', body: form });
        avisar(r.ya_existia ? 'Ese ejercicio ya estaba en tu banco' : 'Ejercicio guardado');
      }
      setForm(null); await recargar();
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function borrar(ej) {
    if (!await confirmar('¿Sacamos este ejercicio del banco?',
      `"${ej.nombre}" ya no va a aparecer cuando armes rutinas nuevas.`, 'Sí, sacarlo')) return;
    try { await api('/ejercicios/' + ej.id, { method: 'DELETE' }); await recargar(); avisar('Listo, lo sacamos'); }
    catch (e) {
      if (e.status === 409) {
        if (!await confirmar('Ojo: lo estás usando',
          `${e.datos.usos === 1 ? 'Aparece en 1 rutina tuya' : 'Aparece en ' + e.datos.usos + ' rutinas tuyas'}. Si lo sacás, también desaparece de ahí. Esto no afecta a ningún otro entrenador.`,
          'Sacarlo igual')) return;
        try { await api('/ejercicios/' + ej.id + '?forzar=1', { method: 'DELETE' }); await recargar();
          avisar('Lo sacamos del banco y de tus rutinas'); }
        catch (e2) { avisar(e2.message, 'mal'); }
      } else avisar(e.message, 'mal');
    }
  }

  const porGrupo = {};
  ejercicios.forEach(e => { (porGrupo[e.grupo || 'Sin grupo'] ||= []).push(e); });

  return (<div>
    <div className="row" style={{ marginBottom: 8 }}>
      <h2>Tu banco de ejercicios</h2>
      <button className="btn chico" onClick={() => setForm({ nombre: '', grupo: '', video_url: '' })}>Sumar uno</button>
    </div>
    <p className="suave" style={{ marginBottom: 12 }}>
      {ejercicios.length} ejercicio{ejercicios.length === 1 ? '' : 's'} cargados. El video se pega una sola vez.
    </p>
    <button className="btn linea chico" style={{ marginBottom: 16 }} onClick={() => setVerGrupos(true)}>
      Grupos musculares ({grupos.length})</button>

    {!ejercicios.length &&
      <div className="vacio"><p>Acá se guardan tus ejercicios con su video. Cargás cada uno una sola vez.</p>
        <button className="btn chico" onClick={() => setForm({ nombre: '', grupo: '', video_url: '' })}>Cargar el primero</button></div>}

    {Object.keys(porGrupo).sort().map(g => (
      <div className="dia" key={g}>
        <div className="row" style={{ marginBottom: 4 }}>
          <h3>{g}</h3>
          <span className="chico">{porGrupo[g].length}</span>
        </div>
        {porGrupo[g].map(e => (
          <div className="ej" key={e.id}>
            <div className="ej-top">
              <div>
                <b>{e.nombre}</b>
                {e.video_url
                  ? <div><a className="video" href={e.video_url} target="_blank" rel="noopener">Ver el video</a></div>
                  : <div className="chico">Sin video todavía</div>}
              </div>
              <div className="acciones">
                <button className="btn linea chico" onClick={() => setForm(e)}>Editar</button>
                <button className="btn riesgo chico" onClick={() => borrar(e)}>Sacar</button>
              </div>
            </div>
          </div>))}
      </div>))}

    {form &&
      <Modal titulo={form.id ? 'Editar ejercicio' : 'Nuevo ejercicio'}
        sub="Queda guardado en tu banco y lo reutilizás siempre." cerrar={() => setForm(null)}>
        <label>Nombre<input autoFocus value={form.nombre || ''}
          onChange={e => setForm({ ...form, nombre: e.target.value })} placeholder="Sentadilla con barra" /></label>
        <label>Grupo muscular
          <select value={form.grupo || ''} onChange={e => setForm({ ...form, grupo: e.target.value })}>
            <option value="">Sin grupo</option>
            {grupos.map(g => <option key={g.id} value={g.nombre}>{g.nombre}</option>)}
          </select>
        </label>
        {!grupos.length &&
          <p className="chico" style={{ marginTop: -6, marginBottom: 12 }}>
            Todavía no definiste grupos. Cerrá esto y tocá "Grupos musculares" para crearlos.</p>}
        <label>Link del video<input value={form.video_url || ''}
          onChange={e => setForm({ ...form, video_url: e.target.value })}
          placeholder="Pegá el link de YouTube o Instagram" /></label>
        <button className="btn" onClick={guardar} disabled={!String(form.nombre || '').trim()}>Guardar</button>
        <button className="btn linea" style={{ marginTop: 10 }} onClick={() => setForm(null)}>Cancelar</button>
      </Modal>}

    {verGrupos && <Grupos grupos={grupos} recargar={recargar} ejercicios={ejercicios} cerrar={() => setVerGrupos(false)} />}
  </div>);
}

/* ---------- alumnos ---------- */
function FormAlumno({ inicial, onGuardar, cerrar, conTurnos }) {
  const [f, setF] = useState(inicial);
  const set = k => e => setF({ ...f, [k]: e.target.value });
  const turnos = f.turnos || [];

  const agregarDia = () => setF({ ...f, turnos: [...turnos, { dia_semana: 1, hora: '09:00', duracion: 60 }] });
  const cambiarDia = (i, campo, valor) => {
    const t = [...turnos]; t[i] = { ...t[i], [campo]: valor }; setF({ ...f, turnos: t });
  };
  const quitarDia = i => setF({ ...f, turnos: turnos.filter((_, j) => j !== i) });

  return (
    <Modal titulo={f.id ? 'Editar alumno' : 'Nuevo alumno'}
      sub={conTurnos ? 'Cargá sus datos y los días que entrena.' : 'Cargá sus datos.'} cerrar={cerrar}>
      <label>Nombre<input autoFocus value={f.nombre || ''} onChange={set('nombre')} /></label>
      <label>Teléfono o mail<input value={f.contacto || ''} onChange={set('contacto')} placeholder="Opcional" /></label>
      <label>¿Cuándo arrancó el plan?<input type="date" value={f.inicio || ''} onChange={set('inicio')} /></label>
      <div className="dos">
        <label>Peso inicial (kg)<input type="number" inputMode="decimal" value={f.peso_inicial || ''}
          onChange={set('peso_inicial')} placeholder="Opcional" /></label>
        <label>Altura (cm)<input type="number" inputMode="numeric" value={f.altura || ''}
          onChange={set('altura')} placeholder="Opcional" /></label>
      </div>
      <label>Anotaciones<textarea rows="3" value={f.notas || ''} onChange={set('notas')}
        placeholder="Lesiones, objetivos, lo que quieras recordar (opcional)" /></label>

      {conTurnos && (<div>
        <label style={{ marginBottom: 6 }}>Días y horarios</label>
        <p className="chico" style={{ marginBottom: 8 }}>Uno por cada día que entrena. Van directo a tu agenda.</p>
        {turnos.map((t, i) => (
          <div key={i} style={{ display: 'flex', gap: 6, marginBottom: 8, alignItems: 'center' }}>
            <select value={t.dia_semana} style={{ marginTop: 0 }}
              onChange={e => cambiarDia(i, 'dia_semana', +e.target.value)}>
              {[1, 2, 3, 4, 5, 6, 0].map(d => <option key={d} value={d}>{DIAS[d].slice(0, 3)}</option>)}
            </select>
            <input type="time" value={t.hora} style={{ marginTop: 0 }}
              onChange={e => cambiarDia(i, 'hora', e.target.value)} />
            <input type="number" value={t.duracion} style={{ marginTop: 0, maxWidth: 80 }} title="minutos"
              onChange={e => cambiarDia(i, 'duracion', +e.target.value)} />
            <button className="mini" onClick={() => quitarDia(i)} title="Quitar">✕</button>
          </div>))}
        <button className="btn linea chico" onClick={agregarDia} style={{ marginBottom: 14 }}>
          + Agregar día</button>
      </div>)}

      <button className="btn" onClick={() => onGuardar(f)} disabled={!String(f.nombre || '').trim()}>
        Guardar alumno</button>
    </Modal>);
}

function Alumnos({ clientes, recargar, abrir, recargarTurnos }) {
  const [form, setForm] = useState(null);
  const [importar, setImportar] = useState(false);
  const { avisar } = usarAviso();

  async function crear(f) {
    try {
      await api('/clientes', { method: 'POST', body: f });
      setForm(null); await recargar(); await recargarTurnos();
      avisar(f.turnos && f.turnos.length ? 'Alumno agregado y turnos cargados en la agenda' : 'Alumno agregado');
    } catch (e) { avisar(e.message, 'mal'); }
  }

  const porRenovar = clientes.filter(c => { const d = diasRestantes(c.inicio); return d !== null && d <= 7; });
  const nuevo = { nombre: '', contacto: '', inicio: hoyISO(), peso_inicial: '', altura: '', notas: '',
                  turnos: [{ dia_semana: 1, hora: '09:00', duracion: 60 }] };

  return (<div>
    {!!porRenovar.length &&
      <div className="recordatorio">
        <h3>{porRenovar.length === 1 ? 'Se termina el plan de ' + porRenovar[0].nombre
          : 'Se terminan ' + porRenovar.length + ' planes'}</h3>
        <p className="suave">
          {porRenovar.map(c => {
            const d = diasRestantes(c.inicio);
            const cuando = d < 0 ? 'ya se cumplió' : d === 0 ? 'termina hoy' : 'termina el ' + fmtLargo(finPlan(c.inicio));
            return porRenovar.length === 1 ? cuando.charAt(0).toUpperCase() + cuando.slice(1) : c.nombre + ', ' + cuando;
          }).join('. ')}

    <div className="row" style={{ marginBottom: 12 }}>

      <button className="btn chico" onClick={() => setForm(nuevo)}>Sumar alumno</button>
    </div>

    {clientes.map(c => (

    {form && <FormAlumno inicial={form} conTurnos onGuardar={crear} cerrar={() => setForm(null)} />}
