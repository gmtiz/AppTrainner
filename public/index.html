/* ---------- importar datos generales ---------- */
function ImportarTodo({ cerrar, alTerminar, irAAyuda }) {
  const [datos, setDatos] = useState(null);
  const [subiendo, setSubiendo] = useState(false);
  const [resultado, setResultado] = useState(null);
  const { avisar } = usarAviso();

  // Lee un Excel con hojas Alumnos / Ejercicios / Rutinas / Agenda.
  function leer(archivo) {
    const lector = new FileReader();
    lector.onload = ev => {
      try {
        const libro = XLSX.read(new Uint8Array(ev.target.result), { type: 'array', cellDates: false });
        const hoja = nombres => {
          const n = libro.SheetNames.find(x => nombres.includes(x.trim().toLowerCase()));
          if (!n) return [];
          const filas = XLSX.utils.sheet_to_json(libro.Sheets[n], { header: 1, defval: '', blankrows: true });
          if (!filas.length) return [];
          const cabecera = (filas[0] || []).map(h => String(h).trim().toLowerCase());
          const salida = [];
          for (let i = 1; i < filas.length; i++) {
            const f = filas[i] || [];
            const vacia = f.every(v => String(v == null ? '' : v).trim() === '');
            if (vacia) break;                      // corta en la primera fila en blanco
            const primera = String(f[0] == null ? '' : f[0]).trim();
            if (primera.startsWith('•') || /^cómo completar/i.test(primera)) break;  // notas al pie
            const o = {};
            cabecera.forEach((k, j) => { if (k) o[k] = f[j] == null ? '' : f[j]; });
            salida.push(o);
          }
          return salida;
        };
        const fecha = v => {
          if (!v) return '';
          if (typeof v === 'number') return new Date(Date.UTC(1899, 11, 30 + v)).toISOString().slice(0, 10);
          const t = String(v).trim();
          if (/^\d{4}-\d{2}-\d{2}/.test(t)) return t.slice(0, 10);
          const m = t.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
          return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : '';
        };
        const horaDe = v => {
          if (typeof v === 'number') {
            const min = Math.round(v * 24 * 60);
            return String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0');
          }
          const t = String(v || '').trim();
          const m = t.match(/^(\d{1,2}):(\d{2})/);
          return m ? m[1].padStart(2, '0') + ':' + m[2] : '';
        };
        const numDia = v => {
          const t = String(v || '').trim().toLowerCase();
          if (/^[0-6]$/.test(t)) return Number(t);
          const i = DIAS.findIndex(d => d.toLowerCase().startsWith(t.slice(0, 3)));
          return i >= 0 ? i : null;
        };

        const d = {
          alumnos: hoja(['alumnos', 'alumno']).map(a => ({
            alumno: a['alumno'] || a['nombre'] || '', contacto: a['contacto'] || a['telefono'] || a['teléfono'] || '',
            inicio: fecha(a['inicio'] || a['arranque'] || a['fecha inicio']),
            peso: a['peso'] || a['peso inicial'] || '', altura: a['altura'] || '',
            notas: a['notas'] || a['anotaciones'] || ''
          })).filter(a => String(a.alumno).trim()),

          ejercicios: hoja(['ejercicios', 'ejercicio']).map(e => ({
            ejercicio: e['ejercicio'] || e['nombre'] || '', grupo: e['grupo'] || e['grupo muscular'] || '',
            video: e['video'] || e['link'] || ''
          })).filter(e => String(e.ejercicio).trim()),

          rutinas: hoja(['rutinas', 'rutina']).map(r => ({
            alumno: r['alumno'] || '', rutina: r['rutina'] || 'Rutina importada',
            dia: r['dia'] || r['día'] || 'Día 1', dia_sugerido: r['dia sugerido'] || r['día sugerido'] || '',
            ejercicio: r['ejercicio'] || '', grupo: r['grupo'] || '',
            series: r['series'] || '', reps: r['reps'] || r['repeticiones'] || '',
            nota: r['nota'] || '', video: r['video'] || ''
          })).filter(r => String(r.alumno).trim() && String(r.ejercicio).trim()),

          turnos: hoja(['agenda', 'turnos', 'horarios']).map(t => ({
            alumno: t['alumno'] || '', dia_semana: numDia(t['dia'] || t['día'] || t['dia semana']),
            hora: horaDe(t['hora']), duracion: Number(t['duracion'] || t['duración'] || 60) || 60,
            nota: t['nota'] || ''
          })).filter(t => String(t.alumno).trim() && t.dia_semana !== null && t.hora)
        };

        const total = d.alumnos.length + d.ejercicios.length + d.rutinas.length + d.turnos.length;
        if (!total) {
          avisar('No encontramos datos. Fijate que el archivo tenga las hojas Alumnos, Ejercicios, Rutinas o Agenda.', 'mal');
          return;
        }
        setDatos(d);
      } catch { avisar('No pudimos leer ese archivo. ¿Es un Excel?', 'mal'); }
    };
    lector.readAsArrayBuffer(archivo);
  }

  const [tope, setTope] = useState(null);

  async function importar() {
    setSubiendo(true);
    try { setResultado(await api('/importar', { method: 'POST', body: datos })); }
    catch (e) {
      if (e.status === 402) setTope(e.message); else avisar(e.message, 'mal');
      setSubiendo(false);
    }
  }

  if (tope) return <Tope texto={tope} cerrar={cerrar} irAAyuda={irAAyuda} />;

  if (resultado) return (
    <Modal titulo="Listo, importamos todo" cerrar={() => { cerrar(); alTerminar && alTerminar(); }}>
      <p className="suave" style={{ marginBottom: 12 }}>Esto es lo que quedó cargado:</p>
      <table className="tabla">
        <tbody>
          <tr><td>Alumnos nuevos</td><td><b>{resultado.alumnos}</b></td></tr>
          <tr><td>Alumnos que ya tenías</td><td>{resultado.alumnosExistentes}</td></tr>
          <tr><td>Ejercicios nuevos</td><td><b>{resultado.ejercicios}</b></td></tr>
          <tr><td>Ejercicios reutilizados</td><td>{resultado.ejerciciosExistentes}</td></tr>
          <tr><td>Rutinas armadas</td><td><b>{resultado.rutinas}</b> ({resultado.items} ejercicios)</td></tr>
          <tr><td>Turnos en la agenda</td><td><b>{resultado.turnos}</b></td></tr>
        </tbody>
      </table>
      {!!(resultado.avisos || []).length &&
        <div style={{ marginTop: 14 }}>
          <p className="chico"><b>Algunas filas quedaron afuera:</b></p>
          {resultado.avisos.slice(0, 6).map((a, i) => <p className="chico" key={i}>· {a}</p>)}
        </div>}
      <button className="btn" style={{ marginTop: 16 }}
        onClick={() => { cerrar(); alTerminar && alTerminar(); }}>Ver mis datos</button>
    </Modal>);

  return (
    <Modal titulo="Carga inicial desde Excel"
      sub="Un solo archivo con tus alumnos, ejercicios, rutinas y horarios." cerrar={cerrar}>
      {!datos ? (<div>
        <label>Archivo (.xlsx)
          <input type="file" accept=".xlsx,.xls" onChange={e => e.target.files[0] && leer(e.target.files[0])} /></label>
        <p className="chico" style={{ marginTop: 10 }}>
          El archivo puede tener hasta cuatro hojas: <b>Alumnos</b>, <b>Ejercicios</b>, <b>Rutinas</b> y <b>Agenda</b>.
          Podés usar solo las que necesites. Nada se pisa: lo que ya existe se reutiliza.
        </p>
        <a className="video" href="/plantilla-carga.xlsx" download style={{ display: 'block', marginTop: 12 }}>
          Bajar la plantilla con las cuatro hojas</a>
        <button className="btn linea" style={{ marginTop: 14 }} onClick={cerrar}>Cancelar</button>
      </div>) : (<div>
        <p className="suave" style={{ marginBottom: 10 }}>Encontramos esto en tu archivo:</p>
        <table className="tabla">
          <tbody>
            <tr><td>Alumnos</td><td><b>{datos.alumnos.length}</b></td></tr>
            <tr><td>Ejercicios</td><td><b>{datos.ejercicios.length}</b></td></tr>
            <tr><td>Filas de rutina</td><td><b>{datos.rutinas.length}</b></td></tr>
            <tr><td>Turnos</td><td><b>{datos.turnos.length}</b></td></tr>
          </tbody>
        </table>
        {!!datos.alumnos.length &&
          <p className="chico" style={{ marginTop: 10 }}>
            Alumnos: {datos.alumnos.slice(0, 5).map(a => a.alumno).join(', ')}
            {datos.alumnos.length > 5 ? ` y ${datos.alumnos.length - 5} más` : ''}</p>}
        <button className="btn" style={{ marginTop: 14 }} onClick={importar} disabled={subiendo}>
          {subiendo ? 'Importando...' : 'Importar todo'}</button>
        <button className="btn linea" style={{ marginTop: 10 }} onClick={() => setDatos(null)}>Elegir otro archivo</button>
      </div>)}
    </Modal>);
}

/* Línea de peso corporal: se dibuja con los puntos que cargó el alumno. */
function LineaPeso({ puntos }) {
  if (!puntos || puntos.length < 2) return null;
  const datos = [...puntos].reverse();
  const pesos = datos.map(p => p.peso);
  const min = Math.min(...pesos), max = Math.max(...pesos);
  const rango = max - min || 1;
  const an = 300, al = 70;
  const x = i => (i / (datos.length - 1)) * (an - 8) + 4;
  const y = p => al - 10 - ((p - min) / rango) * (al - 24);
  const linea = datos.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.peso).toFixed(1)}`).join(' ');
  const dif = (datos[datos.length - 1].peso - datos[0].peso).toFixed(1);

  return (
    <div className="grafico">
      <svg viewBox={`0 0 ${an} ${al}`} preserveAspectRatio="none" role="img"
        aria-label={`Evolución del peso, de ${datos[0].peso} a ${datos[datos.length - 1].peso} kilos`}>
        <path d={linea} fill="none" stroke="var(--acento)" strokeWidth="2"
          strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke" />
        {datos.map((p, i) => <circle key={i} cx={x(i)} cy={y(p.peso)} r="2.5" fill="var(--acento)" />)}
      </svg>
      <div className="row">
        <span className="chico">{datos[0].peso} kg el {fmt(datos[0].fecha)}</span>
        <b className={'dif ' + (dif > 0 ? 'sube' : dif < 0 ? 'baja' : '')}>
          {dif > 0 ? '+' : ''}{dif} kg</b>
      </div>
    </div>);
}

/* ---------- ficha del alumno ---------- */
function Ficha({ id, volver, abrirRutina, abrirProgreso, clientes, plantillas, recargarPlantillas,
                 recargarTurnos, irAAyuda, perfil }) {
  const [c, setC] = useState(null);
  const [turnos, setTurnos] = useState([]);
  const [nueva, setNueva] = useState(null);
  const [duplicar, setDuplicar] = useState(null);
  const [usarPlantilla, setUsarPlantilla] = useState(false);
  const [editar, setEditar] = useState(null);
  const [turnoForm, setTurnoForm] = useState(null);
  const [tope, setTope] = useState(null);
  const [impresion, setImpresion] = useState(null);
  const [indic, setIndic] = useState(null);
  const [renovar, setRenovar] = useState(null);
  const [resumen, setResumen] = useState(false);
  const [verIndic, setVerIndic] = useState(false);
  const [historial, setHistorial] = useState(null);
  const { avisar, confirmar } = usarAviso();

  useEffect(() => { if (verIndic) verAnteriores(); }, [verIndic]);

  const cargar = useCallback(async () => {
    try {
      setC(await api('/clientes/' + id));
      setTurnos(await api('/clientes/' + id + '/turnos'));
    } catch (e) { avisar(e.message, 'mal'); }
  }, [id, avisar]);
  useEffect(() => { cargar(); }, [cargar]);

  if (!c) return <p className="suave">Cargando...</p>;
  if (impresion) return <Impresion rutina={impresion} alumno={c.nombre} cerrar={() => setImpresion(null)} />;
  if (resumen) return <ResumenMes cliente={c} cerrar={() => setResumen(false)} />;
  const link = location.origin + '/r/' + c.token;

  async function crearRutina() {
    const dias = [];
    for (let i = 0; i < nueva.cantidad; i++)
      dias.push({ nombre: (nueva.dias[i] || {}).nombre || `Día ${i + 1}`,
                  dia_sugerido: (nueva.dias[i] || {}).dia || '' });
    try {
      const r = await api('/clientes/' + id + '/rutinas', { method: 'POST', body: { nombre: nueva.nombre, dias } });
      setNueva(null); avisar('Rutina creada'); abrirRutina(r.id);
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function copiarA(destinoId) {
    try {
      const r = await api('/rutinas/' + duplicar + '/duplicar', { method: 'POST', body: { cliente_id: destinoId } });
      setDuplicar(null); avisar('Rutina copiada'); abrirRutina(r.id);
    } catch (e) { avisar(e.message, 'mal'); }
  }

  // Renovar: misma rutina para el mismo alumno, arrastrando lo que ya levantó.
  async function hacerRenovacion(conPesos) {
    try {
      const r = await api('/rutinas/' + renovar.id + '/duplicar', { method: 'POST', body: {
        cliente_id: id, con_pesos: conPesos,
        nombre: 'Mes ' + (c.rutinas.length + 1) } });
      setRenovar(null);
      avisar(conPesos && r.pesos_copiados
        ? `Rutina nueva con los pesos de ${r.pesos_copiados} ejercicios`
        : 'Rutina nueva creada');
      abrirRutina(r.id);
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function aplicarPlantilla(plantillaId) {
    try {
      const r = await api('/plantillas/' + plantillaId + '/usar', { method: 'POST', body: { cliente_id: id } });
      setUsarPlantilla(false); avisar('Rutina creada desde la plantilla'); abrirRutina(r.id);
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function guardarPlantilla(rutinaId, nombreRutina) {
    try {
      await api('/rutinas/' + rutinaId + '/plantilla', { method: 'POST', body: { nombre: nombreRutina } });
      await recargarPlantillas(); avisar('Guardada como plantilla');
    } catch (e) {
      if (e.status === 402) setTope(e.message); else avisar(e.message, 'mal');
    }
  }

  async function borrarRutina(r) {
    if (!await confirmar('¿Eliminamos esta rutina?', `"${r.nombre}" y todos sus días.`, 'Sí, eliminar')) return;
    try { await api('/rutinas/' + r.id, { method: 'DELETE' }); cargar(); avisar('Rutina eliminada'); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  async function guardarDatos(f) {
    try { await api('/clientes/' + id, { method: 'PATCH', body: f }); setEditar(null); cargar(); avisar('Datos actualizados'); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  async function guardarTurno() {
    try {
      if (turnoForm.id) await api('/turnos/' + turnoForm.id, { method: 'PATCH', body: turnoForm });
      else await api('/turnos', { method: 'POST', body: { ...turnoForm, cliente_id: id } });
      setTurnoForm(null); await cargar(); await recargarTurnos(); avisar('Turno guardado');
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function borrarTurno(t) {
    if (!await confirmar('¿Sacamos este turno?', `${DIAS[t.dia_semana]} ${t.hora}`, 'Sí, sacarlo')) return;
    try { await api('/turnos/' + t.id, { method: 'DELETE' }); await cargar(); await recargarTurnos(); avisar('Turno eliminado'); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  async function guardarIndicacion() {
    try {
      await api('/clientes/' + id + '/indicaciones', { method: 'POST', body: { texto: indic.texto } });
      setIndic(null); cargar(); avisar('Indicación enviada. La va a ver al entrar.');
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function verAnteriores() {
    try { setHistorial(await api('/clientes/' + id + '/indicaciones')); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  async function imprimir(rutinaId) {
    if (perfil && perfil.limites && !perfil.limites.exportar) {
      setTope('Imprimir la rutina (o guardarla en PDF para mandar por WhatsApp) es del plan completo.');
      return;
    }
    try { setImpresion(await api('/rutinas/' + rutinaId)); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  async function regenerarLink() {
    if (!await confirmar('¿Generamos un link nuevo?',
      'El que tiene ahora deja de funcionar y vas a tener que mandarle el nuevo.', 'Sí, generar')) return;
    try { await api('/clientes/' + id + '/link', { method: 'POST' }); cargar(); avisar('Link nuevo generado'); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  async function borrarAlumno() {
    if (!await confirmar('¿Eliminamos a ' + c.nombre + '?', 'Se borran sus rutinas, turnos y seguimiento.', 'Sí, eliminar')) return;
    try { await api('/clientes/' + id, { method: 'DELETE' }); await recargarTurnos(); avisar('Alumno eliminado'); volver(); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  return (<div>
    <button className="volver" onClick={volver}>← Tus alumnos</button>
    <div className="ficha-cab">
      <span className="inicial grande">{iniciales(c.nombre)}</span>
      <div className="quien">
        <h2>{c.nombre}</h2>
        <span className="chico">
          {[c.inicio ? 'Desde el ' + fmt(c.inicio) : null,
            c.peso_inicial ? c.peso_inicial + ' kg al empezar' : null,
            c.altura ? c.altura + ' cm' : null].filter(Boolean).join(' · ') || 'Sin medidas cargadas'}
        </span>
      </div>
      <button className="btn linea chico" onClick={() => setEditar({
        nombre: c.nombre, contacto: c.contacto || '', inicio: c.inicio,
        peso_inicial: c.peso_inicial || '', altura: c.altura || '', notas: c.notas || '', id: c.id })}>Editar</button>
    </div>
    <p className="suave">{c.contacto || 'Sin contacto cargado'}</p>
    {c.notas && <p className="suave" style={{ marginTop: 6, fontStyle: 'italic' }}>{c.notas}</p>}
    <div style={{ marginTop: 12 }}><Progreso inicio={c.inicio} /></div>

    <div className="tablero" style={{ marginTop: 16 }}>
      <div className="dato-grande">
        <b className="cifra-dato">{c.rutinas.length}</b>
        <span className="etiqueta-dato">{c.rutinas.length === 1 ? 'Rutina armada' : 'Rutinas armadas'}</span>
        <span className="chico">desde que empezó</span>
      </div>
      <div className="dato-grande">
        <b className="cifra-dato">{turnos.length}</b>
        <span className="etiqueta-dato">{turnos.length === 1 ? 'Día por semana' : 'Días por semana'}</span>
        <span className="chico">{turnos.length ? 'en tu agenda' : 'todavía sin horario'}</span>
      </div>
      {!!c.asistencia && (c.asistencia.presente + c.asistencia.ausente > 0) &&
        <div className="dato-grande">
          <b className="cifra-dato">{c.asistencia.presente}<span style={{ fontSize: 20 }}>
            {' de ' + (c.asistencia.presente + c.asistencia.ausente)}</span></b>
          <span className="etiqueta-dato">Asistencia</span>
          <span className="chico">en este plan</span>
        </div>}
      {!!(c.seguimiento || []).length &&
        <div className="dato-grande">
          <b className="cifra-dato">{c.seguimiento[0].peso}<span style={{ fontSize: 20 }}> kg</span></b>
          <span className="etiqueta-dato">Último peso</span>
          <span className="chico">del {fmt(c.seguimiento[0].fecha)}</span>
        </div>}
    </div>

    <div className="card" style={{ marginTop: 16 }}>
      <div className="row"><h3>Sus días</h3>
        <button className="btn linea chico"
          onClick={() => setTurnoForm({ dia_semana: 1, hora: '09:00', duracion: 60, nota: '' })}>Sumar día</button>
      </div>
      {!turnos.length && <p className="suave" style={{ marginTop: 8 }}>Sumale los días que viene a entrenar y aparecen en tu agenda.</p>}
      {turnos.map(t => (
        <div className="ej" key={t.id}>
          <div className="ej-top">
            <div>
              <b>{DIAS[t.dia_semana]}</b>
              <div className="chico">{t.hora}, {t.duracion} minutos{t.nota ? '. ' + t.nota : ''}</div>
              {t.choca && <span className="globo alerta" style={{ marginTop: 6 }}>Se pisa con otro turno</span>}
            </div>
            <div className="acciones" style={{ justifyContent: 'flex-end' }}>
              <button className="btn linea chico" onClick={() => setTurnoForm(t)}>Cambiar</button>
              <button className="btn riesgo chico" onClick={() => borrarTurno(t)}>Quitar</button>
            </div>
          </div>
        </div>))}
    </div>

    <div className="card">
      <div className="row">
        <h3>Indicación para {c.nombre.split(' ')[0]}</h3>
        <button className="btn linea chico" onClick={() => setIndic({ texto: '' })}>
          {c.indicacion ? 'Cambiar' : 'Escribir'}</button>
      </div>
      {c.indicacion
        ? (<div style={{ marginTop: 8 }}>
            <p>{c.indicacion.texto}</p>
            <p className="chico" style={{ marginTop: 6 }}>
              {c.indicacion.leida
                ? 'La leyó el ' + fmt((c.indicacion.leida || '').slice(0, 10))
                : 'Todavía no la leyó'}
              {' · escrita el ' + fmt((c.indicacion.creado || '').slice(0, 10))}
            </p>
            <button className="btn linea chico" style={{ marginTop: 8 }} onClick={() => setVerIndic(true)}>
              Ver anteriores</button>
          </div>)
        : <p className="suave" style={{ marginTop: 6 }}>
            Lo que escribas le aparece al entrar, y queda arriba de su rutina.</p>}
    </div>

    {!!c.asistencia && (c.asistencia.presente + c.asistencia.ausente > 0) &&
      <div className="card">
        <div className="row">
          <h3>Asistencia del plan</h3>
          <span className="globo ok">{c.asistencia.presente} de {c.asistencia.presente + c.asistencia.ausente}</span>
        </div>
        <p className="suave" style={{ marginTop: 4 }}>
          Vino {c.asistencia.presente} {c.asistencia.presente === 1 ? 'vez' : 'veces'}
          {c.asistencia.ausente ? ` y faltó ${c.asistencia.ausente}` : ', sin faltas'}.
        </p>
      </div>}

    <div className="card">
      <h3>Su link personal</h3>
      <p className="suave" style={{ margin: '4px 0 12px' }}>Entra sin contraseña, desde el celular.</p>
      <input readOnly value={link} onFocus={e => e.target.select()} />
      <div className="dos" style={{ marginTop: 10 }}>
        <button className="btn linea chico" onClick={() =>
          navigator.clipboard.writeText(link).then(() => avisar('Link copiado')).catch(() => avisar('Copialo a mano', 'mal'))}>
          Copiar link</button>
        <a className="btn linea chico" style={{ textAlign: 'center', textDecoration: 'none', display: 'block' }}
          href={'https://wa.me/?text=' + encodeURIComponent('Hola ' + c.nombre + ', acá tenés tu rutina: ' + link)}
          target="_blank" rel="noopener">Mandar por WhatsApp</a>
      </div>
      <button className="btn linea chico" style={{ marginTop: 8 }} onClick={regenerarLink}>
        Generar un link nuevo</button>
      <p className="chico" style={{ marginTop: 6 }}>
        Si el link se compartió de más, generá uno nuevo. El anterior deja de funcionar.</p>
    </div>

    <div className="row" style={{ margin: '20px 0 12px' }}>
      <h3>Rutinas</h3>
      <button className="btn chico" onClick={() => setNueva({ nombre: 'Mes ' + (c.rutinas.length + 1), cantidad: 3, dias: [] })}>Nueva</button>
    </div>
    <button className="btn linea chico" style={{ marginBottom: 14 }} onClick={() => setUsarPlantilla(true)}>
      Usar una plantilla</button>

    {!c.rutinas.length && <div className="vacio"><p>Armale una rutina desde cero o partí de una plantilla.</p></div>}
    {c.rutinas.map(r => (
      <div className="card" key={r.id}>
        <div className="row"><h3>{r.nombre}</h3><span className="chico">Desde el {fmt(r.inicio)}</span></div>
        <div className="acciones" style={{ marginTop: 12 }}>
          <button className="btn linea chico" onClick={() => abrirRutina(r.id)}>Editar</button>
          <button className="btn linea chico" onClick={() => imprimir(r.id)}>Imprimir</button>
          <button className="btn chico" onClick={() => setRenovar(r)}>Renovar</button>
          <button className="btn linea chico" onClick={() => setDuplicar(r.id)}>Copiar a otro</button>
          <button className="btn linea chico" onClick={() => guardarPlantilla(r.id, r.nombre)}>Guardar plantilla</button>
          <button className="btn riesgo chico" onClick={() => borrarRutina(r)}>Eliminar</button>
        </div>
      </div>))}

    <div className="row" style={{ margin: '22px 0 10px' }}>
      <h3>Lo que carga tu alumno</h3>
      <div className="acciones">
        <button className="btn linea chico" onClick={() => setResumen(true)}>Resumen del mes</button>
        <button className="btn chico" onClick={() => abrirProgreso(id)}>Ver detalle</button>
      </div>
    </div>
    {!c.registros.length && !c.seguimiento.length &&
      <div className="vacio"><p>Cuando entrene y anote sus series, vas a verlas acá semana por semana.</p></div>}

    {c.registros.map(sem => (
      <div className="semana" key={sem.semana}>
        <h3 style={{ marginBottom: 8 }}>Semana {sem.semana}</h3>
        {sem.dias.map((d, i) => (
          <div className="card" key={i} style={{ padding: '14px 16px' }}>
            <div className="row"><b>{d.dia || 'Sin día'}</b><span className="chico">{fmt(d.fecha)}</span></div>
            {d.rutina && <p className="chico">{d.rutina}</p>}
            {d.ejercicios.map((e, j) => (
              <p className="suave" key={j} style={{ marginTop: 6 }}>
                <b style={{ color: 'var(--tinta)' }}>{e.nombre}</b>{': '}
                <span style={{ fontFamily: "'Archivo',sans-serif", fontVariantNumeric: 'tabular-nums' }}>
                  {e.series.map(x => `${x.kg}×${x.reps}`).join('   ')}</span>
              </p>))}
          </div>))}
      </div>))}

    {!!c.seguimiento.length &&
      <div className="card">
        <h3>Peso corporal</h3>
        <LineaPeso puntos={c.seguimiento} />
        {c.seguimiento.map(x =>
          <p className="suave" key={x.id} style={{ marginTop: 6 }}>
            <b style={{ fontFamily: "'Archivo',sans-serif" }}>{x.peso} kg</b>
            {' el ' + fmt(x.fecha)}{x.semana ? ` (semana ${x.semana})` : ''}{x.nota ? '. ' + x.nota : ''}</p>)}
      </div>}

    <button className="btn riesgo chico" onClick={borrarAlumno}>Eliminar alumno</button>

    {editar && <FormAlumno inicial={editar} onGuardar={guardarDatos} cerrar={() => setEditar(null)} />}

    {turnoForm &&
      <Modal titulo={turnoForm.id ? 'Cambiar turno' : 'Nuevo día'} sub={c.nombre} cerrar={() => setTurnoForm(null)}>
        <label>Día
          <select value={turnoForm.dia_semana} onChange={e => setTurnoForm({ ...turnoForm, dia_semana: +e.target.value })}>
            {[1, 2, 3, 4, 5, 6, 0].map(d => <option key={d} value={d}>{DIAS[d]}</option>)}
          </select></label>
        <div className="dos">
          <label>Hora<input type="time" value={turnoForm.hora}
            onChange={e => setTurnoForm({ ...turnoForm, hora: e.target.value })} /></label>
          <label>Duración (min)<input type="number" value={turnoForm.duracion}
            onChange={e => setTurnoForm({ ...turnoForm, duracion: +e.target.value })} /></label>
        </div>
        <label>Nota<input value={turnoForm.nota || ''} placeholder="Opcional"
          onChange={e => setTurnoForm({ ...turnoForm, nota: e.target.value })} /></label>
        <button className="btn" onClick={guardarTurno}>Guardar</button>
      </Modal>}

    {nueva &&
      <Modal titulo="Nueva rutina" sub="Definí los días y después cargás los ejercicios." cerrar={() => setNueva(null)}>
        <label>Nombre<input autoFocus value={nueva.nombre} onChange={e => setNueva({ ...nueva, nombre: e.target.value })} /></label>
        <label>¿Cuántos días entrena?
          <select value={nueva.cantidad} onChange={e => setNueva({ ...nueva, cantidad: +e.target.value })}>
            {[1, 2, 3, 4, 5, 6].map(n => <option key={n} value={n}>{n} días</option>)}
          </select></label>
        {Array.from({ length: nueva.cantidad }).map((_, i) => (
          <div className="dos" key={i}>
            <label>Día {i + 1}<input placeholder="Tren inferior" onChange={e => {
              const ds = [...nueva.dias]; ds[i] = { ...ds[i], nombre: e.target.value }; setNueva({ ...nueva, dias: ds });
            }} /></label>
            <label>Día sugerido<input placeholder="Lunes (opcional)" onChange={e => {
              const ds = [...nueva.dias]; ds[i] = { ...ds[i], dia: e.target.value }; setNueva({ ...nueva, dias: ds });
            }} /></label>
          </div>))}
        <button className="btn" onClick={crearRutina}>Crear rutina</button>
      </Modal>}

    {duplicar &&
      <Modal titulo="¿A quién se la copiamos?" cerrar={() => setDuplicar(null)}>
        <div className="lista">
          {clientes.map(x => <button className="op" key={x.id} onClick={() => copiarA(x.id)}>{x.nombre}</button>)}
        </div>
      </Modal>}

    {renovar &&
      <Modal titulo="Renovar la rutina"
        sub={'Se crea una copia de "' + renovar.nombre + '" para ' + c.nombre.split(' ')[0] + '.'}
        cerrar={() => setRenovar(null)}>
        <p className="suave" style={{ marginBottom: 16 }}>
          Si traés los pesos, cada ejercicio arranca con lo más pesado que logró, y el alumno lo ve como referencia.
        </p>
        <button className="btn" onClick={() => hacerRenovacion(true)}>Renovar con sus pesos</button>
        <button className="btn linea" style={{ marginTop: 10 }} onClick={() => hacerRenovacion(false)}>
          Renovar en blanco</button>
      </Modal>}

    {indic &&
      <Modal titulo="Indicación para el alumno"
        sub="La ve al entrar a su rutina. Si la cambiás, le vuelve a aparecer." cerrar={() => setIndic(null)}>
        <label>¿Qué querés decirle?
          <textarea rows="4" autoFocus maxLength={1000} value={indic.texto}
            onChange={e => setIndic({ texto: e.target.value })}
            placeholder="Ej: esta semana bajá el peso en sentadilla y enfocate en la técnica" /></label>
        <button className="btn" onClick={guardarIndicacion} disabled={!indic.texto.trim()}>Enviar indicación</button>
      </Modal>}

    {verIndic &&
      <Modal titulo="Indicaciones anteriores" cerrar={() => { setVerIndic(false); setHistorial(null); }}>
        {!historial ? <p className="suave">Cargando...</p>
          : !historial.length ? <p className="suave">Todavía no le escribiste ninguna.</p>
          : historial.map(x => (
            <div className="ej" key={x.id}>
              <p>{x.texto}</p>
              <p className="chico" style={{ marginTop: 4 }}>
                {fmt((x.creado || '').slice(0, 10))}
                {x.leida ? ' · la leyó' : ' · sin leer'}
              </p>
            </div>))}
      </Modal>}

    {tope && <Tope texto={tope} cerrar={() => setTope(null)} irAAyuda={irAAyuda} />}

    {usarPlantilla &&
      <Modal titulo="Tus plantillas" sub="Se crea una rutina nueva para este alumno." cerrar={() => setUsarPlantilla(false)}>
        {!plantillas.length
          ? <p className="suave">Todavía no tenés plantillas. Podés crearlas desde la pestaña Plantillas.</p>
          : <div className="lista">
              {plantillas.map(p => <button className="op" key={p.id} onClick={() => aplicarPlantilla(p.id)}>
                <b>{p.nombre}</b> <span className="chico">{p.dias} días</span></button>)}
            </div>}
      </Modal>}
  </div>);
}

/* Vista de impresión: el navegador la manda a papel o la guarda como PDF.
   Es el gancho para los entrenadores que hoy entregan la rutina impresa. */
function Impresion({ rutina, alumno, cerrar }) {
  // Se abre el diálogo de impresión solo, pero la vista queda: si el entrenador
  // cancela sin querer, no pierde la pantalla y puede volver a intentar.
  useEffect(() => {
    const t = setTimeout(() => window.print(), 300);
    return () => clearTimeout(t);
  }, []);

  return (
    <div className="hoja-impresa">
      <div className="no-imprimir" style={{ marginBottom: 16 }}>
        <button className="btn" onClick={() => window.print()}>Imprimir o guardar en PDF</button>
        <button className="btn linea" style={{ marginTop: 8 }} onClick={cerrar}>Volver</button>
      </div>
      <h1>{alumno}</h1>
      <p className="sub-impresa">{rutina.nombre}</p>
      {rutina.dias.map((d, i) => (
        <div className="dia-impreso" key={d.id}>
          <h2>{d.nombre || 'Día ' + (i + 1)}{d.dia_sugerido ? ' — ' + d.dia_sugerido : ''}</h2>
          <table>
            <thead><tr><th>Ejercicio</th><th>Series</th><th>Reps</th><th>Peso</th><th>Notas</th></tr></thead>
            <tbody>
              {d.items.map(it => (
                <tr key={it.id}>
                  <td><b>{it.ejercicio}</b></td>
                  <td>{it.series}</td><td>{it.reps}</td><td></td>
                  <td className="nota-impresa">{it.nota || ''}</td>
                </tr>))}
            </tbody>
          </table>
        </div>))}
      <p className="pie-impreso">AppTrainner</p>
    </div>);
}

/* Registro detallado: serie por serie, con la observación del alumno. */
function Progresograma({ clienteId, nombre, volver, ejercicios }) {
  const [datos, setDatos] = useState(null);
  const [semana, setSemana] = useState(null);
  const [evolucion, setEvolucion] = useState(null);
  const [tope, setTope] = useState(null);
  const { avisar } = usarAviso();

  const cargar = useCallback(async () => {
    try { setDatos(await api('/clientes/' + clienteId + '/progreso')); }
    catch (e) {
      if (e.status === 402) setTope(e.message); else avisar(e.message, 'mal');
      setDatos([]);
    }
  }, [clienteId, avisar]);
  useEffect(() => { cargar(); }, [cargar]);

  async function verEvolucion(nombreEj) {
    const ej = ejercicios.find(e => e.nombre === nombreEj);
    if (!ej) { avisar('Ese ejercicio ya no está en tu banco', 'mal'); return; }
    try {
      const puntos = await api('/clientes/' + clienteId + '/evolucion/' + ej.id);
      setEvolucion({ nombre: nombreEj, puntos });
    } catch (e) { avisar(e.message, 'mal'); }
  }

  if (tope) return (<div>
    <button className="volver" onClick={volver}>← Volver a la ficha</button>
    <div className="vacio"><p>{tope}</p></div>
  </div>);
  if (!datos) return <p className="suave">Cargando...</p>;

  const semanas = datos.map(s => s.semana);
  const actual = semana != null ? datos.find(s => s.semana === semana) : datos[0];

  return (<div>
    <button className="volver" onClick={volver}>← Volver a la ficha</button>
    <h2>Progreso de {nombre}</h2>
    <p className="suave" style={{ marginBottom: 16 }}>
      Todo lo que anotó, serie por serie.
    </p>

    {!datos.length && <div className="vacio"><p>Todavía no registró ningún entrenamiento.</p></div>}

    {!!semanas.length &&
      <div className="semanas">
        {semanas.map(n => (
          <button key={n} className={'chip' + ((actual || {}).semana === n ? ' on' : '')}
            onClick={() => setSemana(n)}>Semana {n}</button>))}
      </div>}

    {actual && actual.dias.map((d, i) => (
      <div className="dia" key={i}>
        <div className="row">
          <h3>{d.dia || 'Sin día'}</h3>
          <span className="chico">{fmt(d.fecha)}</span>
        </div>
        <p className="chico">
          {d.rutina || ''}{d.peso_corporal ? ` · pesó ${d.peso_corporal} kg ese día` : ''}
        </p>

        {d.ejercicios.map((e, j) => (
          <div className="ej" key={j}>
            <div className="row" style={{ alignItems: 'flex-start' }}>
              <b>{e.nombre}</b>
              <button className="btn linea chico" onClick={() => verEvolucion(e.nombre)}>Ver evolución</button>
            </div>
            <table className="tabla detalle">
              <thead><tr><th>Serie</th><th>Peso</th><th>Reps</th><th>Hora</th></tr></thead>
              <tbody>
                {e.series.map(s => (
                  <tr key={s.id}>
                    <td>{s.numero || '—'}</td>
                    <td><b>{s.kg} kg</b></td>
                    <td><b>{s.reps}</b></td>
                    <td className="chico">{hora(s.hora)}</td>
                  </tr>))}
              </tbody>
            </table>
            {e.observacion &&
              <div className="observacion"><b>Dijo el alumno</b><p>{e.observacion}</p></div>}
          </div>))}
      </div>))}

    {evolucion &&
      <Modal titulo={evolucion.nombre} sub="El peso más alto de cada semana" cerrar={() => setEvolucion(null)}>
        {evolucion.puntos.length < 2
          ? <p className="suave">Todavía no hay suficientes semanas para comparar.</p>
          : (<div>
              <div className="grafico">
                <svg viewBox="0 0 300 80" preserveAspectRatio="none">
                  {(() => {
                    const p = evolucion.puntos, kgs = p.map(x => x.kg);
                    const min = Math.min(...kgs), max = Math.max(...kgs), rango = max - min || 1;
                    const x = i => (i / (p.length - 1)) * 292 + 4;
                    const y = v => 70 - ((v - min) / rango) * 56;
                    return (<g>
                      <path d={p.map((q, i) => `${i ? 'L' : 'M'}${x(i)},${y(q.kg)}`).join(' ')}
                        fill="none" stroke="var(--acento)" strokeWidth="2"
                        vectorEffect="non-scaling-stroke" strokeLinejoin="round" />
                      {p.map((q, i) => <circle key={i} cx={x(i)} cy={y(q.kg)} r="3" fill="var(--acento)" />)}
                    </g>);
                  })()}
                </svg>
              </div>
              <table className="tabla">
                <thead><tr><th>Semana</th><th>Máximo</th></tr></thead>
                <tbody>{evolucion.puntos.map(p =>
                  <tr key={p.semana}><td>Semana {p.semana}</td><td><b>{p.kg} kg</b></td></tr>)}</tbody>
              </table>
            </div>)}
      </Modal>}
  </div>);
}

/* Resumen del mes para imprimir: es lo que el entrenador le muestra al alumno
   cuando llega el momento de renovar. */
function ResumenMes({ cliente, cerrar }) {
  useEffect(() => { const t = setTimeout(() => window.print(), 300); return () => clearTimeout(t); }, []);

  const seg = [...(cliente.seguimiento || [])].sort((a, b) => a.fecha.localeCompare(b.fecha));
  const inicial = seg[0], actual = seg[seg.length - 1];
  const dif = inicial && actual ? (actual.peso - inicial.peso).toFixed(1) : null;

  // Mejor peso por ejercicio a lo largo del plan.
  const mejores = {};
  (cliente.registros || []).forEach(sem => sem.dias.forEach(d => d.ejercicios.forEach(e => {
    e.series.forEach(x => {
      if (!mejores[e.nombre] || x.kg > mejores[e.nombre]) mejores[e.nombre] = x.kg;
    });
  })));
  const entrenos = (cliente.registros || []).reduce((n, s) => n + s.dias.length, 0);
  const a = cliente.asistencia || { presente: 0, ausente: 0 };

  return (
    <div className="hoja-impresa">
      <div className="no-imprimir" style={{ marginBottom: 16 }}>
        <button className="btn" onClick={() => window.print()}>Imprimir o guardar en PDF</button>
        <button className="btn linea" style={{ marginTop: 8 }} onClick={cerrar}>Volver</button>
      </div>
      <h1>{cliente.nombre}</h1>
      <p className="sub-impresa">Resumen del plan, del {fmt(cliente.inicio)} al {fmtLargo(finPlan(cliente.inicio))}</p>

      <div className="dia-impreso">
        <h2>Cómo le fue</h2>
        <table>
          <tbody>
            <tr><td>Entrenamientos registrados</td><td><b>{entrenos}</b></td></tr>
            {(a.presente + a.ausente > 0) &&
              <tr><td>Asistencia</td><td><b>{a.presente} de {a.presente + a.ausente}</b></td></tr>}
            {inicial && <tr><td>Peso al empezar</td><td><b>{inicial.peso} kg</b></td></tr>}
            {actual && seg.length > 1 && <tr><td>Peso actual</td><td><b>{actual.peso} kg</b></td></tr>}
            {dif !== null && seg.length > 1 &&
              <tr><td>Diferencia</td><td><b>{dif > 0 ? '+' : ''}{dif} kg</b></td></tr>}
          </tbody>
        </table>
      </div>

      {!!Object.keys(mejores).length &&
        <div className="dia-impreso">
          <h2>Sus mejores marcas</h2>
          <table>
            <thead><tr><th>Ejercicio</th><th>Máximo</th></tr></thead>
            <tbody>
              {Object.entries(mejores).sort((x, y) => y[1] - x[1]).slice(0, 12).map(([n, kg]) => (
                <tr key={n}><td><b>{n}</b></td><td>{kg} kg</td></tr>))}
            </tbody>
          </table>
        </div>}

      <p className="pie-impreso">AppTrainner</p>
    </div>);
}

/* ---------- editor de rutina ---------- */
function Editor({ id, volver, ejercicios, grupos, recargarEjercicios }) {
  const [r, setR] = useState(null);
  const [ultimos, setUltimos] = useState({});
  const [busq, setBusq] = useState({});
  const [form, setForm] = useState(null);
  const [diaForm, setDiaForm] = useState(null);
  const [nombreForm, setNombreForm] = useState(null);
  const arrastrando = useRef(null);
  const { avisar, confirmar } = usarAviso();

  const cargar = useCallback(async () => {
    try {
      const rutina = await api('/rutinas/' + id);
      setR(rutina);
      // Lo último que levantó el alumno, para armar la progresión sin buscar en el historial.
      setUltimos(await api('/clientes/' + rutina.cliente_id + '/ultimos'));
    } catch (e) { avisar(e.message, 'mal'); }
  }, [id, avisar]);
  useEffect(() => { cargar(); }, [cargar]);
  if (!r) return <p className="suave">Cargando...</p>;

  async function guardarNombre() {
    const limpio = (nombreForm || '').trim();
    if (!limpio) { avisar('Poné un nombre a la rutina.', 'mal'); return; }
    if (limpio === r.nombre) { setNombreForm(null); return; }
    try {
      await api('/rutinas/' + id, { method: 'PATCH', body: { nombre: limpio } });
      setNombreForm(null); cargar(); avisar('Nombre actualizado');
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function guardarItem() {
    try {
      if (form.item_id) {
        await api('/items/' + form.item_id, { method: 'PATCH',
          body: { series: form.series, reps: form.reps, nota: form.nota,
                  peso_sugerido: form.peso_sugerido } });
        avisar('Ejercicio actualizado');
      } else {
        let ejId = form.ejercicio_id;
        if (!ejId) {
          const e = await api('/ejercicios', { method: 'POST',
            body: { nombre: form.nombreNuevo, grupo: form.grupo, video_url: form.video } });
          ejId = e.id; await recargarEjercicios();
        }
        await api('/dias/' + form.diaId + '/items', { method: 'POST',
          body: { ejercicio_id: ejId, series: form.series, reps: form.reps, nota: form.nota,
                  peso_sugerido: form.peso_sugerido } });
        setBusq({ ...busq, [form.diaId]: '' });
        avisar('Ejercicio agregado');
      }
      setForm(null); cargar();
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function quitar(it) {
    if (!await confirmar('¿Sacamos este ejercicio de la rutina?', it.ejercicio, 'Sí, sacarlo')) return;
    try { await api('/items/' + it.id, { method: 'DELETE' }); setForm(null); cargar(); avisar('Listo'); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  async function guardarDia() {
    try {
      if (diaForm.id) { await api('/dias/' + diaForm.id, { method: 'PATCH', body: diaForm }); avisar('Día actualizado'); }
      else { await api('/rutinas/' + id + '/dias', { method: 'POST', body: diaForm }); avisar('Día agregado'); }
      setDiaForm(null); cargar();
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function borrarDia(d) {
    if (!await confirmar('¿Eliminamos este día?', `"${d.nombre}" y sus ejercicios.`, 'Sí, eliminar')) return;
    try { await api('/dias/' + d.id, { method: 'DELETE' }); setDiaForm(null); cargar(); avisar('Día eliminado'); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  // Reordenar: arrastre en escritorio, flechas en el celular.
  async function reordenar(dia, desde, hacia) {
    if (hacia < 0 || hacia >= dia.items.length || desde === hacia) return;
    const ids = dia.items.map(i => i.id);
    const [m] = ids.splice(desde, 1); ids.splice(hacia, 0, m);
    const copia = { ...r, dias: r.dias.map(d => d.id !== dia.id ? d
      : { ...d, items: ids.map(i => d.items.find(x => x.id === i)) }) };
    setR(copia);
    try { await api('/dias/' + dia.id + '/orden', { method: 'PATCH', body: { ids } }); }
    catch (e) { avisar(e.message, 'mal'); cargar(); }
  }

  return (<div>
    <button className="volver" onClick={volver}>← Volver a la ficha</button>
    <div className="row" style={{ marginBottom: 4 }}>
      <h2 style={{ margin: 0 }}>{r.nombre}</h2>
      <button className="btn linea chico" onClick={() => setNombreForm(r.nombre)}>Cambiar nombre</button>
    </div>
    <p className="suave" style={{ marginBottom: 18 }}>
      Tocá un ejercicio para cambiarle series o repeticiones. Arrastralo (o usá las flechas) para reordenar.
    </p>

    {r.dias.map((d, i) => {
      const q = busq[d.id] || '';
      const hits = q ? ejercicios.filter(e => e.nombre.toLowerCase().includes(q.toLowerCase())).slice(0, 5) : [];
      return (
        <div className="dia" key={d.id}>
          <div className="row">
            <h3>{d.nombre || 'Día ' + (i + 1)}</h3>
            <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
              {d.dia_sugerido && <span className="globo">{d.dia_sugerido}</span>}
              <button className="btn linea chico" onClick={() => setDiaForm(d)}>Editar día</button>
            </div>
          </div>

          {!d.items.length && <p className="suave" style={{ margin: '10px 0' }}>Sin ejercicios todavía.</p>}
          {d.items.map((it, idx) => (
            <div className="ej" key={it.id} draggable
              onDragStart={() => { arrastrando.current = { dia: d.id, idx }; }}
              onDragOver={e => e.preventDefault()}
              onDrop={e => { e.preventDefault();
                if (arrastrando.current && arrastrando.current.dia === d.id) reordenar(d, arrastrando.current.idx, idx);
                arrastrando.current = null; }}>
              <div className="ej-top">
                <div style={{ display: 'flex', gap: 4 }}>
                  <span className="mango" title="Arrastrar">⠿</span>
                  <div>
                    <b>{it.ejercicio}</b>
                    {it.video_url
                      ? <div><a className="video" href={it.video_url} target="_blank" rel="noopener">Ver el video</a></div>
                      : <div className="chico">Sin video</div>}
                    {it.nota && <div className="chico">{it.nota}</div>}
                    {it.peso_sugerido &&
                      <div className="ultimo">Referencia: <b>{it.peso_sugerido} kg</b></div>}
                    {ultimos[it.ejercicio_id] &&
                      <div className="ultimo">
                        Última vez: <b>{ultimos[it.ejercicio_id].kg} kg × {ultimos[it.ejercicio_id].reps}</b>
                        {' el ' + fmt(ultimos[it.ejercicio_id].fecha)}
                      </div>}
                  </div>
                </div>
                <div style={{ textAlign: 'right' }}>
                  <div className="series">{it.series}×{it.reps}</div>
                  <div style={{ display: 'flex', gap: 4, marginTop: 6, justifyContent: 'flex-end' }}>
                    <button className="mini" onClick={() => reordenar(d, idx, idx - 1)} disabled={idx === 0} title="Subir">↑</button>
                    <button className="mini" onClick={() => reordenar(d, idx, idx + 1)} disabled={idx === d.items.length - 1} title="Bajar">↓</button>
                    <button className="btn linea chico" style={{ padding: '5px 10px', fontSize: 12.5 }}
                      onClick={() => setForm({ item_id: it.id, titulo: it.ejercicio, series: it.series || '',
                        reps: it.reps || '', nota: it.nota || '', peso_sugerido: it.peso_sugerido || '',

              <button className="op" style={{ color: 'var(--verde)' }}
                onClick={() => setForm({ diaId: d.id, ejercicio_id: null, nombreNuevo: q, titulo: q,

    <button className="btn linea" onClick={() => setDiaForm({ nombre: 'Día ' + (r.dias.length + 1), dia_sugerido: '' })}>
