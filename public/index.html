<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AppTrainner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     AppTrainner — paleta "blanco y naranja"
     Papel cálido, tarjetas blancas, naranja solo para lo que
     se toca o lo que hay que mirar. Títulos en Archivo,
     texto en Public Sans.
     ========================================================= */
  :root{
    --papel:#FBF9F7;
    --hoja:#FFFFFF;
    --borde:#EDE7E1;
    --tinta:#1A1410;
    --gris:#6E6259;
    --acento:#E8621F;          /* rellenos y cifras grandes */
    --acento-texto:#B4470F;    /* el mismo naranja, legible en tamaño chico */
    --acento-hover:#C94F12;
    --suave:#FFF0E6;
    --sobre-acento:#FFFFFF;
    --aviso:#B4741C;
    --aviso-texto:#8A5A13;
    --aviso-suave:#FDF2E0;
    --carmin:#A4243B;          /* borrar y errores: lejos del naranja a propósito */
    --carmin-suave:#FBEDEF;
    --carmin-borde:#EFD3D9;
    --verde:#2F7A55;           /* crear algo nuevo dentro de una lista */
    --nav:#FFFFFF;
    --nav-tinta:#1A1410;
    --nav-gris:#6F635A;
    --nav-linea:#EDE7E1;
    --marca:rgba(255,255,255,.6);
    --globo-fondo:#F2EDE8;
    --borde-fuerte:#E0C9B8;
    --suave-hover:#FFE3D1;
    --linea-video:#F5CDB2;
    --mango:#CFC2B6;
    --r:10px;
    --r-chico:8px;
    --som:0 1px 2px rgba(26,20,16,.05);
    --som-alta:0 10px 34px rgba(26,20,16,.16);
    --tit:'Archivo';
  }
  /* Modo oscuro: la misma paleta de noche, para gimnasios con luz baja. */
  html[data-tema="oscuro"]{
    --papel:#16120F;
    --hoja:#1E1915;
    --borde:#332B24;
    --tinta:#F4EFEA;
    --gris:#A89789;
    --acento:#FF7F42;
    --acento-texto:#FF9963;
    --acento-hover:#FF9963;
    --suave:#3A2415;
    --sobre-acento:#231A14;
    --aviso:#E0A340;
    --aviso-texto:#E0A340;
    --aviso-suave:#3A2E18;
    --carmin:#F0879B;
    --carmin-suave:#3B1D24;
    --carmin-borde:#5A2C36;
    --verde:#5FBF8E;
    --nav:#1E1915;
    --nav-tinta:#F4EFEA;
    --nav-gris:#A89789;
    --nav-linea:#332B24;
    --marca:rgba(0,0,0,.4);
    --globo-fondo:#2C2520;
    --borde-fuerte:#54463B;
    --suave-hover:#4A2C18;
    --linea-video:#6B4326;
    --mango:#5C4E43;
    --som:0 1px 2px rgba(0,0,0,.4);
    --som-alta:0 10px 34px rgba(0,0,0,.5);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--papel);
    font-family:'Public Sans',system-ui,-apple-system,sans-serif;
    color:var(--tinta);
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0;font-family:var(--tit),system-ui,sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.18}
  h1{font-size:25px} h2{font-size:24px} h3{font-size:16px}
  p{margin:0}
  a{color:var(--acento-texto)}

  /* ---------- barra superior ---------- */
  .topbar{
    background:var(--nav);color:var(--nav-tinta);padding:14px 20px 0;position:sticky;top:0;z-index:20;
    border-bottom:1px solid var(--nav-linea);
  }
  .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
  .brand h1{
    color:var(--nav-tinta);font-family:var(--tit),sans-serif;font-weight:800;
    font-size:19px;letter-spacing:-.02em;
  }
  .brand .hola{color:var(--nav-gris);font-size:13.5px}
  .brand button{
    background:none;border:0;color:var(--nav-gris);font-family:inherit;
    font-size:13.5px;font-weight:600;cursor:pointer;padding:6px 2px;
  }
  .brand button:hover{color:var(--acento)}
  .brand .derecha{margin-left:auto;display:flex;align-items:center;gap:14px}
  .tema{
    background:none;border:0;cursor:pointer;font-size:17px;line-height:1;padding:6px 8px;
    min-height:32px;min-width:32px;color:var(--nav-gris);
  }
  .tema:hover{color:var(--acento)}
  .tabs{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;background:none;border:0;color:var(--nav-gris);font-family:var(--tit),sans-serif;
    font-size:14.5px;font-weight:600;padding:6px 0 11px;cursor:pointer;
    border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;letter-spacing:-.01em;
  }
  .tab:hover{color:var(--nav-tinta)}
  .tab.on{color:var(--nav-tinta);border-bottom-color:var(--acento)}

  /* ---------- barra inferior (celular) ---------- */
  .barra-abajo{display:none}
  @media (max-width:760px){
    .topbar{padding:12px 16px}
    .brand{margin-bottom:0}
    .tabs{display:none}
    .barra-abajo{
      display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;
      background:var(--nav);border-top:1px solid var(--nav-linea);
      padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;
    }
    .barra-abajo button{
      flex:1;min-width:0;border:0;background:none;color:var(--nav-gris);
      font-family:var(--tit),sans-serif;font-size:11.5px;font-weight:600;
      padding:9px 2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      border-top:2px solid transparent;margin-top:-6px;padding-top:11px;
    }
    .barra-abajo button.on{color:var(--acento);border-top-color:var(--acento)}
  }

  .wrap{max-width:720px;margin:0 auto;padding:22px 16px 96px}
  @media (max-width:760px){
    .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  }
  /* En pantallas grandes las listas se reparten en columnas en vez de quedar
     como una cinta angosta; las vistas de detalle se mantienen legibles. */
  @media (min-width:1000px){
    .wrap{max-width:1080px;padding:26px 24px 80px}
    .wrap.angosto{max-width:780px}
    .columnas{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;align-items:start}
    .columnas .card,.columnas .dia{margin-bottom:0}
  }
  @media (min-width:1400px){ .wrap{max-width:1240px} }

  /* ---------- tarjetas ---------- */
  .card{
    background:var(--hoja);border:1px solid var(--borde);border-radius:var(--r);
    box-shadow:var(--som);padding:16px 18px;margin-bottom:12px;
  }
  .card.tap{cursor:pointer;transition:border-color .12s, box-shadow .12s}
  .card.tap:hover{border-color:var(--borde-fuerte);box-shadow:0 3px 12px rgba(26,20,16,.09)}
  .card.peligro{border-left:4px solid var(--carmin)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .suave{color:var(--gris);font-size:14.5px}
  .chico{font-size:13px;color:var(--gris)}

  /* ---------- botones ---------- */
  button{font-family:inherit}
  .btn{
    background:var(--acento);color:var(--sobre-acento);border:0;border-radius:var(--r);padding:13px 18px;
    font-family:var(--tit),sans-serif;font-size:15px;font-weight:700;letter-spacing:-.01em;
    cursor:pointer;width:100%;
  }
  .btn:hover{background:var(--acento-hover)}
  .btn.linea{background:var(--hoja);color:var(--tinta);border:1.5px solid var(--borde)}
  .btn.linea:hover{border-color:var(--acento);color:var(--acento)}
  .btn.suave{background:var(--suave);color:var(--acento-texto)}
  .btn.suave:hover{background:var(--suave-hover)}
  .btn.riesgo{background:var(--hoja);color:var(--carmin);border:1.5px solid var(--carmin-borde)}
  .btn.riesgo:hover{background:var(--carmin-suave)}
  .btn.chico{width:auto;padding:9px 14px;font-size:13.5px}
  .btn:disabled{opacity:.4;cursor:default}
  .btn:disabled:hover{background:var(--acento)}
  .btn.linea:disabled:hover{background:var(--hoja);border-color:var(--borde);color:var(--tinta)}
  .btn.riesgo:disabled:hover{background:var(--hoja)}
  :focus-visible{outline:2.5px solid var(--acento);outline-offset:2px}

  /* ---------- formularios ---------- */
  input,select,textarea{
    font-family:inherit;font-size:16px;color:var(--tinta);width:100%;padding:11px 12px;
    border:1.5px solid var(--borde);border-radius:var(--r-chico);background:var(--hoja);margin-top:6px;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--acento);outline:none}
  input[type=file]{padding:9px;font-size:14px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:14px;color:var(--tinta)}

  /* ---------- etiquetas ---------- */
  .globo{
    display:inline-block;font-family:var(--tit),sans-serif;font-size:12px;font-weight:600;
    padding:3px 10px;border-radius:99px;background:var(--globo-fondo);color:var(--gris);white-space:nowrap;
  }
  .globo.ok{background:var(--suave);color:var(--acento-texto)}
  .globo.aviso{background:var(--aviso-suave);color:var(--aviso-texto)}
  .globo.alerta{background:var(--carmin-suave);color:var(--carmin)}

  .vacio{
    background:var(--hoja);border:1px dashed var(--borde-fuerte);border-radius:var(--r);
    padding:30px 20px;text-align:center;
  }
  .vacio p{margin-bottom:14px;color:var(--gris)}

  /* ---------- iniciales del alumno ---------- */
  .inicial{
    flex:0 0 38px;height:38px;border-radius:99px;background:var(--suave);color:var(--acento-texto);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--tit),sans-serif;font-weight:700;font-size:14px;letter-spacing:-.01em;
  }
  .inicial.grande{flex-basis:46px;height:46px;font-size:17px}
  .alumno-cab{display:flex;align-items:center;gap:11px;margin-bottom:12px}
  .alumno-cab .quien{min-width:0;flex:1}
  .alumno-cab h3{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}


  .ficha-cab{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-bottom:8px}
  .ficha-cab .quien{min-width:0;flex:1 1 180px;display:flex;flex-direction:column}
  .ficha-cab .btn{margin-left:auto}
  /* ---------- cinta del plan ---------- */
  .plan{margin-top:2px}
  .cinta{
    position:relative;height:7px;background:var(--borde);border-radius:99px;overflow:hidden;
  }
  .cinta .lleno{position:absolute;inset:0 auto 0 0;background:var(--acento);border-radius:99px}
  .cinta .marca{position:absolute;top:0;bottom:0;width:1px;background:var(--marca)}
  .cinta.cerca .lleno{background:var(--aviso)}
  .cinta.cumplido .lleno{background:var(--carmin)}
  .plan .pie{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
  .plan .pie b{font-family:var(--tit),sans-serif;font-size:13px;font-weight:700}
  .plan .pie span{font-size:12.5px;color:var(--gris)}

  .recordatorio{
    background:var(--aviso-suave);border:1px solid var(--borde);border-left:4px solid var(--aviso);
    border-radius:var(--r);padding:14px 16px;margin-bottom:18px;
  }
  .recordatorio h3{font-size:15px;margin-bottom:2px}
  .recordatorio .suave{color:#8A6A3A}
  html[data-tema="oscuro"] .recordatorio .suave{color:#D9BE8C}
  .recordatorio.alerta{background:var(--carmin-suave);border-left-color:var(--carmin)}
  .recordatorio.alerta .suave{color:var(--carmin)}

  /* ---------- días y ejercicios ---------- */
  .dia{
    background:var(--hoja);border:1px solid var(--borde);border-radius:var(--r);
    box-shadow:var(--som);padding:16px 18px;margin-bottom:12px;
  }
  .ej{border-top:1px solid var(--borde);padding:12px 0;background:var(--hoja)}
  .ej.arrastrando{opacity:.35}
  .ej-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .ej-top > div{min-width:0}
  .mango{cursor:grab;color:var(--mango);font-size:17px;line-height:1.3;padding-right:8px;user-select:none}
  .video{color:var(--acento-texto);font-weight:600;font-size:13.5px;text-decoration:none;border-bottom:1px solid var(--linea-video)}
  .video:hover{border-bottom-color:var(--acento)}
  .series{
    font-family:var(--tit),sans-serif;font-size:22px;font-weight:800;letter-spacing:-.03em;
    color:var(--tinta);white-space:nowrap;font-variant-numeric:tabular-nums;
  }
  .mini{
    background:var(--hoja);border:1.5px solid var(--borde);border-radius:var(--r-chico);width:30px;height:30px;
    cursor:pointer;font-size:14px;color:var(--gris);padding:0;
  }
  .mini:hover:not(:disabled){border-color:var(--acento);color:var(--acento)}
  .mini:disabled{opacity:.35;cursor:default}

  .lista{border:1.5px solid var(--borde);border-radius:var(--r);margin-top:8px;background:var(--hoja);overflow:hidden}
  .op{
    padding:12px 14px;cursor:pointer;border:0;border-bottom:1px solid var(--borde);
    font-family:inherit;font-size:15px;width:100%;text-align:left;background:none;color:var(--tinta);
  }
  .op:last-child{border-bottom:0}
  .op:hover{background:var(--suave)}

  .volver{
    background:none;border:0;color:var(--gris);font-size:14px;font-weight:600;
    cursor:pointer;padding:0 0 14px;font-family:inherit;
  }
  .volver:hover{color:var(--acento)}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .anotar{display:flex;gap:8px;margin-top:10px}
  .anotar input{margin-top:0;min-width:0;text-align:center;font-family:var(--tit),sans-serif;font-weight:700;font-size:17px}

  /* ---------- entrada (login) ---------- */
  .entrada{min-height:100vh;display:grid;grid-template-columns:1fr}
  .entrada-lado{
    background:var(--hoja);border-bottom:1px solid var(--borde);
    padding:32px 22px;display:flex;flex-direction:column;gap:14px;
  }
  .entrada-lado .marca-lado{
    font-family:var(--tit),sans-serif;font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--tinta);
  }
  .entrada-lado h2{font-size:26px;line-height:1.15;max-width:20ch}
  .entrada-lado p{color:var(--gris);font-size:15px;max-width:34ch}
  .entrada-lado .pie-lado{color:var(--gris);font-size:12.5px}
  .entrada-form{padding:30px 22px 60px;display:flex;flex-direction:column;justify-content:center}
  .entrada-caja{width:100%;max-width:360px;margin:0 auto}
  .entrada-caja h3{font-size:21px;margin-bottom:16px}
  @media (min-width:900px){
    .entrada{grid-template-columns:1fr 1fr}
    .entrada-lado{
      border-bottom:0;border-right:1px solid var(--borde);
      padding:48px 44px;justify-content:space-between;gap:40px;
    }
    .entrada-lado h2{font-size:31px}
    .entrada-form{padding:48px 44px}
  }
  .centro{max-width:390px;margin:48px auto;padding:0 16px}
  .portada{margin-bottom:26px}
  .portada .cifra{
    display:block;font-family:var(--tit),sans-serif;font-size:56px;font-weight:800;
    letter-spacing:-.04em;color:var(--acento);line-height:.95;font-variant-numeric:tabular-nums;
  }
  .portada h1{margin-top:14px;font-size:28px}
  .portada p{color:var(--gris);font-size:15px;margin-top:8px;max-width:32ch}
  .olvide{
    background:none;border:0;color:var(--gris);font-family:inherit;font-size:13px;
    cursor:pointer;padding:14px 0 0;width:100%;text-decoration:underline;
  }
  .olvide:hover{color:var(--acento)}

  /* ---------- series ya anotadas ---------- */
  .hechas{border-left:2px solid var(--acento);padding-left:12px;margin-top:10px}
  .hechas .fila{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 0}
  .hechas .fila span{font-family:var(--tit),sans-serif;font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .hechas button{
    background:none;border:0;color:var(--gris);font-size:12.5px;cursor:pointer;font-family:inherit;
    text-decoration:underline;
  }
  .hechas button:hover{color:var(--carmin)}

  .semana{margin-bottom:20px}
  .semana > h3{
    display:inline-block;background:var(--suave);color:var(--acento-texto);font-size:13px;
    padding:4px 12px;border-radius:99px;margin-bottom:8px;
  }

  /* ---------- tablero de datos ---------- */
  .tablero{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:14px}
  .dato-grande{
    background:var(--hoja);border:1px solid var(--borde);border-radius:var(--r);box-shadow:var(--som);
    padding:14px 16px;display:flex;flex-direction:column;gap:1px;
  }
  .cifra-dato{
    font-family:var(--tit),sans-serif;font-size:27px;font-weight:800;letter-spacing:-.03em;
    color:var(--acento);line-height:1.1;font-variant-numeric:tabular-nums;
  }
  .etiqueta-dato{font-size:13px;font-weight:600}
  .barras{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:10px}
  .barra-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end}
  .barra-col .col{width:100%;background:var(--acento);border-radius:4px 4px 0 0;min-height:3px}

  /* ---------- agenda semanal ---------- */
  .semana-grilla{
    display:grid;grid-template-columns:44px repeat(7, minmax(72px, 1fr));gap:2px;
    background:var(--hoja);border:1px solid var(--borde);border-radius:var(--r);box-shadow:var(--som);
    padding:10px 8px 14px;overflow-x:auto;
  }
  .semana-grilla .horas{position:relative;height:calc(var(--alto) + 30px);margin-top:30px}
  .semana-grilla .hora-marca{
    position:absolute;right:6px;font-size:11px;color:var(--gris);transform:translateY(-6px);
    font-family:var(--tit),sans-serif;
  }
  .semana-grilla .col-dia{display:flex;flex-direction:column;min-width:0}
  .semana-grilla .cabeza{
    height:30px;font-family:var(--tit),sans-serif;font-weight:700;font-size:13px;
    color:var(--gris);text-align:center;
  }
  .semana-grilla .pista{position:relative;height:var(--alto);border-left:1px solid var(--borde)}
  .semana-grilla .linea{position:absolute;left:0;right:0;height:1px;background:var(--borde);opacity:.6}
  .semana-grilla .bloque{
    position:absolute;box-sizing:border-box;
    left:calc(var(--l, 0%) + 2px);width:calc(var(--w, 100%) - 4px);
    background:var(--suave);
    border:0;border-left:3px solid var(--acento);
    border-radius:6px;padding:3px 5px;cursor:pointer;overflow:hidden;text-align:left;
    display:flex;flex-direction:column;gap:1px;font-family:inherit;
    transition:left .12s ease, width .12s ease;
  }
  /* Cuando comparten horario quedan angostos: al pasar el mouse (o con el
     teclado) el bloque se abre a toda la columna y se lee completo. */
  .semana-grilla .bloque:hover,
  .semana-grilla .bloque:focus-visible{
    left:2px;width:calc(100% - 4px);z-index:50;box-shadow:var(--som);
  }
  .semana-grilla .bloque.apretado{padding:2px 4px;border-left-width:2px}
  .semana-grilla .bloque.apretado .hora-bloque{display:none}
  .semana-grilla .bloque.apretado:hover .hora-bloque,
  .semana-grilla .bloque.apretado:focus-visible .hora-bloque{display:block}
  .semana-grilla .bloque:hover{background:var(--acento);color:var(--sobre-acento)}
  .semana-grilla .bloque:hover .hora-bloque,
  .semana-grilla .bloque:hover .quien-bloque{color:var(--sobre-acento)}
  .semana-grilla .bloque.choca{background:var(--carmin-suave);border-left-color:var(--carmin)}
  .semana-grilla .bloque.choca:hover{background:var(--carmin)}
  .semana-grilla .bloque.choca:hover .hora-bloque,
  .semana-grilla .bloque.choca:hover .quien-bloque{color:var(--sobre-acento)}
  .semana-grilla .hora-bloque{font-family:var(--tit),sans-serif;font-size:11px;font-weight:700;color:var(--acento-texto)}
  .semana-grilla .bloque.choca .hora-bloque{color:var(--carmin)}
  .semana-grilla .quien-bloque{font-size:11.5px;color:var(--tinta);line-height:1.2;overflow:hidden}
  .navdia{

  .acciones{display:flex;flex-wrap:wrap;gap:6px}

  /* ---------- impresión ---------- */

  .agregar-nota{
    background:none;border:0;font-family:inherit;font-size:13.5px;
    font-weight:600;cursor:pointer;padding:8px 0;min-height:32px;text-decoration:underline;

  .navsemana{
    display:flex;align-items:center;gap:12px;background:var(--hoja);border:1px solid var(--borde);
    box-shadow:var(--som);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;
  }
  .navsemana .mini{width:34px;height:34px;font-size:18px;font-weight:700;color:var(--tinta)}
  .navsemana .centro-sem{flex:1;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
  .navsemana b{font-family:var(--tit),sans-serif;font-size:16px}
  .referencia{font-size:13px;color:var(--gris);margin-top:8px}
  .referencia b{font-family:var(--tit),sans-serif;color:var(--acento-texto)}
  .peso-dia .anotar{max-width:none;flex:0 0 auto}
  .peso-dia .anotar input{width:82px;text-align:center;font-family:var(--tit),sans-serif;
    font-weight:700;font-size:17px;padding:10px 6px}
  @media (max-width:430px){
    .peso-dia .row{flex-wrap:wrap}
    .peso-dia .anotar{width:100%;margin-top:10px}

  /* ---------- indicación del entrenador ---------- */
  .indicacion{

  /* ---------- progreso detallado ---------- */

  .chip{

  .chip:hover{border-color:var(--acento);color:var(--acento)}

  .observacion{margin-top:8px;border-left:2px solid var(--acento);padding-left:12px}

  .grafico{margin:12px 0 6px}
  .grafico svg{width:100%;height:70px;display:block}
  .dif{font-family:var(--tit),sans-serif;font-size:15px}
  .dif.baja{color:var(--acento-texto)}

  .ultimo{font-size:12.5px;color:var(--gris);margin-top:3px}
  .ultimo b{font-family:var(--tit),sans-serif;color:var(--acento-texto)}
  .asist{
    background:var(--hoja);border:1.5px solid var(--borde);border-radius:var(--r-chico);padding:8px 13px;

  .asist:hover{border-color:var(--tinta);color:var(--tinta)}

  .asist.falto{background:var(--carmin-suave);border-color:var(--carmin-borde);color:var(--carmin)}
  .buscador{margin-top:0;flex:1;min-width:180px;max-width:280px;padding:9px 12px;font-size:14.5px}
  .uso{margin-bottom:12px}

  .beneficios li{margin-bottom:7px;font-size:15px}

  .respuesta{margin-top:12px;border-left:2px solid var(--acento);padding-left:12px}
  .respuesta b{font-family:var(--tit),sans-serif;font-size:13.5px;color:var(--acento-texto)}
  .respuesta p{margin-top:2px}
  .card.turno{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .card.turno .quien{flex:1 1 140px;min-width:0}
  .card.turno .acciones{flex:0 0 auto}
  .horario{
    font-family:var(--tit),sans-serif;font-size:19px;font-weight:800;letter-spacing:-.03em;
    color:var(--acento);min-width:56px;font-variant-numeric:tabular-nums;
  }

  /* ---------- ventanas ---------- */
  .fondo-modal{position:fixed;inset:0;background:rgba(26,20,16,.45);display:flex;align-items:flex-end;justify-content:center;z-index:60}
  .modal{
    background:var(--hoja);border-radius:16px 16px 0 0;padding:22px 20px 26px;width:100%;
    max-width:520px;max-height:88vh;overflow:auto;box-shadow:var(--som-alta);
    animation:entra .16s ease-out;

  @keyframes entra{from{transform:translateY(12px)}to{transform:none}}
  @media (prefers-reduced-motion:reduce){.modal{animation:none}}
  @media (min-width:560px){
    .fondo-modal{align-items:center;padding:20px}

  .modal h3{font-size:19px;margin-bottom:5px}

  /* ---------- mensajes ---------- */
  .mensajes{
    position:fixed;left:0;right:0;bottom:20px;display:flex;flex-direction:column;
    align-items:center;gap:8px;z-index:80;pointer-events:none;padding:0 16px;

  @media (max-width:760px){
    .mensajes{bottom:calc(76px + env(safe-area-inset-bottom))}

  .mensaje{
    background:#1A1410;color:#FBF9F7;padding:11px 17px;border-radius:var(--r);
    font-size:14.5px;font-weight:500;max-width:440px;border-left:3px solid var(--acento);
    box-shadow:var(--som-alta);

  .mensaje.mal{border-left-color:#F0879B}

  .tabla{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
  .tabla th,.tabla td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--borde)}

  @media (max-width:430px){

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef, createContext, useContext } = React;

const CLAVE = 'apptrainner_token';
let sesion = localStorage.getItem(CLAVE) || null;

async function api(path, opts = {}) {
  const r = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers: Object.assign({ 'Content-Type': 'application/json' },
      sesion ? { Authorization: 'Bearer ' + sesion } : {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status === 401) { sesion = null; localStorage.removeItem(CLAVE); location.reload(); }
    const e = new Error(d.error || 'Algo no salió bien. Probá de nuevo.');
    e.status = r.status; e.datos = d; throw e;
  }
  return d;
}

const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const fmt = d => d ? d.split('-').reverse().slice(0, 2).join('/') : '—';
const fmtLargo = d => { if (!d) return '—'; const [a, m, dd] = d.split('-'); return `${dd}/${m}`; };
const hora = iso => iso ? new Date(iso).toTimeString().slice(0, 5) : '';
const hoyISO = () => new Date().toISOString().slice(0, 10);
const semanaDe = i => i ? Math.max(1, Math.floor((Date.now() - new Date(i + 'T00:00:00')) / (7 * 864e5)) + 1) : 1;
function finPlan(inicio) {
  if (!inicio) return null;
  const d = new Date(inicio + 'T00:00:00'); d.setDate(d.getDate() + 28);
  return d.toISOString().slice(0, 10);
}
const diasRestantes = inicio => {
  const f = finPlan(inicio); if (!f) return null;
  return Math.ceil((new Date(f + 'T00:00:00') - new Date().setHours(0, 0, 0, 0)) / 864e5);
};

/* Iniciales para el círculo del alumno: "Camila Godoy" -> "CG". */
const iniciales = n => ((n || '').trim().split(/\s+/).slice(0, 2)
  .map(p => p.charAt(0)).join('').toUpperCase()) || '?';

/* En qué anda el plan del alumno, para la etiqueta de su tarjeta. */
function estadoPlan(inicio) {
  const d = diasRestantes(inicio);
  if (d === null) return { texto: 'Sin plan', clase: '' };
  if (d < 0) return { texto: 'Toca renovar', clase: 'alerta' };
  if (d === 0) return { texto: 'Termina hoy', clase: 'aviso' };
  if (d <= 7) return { texto: 'Quedan ' + d + (d === 1 ? ' día' : ' días'), clase: 'aviso' };
  return { texto: 'Semana ' + Math.min(4, Math.max(1, Math.ceil((29 - d) / 7))), clase: 'ok' };
}

/* La cinta del plan: cuatro semanas, con una marca por semana. */
function Progreso({ inicio, compacto }) {
  if (!inicio) return null;
  const dias = diasRestantes(inicio);
  const transcurridos = Math.min(28, Math.max(0, 28 - Math.max(dias, 0)));
  const pct = (transcurridos / 28) * 100;
  const estado = dias < 0 ? 'cumplido' : dias <= 7 ? 'cerca' : '';
  const semana = Math.min(4, Math.max(1, Math.ceil((transcurridos + 1) / 7)));
  const marcas = [7, 14, 21].map(d =>
    <i key={d} className="marca" style={{ left: (d / 28) * 100 + '%' }} />);

  return (
    <div className="plan">
      <div className={'cinta ' + estado}>
        <i className="lleno" style={{ width: Math.max(pct, 1.5) + '%' }} />
        {marcas}
      </div>
      <div className="pie">
        <b>{dias < 0 ? 'Plan cumplido' : 'Semana ' + semana + ' de 4'}</b>
        {!compacto && <span>{dias < 0 ? 'toca renovar' : 'termina el ' + fmtLargo(finPlan(inicio))}</span>}
      </div>
    </div>);
}

/* Modo claro u oscuro. Respeta lo que tenga configurado el celular
   la primera vez, y después manda la elección del usuario. */
const TEMA = 'apptrainner_tema';
function aplicarTema(t) {
  document.documentElement.setAttribute('data-tema', t);
  try { localStorage.setItem(TEMA, t); } catch { /* modo privado */ }
}
(function temaInicial() {
  let t = null;
  try { t = localStorage.getItem(TEMA); } catch { /* modo privado */ }
  if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
  document.documentElement.setAttribute('data-tema', t);
})();

function BotonTema() {
  const [tema, setTema] = useState(document.documentElement.getAttribute('data-tema') || 'claro');
  const cambiar = () => { const n = tema === 'oscuro' ? 'claro' : 'oscuro'; setTema(n); aplicarTema(n); };
  return (
    <button className="tema" onClick={cambiar} title={tema === 'oscuro' ? 'Pasar a modo claro' : 'Pasar a modo oscuro'}
      aria-label={tema === 'oscuro' ? 'Pasar a modo claro' : 'Pasar a modo oscuro'}>
      {tema === 'oscuro' ? '☀' : '☾'}
    </button>);
}

/* ---------- avisos y ventanas propias ---------- */
const Aviso = createContext(null);
const usarAviso = () => useContext(Aviso);

function ProveedorAviso({ children }) {
  const [mensajes, setMensajes] = useState([]);
  const [pregunta, setPregunta] = useState(null);

  const avisar = useCallback((texto, tipo = 'bien') => {
    const id = Math.random();
    setMensajes(m => [...m, { id, texto, tipo }]);
    setTimeout(() => setMensajes(m => m.filter(x => x.id !== id)), 3600);
  }, []);

  const confirmar = useCallback((texto, detalle, etiqueta) =>
    new Promise(res => setPregunta({ texto, detalle, etiqueta: etiqueta || 'Sí, dale', res })), []);

  // Memorizado: si no, cambia en cada render y hace recargar datos en bucle.
  const valor = useMemo(() => ({ avisar, confirmar }), [avisar, confirmar]);

  return (
    <Aviso.Provider value={valor}>
      {children}
      <div className="mensajes">
        {mensajes.map(m => <div key={m.id} className={'mensaje ' + m.tipo}>{m.texto}</div>)}
      </div>
      {pregunta &&
        <div className="fondo-modal" onClick={() => { pregunta.res(false); setPregunta(null); }}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>{pregunta.texto}</h3>
            {pregunta.detalle && <p className="sub">{pregunta.detalle}</p>}
            <button className="btn riesgo" onClick={() => { pregunta.res(true); setPregunta(null); }}>
              {pregunta.etiqueta}</button>
            <button className="btn linea" style={{ marginTop: 10 }}
              onClick={() => { pregunta.res(false); setPregunta(null); }}>Mejor no</button>
          </div>
        </div>}
    </Aviso.Provider>);
}

function Modal({ titulo, sub, children, cerrar }) {
  useEffect(() => {
    const esc = e => e.key === 'Escape' && cerrar();
    window.addEventListener('keydown', esc);
    return () => window.removeEventListener('keydown', esc);
  }, [cerrar]);
  return (
    <div className="fondo-modal" onClick={cerrar}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <h3>{titulo}</h3>
        {sub && <p className="sub">{sub}</p>}
        {children}
      </div>
    </div>);
}

/* Si una pantalla falla, se muestra el error en vez de quedar trabada. */
class Escudo extends React.Component {
  constructor(p) { super(p); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidUpdate(prev) { if (prev.clave !== this.props.clave && this.state.error) this.setState({ error: null }); }
  render() {
    if (this.state.error)
      return (<div className="vacio">
        <p>Se trabó esta pantalla. Probá volver a entrar.</p>
        <button className="btn chico" onClick={() => this.setState({ error: null })}>Reintentar</button>
      </div>);
    return this.props.children;
  }
}

/* ---------- recuperar contraseña ---------- */
function Recuperar({ token, listo }) {
  const [nueva, setNueva] = useState('');
  const [repetir, setRepetir] = useState('');
  const [ok, setOk] = useState(false);
  const { avisar } = usarAviso();

  async function guardar() {
    if (nueva !== repetir) { avisar('Las dos contraseñas no coinciden', 'mal'); return; }
    try {
      await api('/recuperar/confirmar', { method: 'POST', body: { token, nueva } });
      setOk(true);
    } catch (e) { avisar(e.message, 'mal'); }
  }

  if (ok) return (
    <div className="centro">
      <div className="portada"><span className="cifra">✓</span><h1>Listo</h1>
        <p>Ya podés entrar con tu contraseña nueva.</p></div>
      <button className="btn" onClick={listo}>Entrar</button>
    </div>);

  return (
    <div className="centro">
      <div className="portada"><h1>Contraseña nueva</h1>
        <p>Elegí una y volvés a entrar.</p></div>
      <div className="card">
        <label>Contraseña nueva<input type="password" autoFocus value={nueva}
          onChange={e => setNueva(e.target.value)} autoComplete="new-password" />
          <span className="chico">Mínimo 8 caracteres.</span></label>
        <label>Repetila<input type="password" value={repetir} onChange={e => setRepetir(e.target.value)}
          autoComplete="new-password" onKeyDown={e => e.key === 'Enter' && guardar()} /></label>
        <button className="btn" onClick={guardar} disabled={nueva.length < 8}>Guardar</button>
        <button className="btn linea" style={{ marginTop: 10 }} onClick={listo}>Volver</button>
      </div>
    </div>);
}

/* ---------- entrada ---------- */
function Entrar({ onEntrar }) {
  const [modo, setModo] = useState('login');
  const [f, setF] = useState({ email: '', password: '', nombre: '' });
  const [cargando, setCargando] = useState(false);
  const { avisar } = usarAviso();
  const set = k => e => setF({ ...f, [k]: e.target.value });

  async function pedirLink() {
    if (!f.email.trim()) { avisar('Escribí tu mail primero', 'mal'); return; }
    try {
      const r = await api('/recuperar', { method: 'POST', body: { email: f.email } });
      avisar(r.mensaje || 'Si ese mail tiene cuenta, te llega un link.');
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function enviar() {
    setCargando(true);
    try {
      const r = await api(modo === 'login' ? '/login' : '/registro', { method: 'POST', body: f });
      sesion = r.token; localStorage.setItem(CLAVE, r.token);
      avisar(modo === 'login' ? '¡Hola de nuevo!' : '¡Cuenta creada! Bienvenido.');
      onEntrar(r);
    } catch (e) { avisar(e.message, 'mal'); } finally { setCargando(false); }
  }

  return (
    <div className="entrada">
      <div className="entrada-lado">
        <strong className="marca-lado">AppTrainner</strong>
        <div>
          <h2>Tus alumnos, sus rutinas y sus controles en un solo lugar.</h2>
          <p style={{ marginTop: 10 }}>Armá el mes, mandá el link personal y mirá qué cargó cada uno.</p>
        </div>
        <span className="pie-lado">Hecho para entrenadores de Argentina</span>
      </div>
      <div className="entrada-form">
        <div className="entrada-caja">
          <h3>{modo === 'login' ? 'Entrá a tu cuenta' : 'Creá tu cuenta'}</h3>
          {modo === 'registro' &&
            <label>¿Cómo te llamás?<input value={f.nombre} onChange={set('nombre')} placeholder="Tu nombre" /></label>}
          <label>Mail<input type="email" value={f.email} onChange={set('email')} autoComplete="email" /></label>
          <label>Contraseña
            <input type="password" value={f.password} onChange={set('password')}
              autoComplete={modo === 'login' ? 'current-password' : 'new-password'}
              onKeyDown={e => e.key === 'Enter' && enviar()} />
            {modo === 'registro' && <span className="chico">Mínimo 8 caracteres.</span>}
          </label>
          <button className="btn" onClick={enviar} disabled={cargando}>
            {cargando ? 'Un segundito...' : modo === 'login' ? 'Entrar' : 'Crear mi cuenta'}</button>
          <button className="btn linea" style={{ marginTop: 10 }}
            onClick={() => setModo(modo === 'login' ? 'registro' : 'login')}>
            {modo === 'login' ? 'Todavía no tengo cuenta' : 'Ya tengo cuenta'}</button>
          {modo === 'login' &&
            <button className="olvide" onClick={pedirLink}>Me olvidé la contraseña</button>}
        </div>
      </div>
    </div>);
}

/* ---------- grupos musculares ---------- */
function Grupos({ grupos, recargar, ejercicios, cerrar }) {
  const [nuevo, setNuevo] = useState('');
  const [editando, setEditando] = useState(null);
  const [fusion, setFusion] = useState(null);
  const { avisar, confirmar } = usarAviso();

  const cuantos = nombre => ejercicios.filter(e => e.grupo === nombre).length;

  async function crear() {
    if (!nuevo.trim()) return;
    try { await api('/grupos', { method: 'POST', body: { nombre: nuevo } }); setNuevo(''); await recargar(); avisar('Grupo creado'); }
    catch (e) { avisar(e.message, 'mal'); }
  }
  async function renombrar() {
    try { await api('/grupos/' + editando.id, { method: 'PATCH', body: { nombre: editando.nombre } });
      setEditando(null); await recargar(); avisar('Grupo renombrado'); }
    catch (e) { avisar(e.message, 'mal'); }
  }
  async function fusionar(destinoId) {
    try { await api('/grupos/' + fusion.id + '/fusionar', { method: 'POST', body: { destino: destinoId } });
      setFusion(null); await recargar(); avisar('Grupos fusionados'); }
    catch (e) { avisar(e.message, 'mal'); }
  }
  async function borrar(g) {
    const n = cuantos(g.nombre);
    if (!await confirmar('¿Eliminamos el grupo ' + g.nombre + '?',
      n ? `${n} ejercicio${n === 1 ? '' : 's'} van a quedar sin grupo. No se borran.` : 'No lo usa ningún ejercicio.',
      'Sí, eliminar')) return;
    try { await api('/grupos/' + g.id, { method: 'DELETE' }); await recargar(); avisar('Grupo eliminado'); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  return (
    <Modal titulo="Grupos musculares"
      sub="Los que definas acá son los que vas a poder elegir al cargar un ejercicio." cerrar={cerrar}>
      <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
        <input value={nuevo} placeholder="Piernas, Pecho, Espalda..." style={{ marginTop: 0 }}
          onChange={e => setNuevo(e.target.value)} onKeyDown={e => e.key === 'Enter' && crear()} />
        <button className="btn chico" onClick={crear} disabled={!nuevo.trim()}>Agregar</button>
      </div>

      {!grupos.length && <p className="suave">Creá los grupos que uses: piernas, pecho, espalda.</p>}
      {grupos.map(g => (
        <div className="ej" key={g.id}>
          <div className="ej-top">
            <div><b>{g.nombre}</b><div className="chico">{cuantos(g.nombre)} ejercicios</div></div>
            <div style={{ display: 'flex', gap: 6 }}>
              <button className="btn linea chico" onClick={() => setEditando({ ...g })}>Renombrar</button>
              {grupos.length > 1 &&
                <button className="btn linea chico" onClick={() => setFusion(g)}>Fusionar</button>}
              <button className="btn riesgo chico" onClick={() => borrar(g)}>Borrar</button>
            </div>
          </div>
        </div>))}

      {editando &&
        <div style={{ marginTop: 16 }}>
          <label>Nuevo nombre para "{grupos.find(x => x.id === editando.id).nombre}"
            <input autoFocus value={editando.nombre}
              onChange={e => setEditando({ ...editando, nombre: e.target.value })} /></label>
          <p className="chico">Los ejercicios de ese grupo se actualizan solos.</p>
          <button className="btn" onClick={renombrar}>Guardar</button>
          <button className="btn linea" style={{ marginTop: 8 }} onClick={() => setEditando(null)}>Cancelar</button>
        </div>}

      {fusion &&
        <div style={{ marginTop: 16 }}>
          <p className="suave" style={{ marginBottom: 8 }}>
            Pasar los ejercicios de <b>{fusion.nombre}</b> a:</p>
          <div className="lista">
            {grupos.filter(g => g.id !== fusion.id).map(g =>
              <button className="op" key={g.id} onClick={() => fusionar(g.id)}>{g.nombre}</button>)}
          </div>
          <button className="btn linea" style={{ marginTop: 8 }} onClick={() => setFusion(null)}>Cancelar</button>
        </div>}
    </Modal>);
}

/* ---------- banco de ejercicios ---------- */
function Ejercicios({ ejercicios, grupos, ejemplos, recargar, irAAyuda }) {
  const [form, setForm] = useState(null);
  const [verGrupos, setVerGrupos] = useState(false);
  const [tope, setTope] = useState(null);
  const [busq, setBusq] = useState('');
  const { avisar, confirmar } = usarAviso();

  async function guardar() {
    try {
      if (form.id) { await api('/ejercicios/' + form.id, { method: 'PATCH', body: form }); avisar('Ejercicio actualizado'); }
      else {
        const r = await api('/ejercicios', { method: 'POST', body: form });
        avisar(r.ya_existia ? 'Ese ejercicio ya estaba en tu banco' : 'Ejercicio guardado');
      }
      setForm(null); await recargar();
    } catch (e) {
      if (e.status === 402) { setForm(null); setTope(e.message); } else avisar(e.message, 'mal');
    }
  }

  async function borrarEjemplos() {
    if (!await confirmar('¿Borramos los ejercicios de ejemplo?',
      'Los que ya usaste en alguna rutina se quedan. El resto se va.', 'Sí, borrarlos')) return;
    try {
      const r = await api('/ejemplos', { method: 'DELETE' });
      await recargar();
      avisar(r.conservados
        ? `Borramos ${r.ejercicios}. Dejamos ${r.conservados} que ya estás usando.`
        : `Borramos ${r.ejercicios} ejercicios de ejemplo`);
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function borrar(ej) {
    if (!await confirmar('¿Sacamos este ejercicio del banco?',
      `"${ej.nombre}" ya no va a aparecer cuando armes rutinas nuevas.`, 'Sí, sacarlo')) return;
    try { await api('/ejercicios/' + ej.id, { method: 'DELETE' }); await recargar(); avisar('Listo, lo sacamos'); }
    catch (e) {
      if (e.status === 409) {
        if (!await confirmar('Ojo: lo estás usando',
          `${e.datos.usos === 1 ? 'Aparece en 1 rutina tuya' : 'Aparece en ' + e.datos.usos + ' rutinas tuyas'}. Si lo sacás, también desaparece de ahí. Esto no afecta a ningún otro entrenador.`,
          'Sacarlo igual')) return;
        try { await api('/ejercicios/' + ej.id + '?forzar=1', { method: 'DELETE' }); await recargar();
          avisar('Lo sacamos del banco y de tus rutinas'); }
        catch (e2) { avisar(e2.message, 'mal'); }
      } else avisar(e.message, 'mal');
    }
  }

  const porGrupo = {};
  const filtrados = busq.trim()
    ? ejercicios.filter(e => e.nombre.toLowerCase().includes(busq.trim().toLowerCase()))
    : ejercicios;
  filtrados.forEach(e => { (porGrupo[e.grupo || 'Sin grupo'] ||= []).push(e); });

  return (<div>
    <div className="row" style={{ marginBottom: 8 }}>
      <h2>Tu banco de ejercicios</h2>
      <button className="btn chico" onClick={() => setForm({ nombre: '', grupo: '', video_url: '' })}>Sumar uno</button>
    </div>
    <p className="suave" style={{ marginBottom: 12 }}>
      {ejercicios.length} ejercicio{ejercicios.length === 1 ? '' : 's'} cargados. El video se pega una sola vez.
    </p>
    {!!ejemplos &&
      <div className="recordatorio">
        <h3>Tenés {ejemplos} ejercicios de ejemplo</h3>
        <p className="suave">Están para que puedas armar una rutina hoy mismo. Si vas a cargar los tuyos, sacalos de una.</p>
        <button className="btn linea chico" style={{ marginTop: 10 }} onClick={borrarEjemplos}>
          Borrar los de ejemplo</button>
      </div>}

    <div className="barra-sup">
      <button className="btn linea chico" onClick={() => setVerGrupos(true)}>
        Grupos musculares ({grupos.length})</button>
      {ejercicios.length > 8 &&
        <input className="buscador" value={busq} onChange={e => setBusq(e.target.value)}
          placeholder="Buscar ejercicio" />}
    </div>

    {!ejercicios.length &&
      <div className="vacio"><p>Acá se guardan tus ejercicios con su video. Cargás cada uno una sola vez.</p>
        <button className="btn chico" onClick={() => setForm({ nombre: '', grupo: '', video_url: '' })}>Cargar el primero</button></div>}

    <div className="columnas">
    {Object.keys(porGrupo).sort().map(g => (
      <div className="dia" key={g}>
        <div className="row" style={{ marginBottom: 4 }}>
          <h3>{g}</h3>
          <span className="chico">{porGrupo[g].length}</span>
        </div>
        {porGrupo[g].map(e => (
          <div className="ej" key={e.id}>
            <div className="ej-top">
              <div>
                <b>{e.nombre}</b>
                {e.video_url
                  ? <div><a className="video" href={e.video_url} target="_blank" rel="noopener">Ver el video</a></div>
                  : <div className="chico">Sin video todavía</div>}
              </div>
              <div className="acciones">
                <button className="btn linea chico" onClick={() => setForm(e)}>Editar</button>
                <button className="btn riesgo chico" onClick={() => borrar(e)}>Sacar</button>
              </div>
            </div>
          </div>))}
      </div>))}
    </div>

    {form &&
      <Modal titulo={form.id ? 'Editar ejercicio' : 'Nuevo ejercicio'}
        sub="Queda guardado en tu banco y lo reutilizás siempre." cerrar={() => setForm(null)}>
        <label>Nombre<input autoFocus value={form.nombre || ''}
          onChange={e => setForm({ ...form, nombre: e.target.value })} placeholder="Sentadilla con barra" /></label>
        <label>Grupo muscular
          <select value={form.grupo || ''} onChange={e => setForm({ ...form, grupo: e.target.value })}>
            <option value="">Sin grupo</option>
            {grupos.map(g => <option key={g.id} value={g.nombre}>{g.nombre}</option>)}
          </select>
        </label>
        {!grupos.length &&
          <p className="chico" style={{ marginTop: -6, marginBottom: 12 }}>
            Todavía no definiste grupos. Cerrá esto y tocá "Grupos musculares" para crearlos.</p>}
        <label>Link del video<input value={form.video_url || ''}
          onChange={e => setForm({ ...form, video_url: e.target.value })}
          placeholder="Pegá el link de YouTube o Instagram" /></label>
        <button className="btn" onClick={guardar} disabled={!String(form.nombre || '').trim()}>Guardar</button>
        <button className="btn linea" style={{ marginTop: 10 }} onClick={() => setForm(null)}>Cancelar</button>
      </Modal>}

    {verGrupos && <Grupos grupos={grupos} recargar={recargar} ejercicios={ejercicios} cerrar={() => setVerGrupos(false)} />}
    {tope && <Tope texto={tope} cerrar={() => setTope(null)} irAAyuda={irAAyuda} />}
  </div>);
}

/* ---------- alumnos ---------- */
function FormAlumno({ inicial, onGuardar, cerrar, conTurnos }) {
  const [f, setF] = useState(inicial);
  const set = k => e => setF({ ...f, [k]: e.target.value });
  const turnos = f.turnos || [];

  const agregarDia = () => setF({ ...f, turnos: [...turnos, { dia_semana: 1, hora: '09:00', duracion: 60 }] });
  const cambiarDia = (i, campo, valor) => {
    const t = [...turnos]; t[i] = { ...t[i], [campo]: valor }; setF({ ...f, turnos: t });
  };
  const quitarDia = i => setF({ ...f, turnos: turnos.filter((_, j) => j !== i) });

  return (
    <Modal titulo={f.id ? 'Editar alumno' : 'Nuevo alumno'}
      sub={conTurnos ? 'Cargá sus datos y los días que entrena.' : 'Cargá sus datos.'} cerrar={cerrar}>
      <label>Nombre<input autoFocus value={f.nombre || ''} onChange={set('nombre')} /></label>
      <label>Teléfono o mail<input value={f.contacto || ''} onChange={set('contacto')} placeholder="Opcional" /></label>
      <label>¿Cuándo arrancó el plan?<input type="date" value={f.inicio || ''} onChange={set('inicio')} /></label>
      <div className="dos">
        <label>Peso inicial (kg)<input type="number" inputMode="decimal" value={f.peso_inicial || ''}
          onChange={set('peso_inicial')} placeholder="Opcional" /></label>
        <label>Altura (cm)<input type="number" inputMode="numeric" value={f.altura || ''}
          onChange={set('altura')} placeholder="Opcional" /></label>
      </div>
      <label>Anotaciones<textarea rows="3" value={f.notas || ''} onChange={set('notas')}
        placeholder="Lesiones, objetivos, lo que quieras recordar (opcional)" /></label>

      {conTurnos && (<div>
        <label style={{ marginBottom: 6 }}>Días y horarios</label>
        <p className="chico" style={{ marginBottom: 8 }}>Uno por cada día que entrena. Van directo a tu agenda.</p>
        {turnos.map((t, i) => (
          <div key={i} style={{ display: 'flex', gap: 6, marginBottom: 8, alignItems: 'center' }}>
            <select value={t.dia_semana} style={{ marginTop: 0 }}
              onChange={e => cambiarDia(i, 'dia_semana', +e.target.value)}>
              {[1, 2, 3, 4, 5, 6, 0].map(d => <option key={d} value={d}>{DIAS[d].slice(0, 3)}</option>)}
            </select>
            <input type="time" value={t.hora} style={{ marginTop: 0 }}
              onChange={e => cambiarDia(i, 'hora', e.target.value)} />
            <input type="number" value={t.duracion} style={{ marginTop: 0, maxWidth: 80 }} title="minutos"
              onChange={e => cambiarDia(i, 'duracion', +e.target.value)} />
            <button className="mini" onClick={() => quitarDia(i)} title="Quitar">✕</button>
          </div>))}
        <button className="btn linea chico" onClick={agregarDia} style={{ marginBottom: 14 }}>
          + Agregar día</button>
      </div>)}

      <button className="btn" onClick={() => onGuardar(f)} disabled={!String(f.nombre || '').trim()}>
        Guardar alumno</button>
    </Modal>);
}
