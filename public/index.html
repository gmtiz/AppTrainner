    {form &&
      <Modal titulo={form.titulo}
        sub={form.ultimo
          ? `La última vez levantó ${form.ultimo.kg} kg × ${form.ultimo.reps}`
          : (form.item_id ? 'Cambiá lo que necesites.' : '¿Cómo lo hace tu alumno?')}
        cerrar={() => setForm(null)}>
        {form.ejercicio_id === null && !form.item_id && (<div>
          <label>Link del video<input value={form.video} placeholder="Opcional"
            onChange={e => setForm({ ...form, video: e.target.value })} /></label>
          <label>Grupo muscular
            <select value={form.grupo} onChange={e => setForm({ ...form, grupo: e.target.value })}>
              <option value="">Sin grupo</option>
              {grupos.map(g => <option key={g.id} value={g.nombre}>{g.nombre}</option>)}
            </select></label>
        </div>)}
        <div className="dos">
          <label>Series<input value={form.series} onChange={e => setForm({ ...form, series: e.target.value })} /></label>
          <label>Repeticiones<input value={form.reps} onChange={e => setForm({ ...form, reps: e.target.value })} /></label>
        </div>
        <label>Peso de referencia (kg)
          <input type="number" inputMode="decimal" value={form.peso_sugerido || ''} placeholder="Opcional"
            onChange={e => setForm({ ...form, peso_sugerido: e.target.value })} />
          <span className="chico">El alumno lo ve como punto de partida.</span></label>
        <label>Nota para el alumno<input value={form.nota} placeholder="Opcional"
          onChange={e => setForm({ ...form, nota: e.target.value })} /></label>
        <button className="btn" onClick={guardarItem}>{form.item_id ? 'Guardar cambios' : 'Agregar a la rutina'}</button>
        {form.item_id &&
          <button className="btn riesgo" style={{ marginTop: 10 }}
            onClick={() => quitar({ id: form.item_id, ejercicio: form.titulo })}>Sacar de la rutina</button>}
      </Modal>}

    {nombreForm !== null &&
      <Modal titulo="Cambiar nombre" cerrar={() => setNombreForm(null)}>
        <label>Nombre de la rutina
          <input autoFocus value={nombreForm} maxLength={80}
            onChange={e => setNombreForm(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') guardarNombre(); }} /></label>
        <button className="btn" onClick={guardarNombre} disabled={!nombreForm.trim()}>Guardar</button>
      </Modal>}
    {diaForm &&
      <Modal titulo={diaForm.id ? 'Editar día' : 'Nuevo día'} cerrar={() => setDiaForm(null)}>
        <label>Nombre<input autoFocus value={diaForm.nombre || ''}
          onChange={e => setDiaForm({ ...diaForm, nombre: e.target.value })} /></label>
        <label>Día sugerido<input value={diaForm.dia_sugerido || ''} placeholder="Lunes (opcional)"
          onChange={e => setDiaForm({ ...diaForm, dia_sugerido: e.target.value })} /></label>
        <button className="btn" onClick={guardarDia}>Guardar</button>
        {diaForm.id &&
          <button className="btn riesgo" style={{ marginTop: 10 }} onClick={() => borrarDia(diaForm)}>Eliminar este día</button>}
      </Modal>}
  </div>);
}

/* La semana entera de un vistazo: es donde el entrenador ve dónde le queda
   un hueco para meter un alumno nuevo. */
/* Reparte en columnas los turnos que se pisan dentro de un mismo día, para que
   no queden uno encima del otro. Devuelve, por turno, en qué columna va y
   cuántas columnas tiene su grupo (los que se pisan entre sí, en cadena).
   Está fuera del componente a propósito: así se puede probar sin un navegador. */
function repartirEnColumnas(lista) {
  const min = h => { const [a, b] = String(h).split(':').map(Number); return (a || 0) * 60 + (b || 0); };
  const orden = [...lista].sort((a, b) => {
    const ia = min(a.hora), ib = min(b.hora);
    if (ia !== ib) return ia - ib;
    const da = a.duracion || 60, db = b.duracion || 60;
    if (da !== db) return db - da;
    return String(a.id).localeCompare(String(b.id));   // desempate estable
  });
  const salida = [];
  let grupo = [];
  const cerrar = () => {
    const columnas = grupo.reduce((m, x) => Math.max(m, x.col + 1), 0);
    for (const x of grupo) salida.push({ turno: x.turno, col: x.col, columnas });
    grupo = [];
  };
  for (const t of orden) {
    const arranca = min(t.hora), termina = arranca + (t.duracion || 60);
    // Si ninguno del grupo sigue abierto a esta hora, el grupo se cierra acá.
    if (grupo.length && grupo.every(x => x.termina <= arranca)) cerrar();
    let col = 0;
    while (grupo.some(x => x.col === col && x.termina > arranca)) col++;
    grupo.push({ turno: t, col, termina });
  }
  if (grupo.length) cerrar();
  return salida;
}

function VistaSemana({ turnos, editar }) {
  const dias = [1, 2, 3, 4, 5, 6, 0];
  const enMinutos = h => { const [a, b] = String(h).split(':').map(Number); return (a || 0) * 60 + (b || 0); };
  const conTurnos = turnos.length ? turnos : [];
  const desde = conTurnos.length ? Math.min(...conTurnos.map(t => enMinutos(t.hora))) : 8 * 60;
  const hasta = conTurnos.length
    ? Math.max(...conTurnos.map(t => enMinutos(t.hora) + (t.duracion || 60))) : 20 * 60;
  const inicio = Math.floor(Math.max(0, desde - 30) / 60);
  const fin = Math.ceil(Math.min(24 * 60, hasta + 30) / 60);
  const horas = [];
  for (let h = inicio; h <= fin; h++) horas.push(h);
  const alto = Math.max(220, (fin - inicio) * 46);
  const y = min => ((min - inicio * 60) / ((fin - inicio) * 60)) * alto;

  if (!turnos.length) return <div className="vacio"><p>Todavía no cargaste horarios.</p></div>;

  return (
    <div className="semana-grilla" style={{ '--alto': alto + 'px' }}>
      <div className="horas">
        {horas.map(h => (
          <div className="hora-marca" key={h} style={{ top: y(h * 60) + 'px' }}>
            {String(h).padStart(2, '0')}:00</div>))}
      </div>
      {dias.map(d => {
        const delDia = turnos.filter(t => t.dia_semana === d);
        return (
          <div className="col-dia" key={d}>
            <div className="cabeza">{DIAS[d].slice(0, 3)}</div>
            <div className="pista">
              {horas.map(h => <div className="linea" key={h} style={{ top: y(h * 60) + 'px' }} />)}
              {repartirEnColumnas(delDia).map(({ turno: t, col, columnas }) => (
                <button className={'bloque' + (t.choca ? ' choca' : '') + (columnas > 2 ? ' apretado' : '')}
                  key={t.id}
                  onClick={() => editar(t)}
                  title={t.hora + ' · ' + t.alumno + ' · ' + (t.duracion || 60) + ' min'
                         + (columnas > 1 ? ' · comparte horario con otro alumno' : '')}
                  style={{ top: y(enMinutos(t.hora)) + 'px',
                           height: Math.max(26, ((t.duracion || 60) / ((fin - inicio) * 60)) * alto) + 'px',
                           '--l': (col * 100 / columnas) + '%',
                           '--w': (100 / columnas) + '%',
                           zIndex: col + 1 }}>
                  <span className="hora-bloque">{t.hora}</span>
                  <span className="quien-bloque">{t.alumno}</span>
                </button>))}
            </div>
          </div>);
      })}
    </div>);
}

/* ---------- agenda ---------- */
function Agenda({ clientes, recargarTurnos }) {
  const [vista, setVista] = useState('dia');
  const [fecha, setFecha] = useState(hoyISO());
  const [dia, setDia] = useState(null);
  const [todos, setTodos] = useState([]);
  const [form, setForm] = useState(null);
  const { avisar, confirmar } = usarAviso();

  const [asistencias, setAsistencias] = useState({});

  const cargar = useCallback(async () => {
    try {
      setDia(await api('/turnos?fecha=' + fecha));
      setTodos(await api('/turnos'));
      const marcas = await api('/asistencias?fecha=' + fecha);
      const mapa = {};
      marcas.forEach(m => { mapa[m.cliente_id] = m.estado; });
      setAsistencias(mapa);
    } catch (e) { avisar(e.message, 'mal'); }
  }, [fecha, avisar]);
  useEffect(() => { cargar(); }, [cargar]);

  // Un toque marca presente, otro ausente, otro lo deja sin marcar.
  async function marcar(t, estado) {
    const nuevo = asistencias[t.cliente_id] === estado ? null : estado;
    setAsistencias({ ...asistencias, [t.cliente_id]: nuevo });
    try { await api('/asistencias', { method: 'POST', body: { cliente_id: t.cliente_id, fecha, estado: nuevo } }); }
    catch (e) { avisar(e.message, 'mal'); cargar(); }
  }

  // Se puede navegar un mes para atrás y uno para adelante.
  const limite = dias => {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + dias);
    return d.toISOString().slice(0, 10);
  };
  const mover = n => {
    const d = new Date(fecha + 'T00:00:00'); d.setDate(d.getDate() + n);
    const nueva = d.toISOString().slice(0, 10);
    if (nueva < limite(-31) || nueva > limite(31)) { avisar('Podés moverte un mes para cada lado', 'mal'); return; }
    setFecha(nueva);
  };

  async function guardar() {
    try {
      if (form.id) await api('/turnos/' + form.id, { method: 'PATCH', body: form });
      else await api('/turnos', { method: 'POST', body: form });
      setForm(null); await cargar(); await recargarTurnos(); avisar('Turno guardado');
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function borrar(t) {
    if (!await confirmar('¿Eliminamos este turno?', `${t.alumno}, ${DIAS[t.dia_semana]} ${t.hora}`, 'Sí, eliminar')) return;
    try { await api('/turnos/' + t.id, { method: 'DELETE' }); await cargar(); await recargarTurnos(); avisar('Turno eliminado'); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  const finDe = t => {
    const [h, m] = t.hora.split(':').map(Number);
    const total = h * 60 + m + (t.duracion || 60);
    return String(Math.floor(total / 60) % 24).padStart(2, '0') + ':' + String(total % 60).padStart(2, '0');
  };
  const nombreFecha = f => {
    const d = new Date(f + 'T00:00:00');
    return `${DIAS[d.getDay()]} ${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
  };
  const esHoy = fecha === hoyISO();
  const turnos = dia ? dia.turnos : [];
  const choques = turnos.filter(t => t.choca);

  return (<div>
    <div className="row" style={{ marginBottom: 12 }}>
      <h2>Tu agenda</h2>
      <button className="btn chico" disabled={!clientes.length}
        onClick={() => setForm({ cliente_id: clientes[0].id,
          dia_semana: new Date(fecha + 'T00:00:00').getDay(), hora: '09:00', duracion: 60, nota: '' })}>
        Sumar turno</button>
    </div>

    <div className="barra-sup">
      <button className={'chip' + (vista === 'dia' ? ' on' : '')} onClick={() => setVista('dia')}>Por día</button>
      <button className={'chip' + (vista === 'semana' ? ' on' : '')} onClick={() => setVista('semana')}>Toda la semana</button>
    </div>

    {vista === 'semana' && <VistaSemana turnos={todos} editar={setForm} />}

    {vista === 'dia' && <div>
    <div className="navdia">
      <button className="mini" onClick={() => mover(-1)} title="Día anterior">‹</button>
      <div style={{ textAlign: 'center', flex: 1 }}>
        <b>{nombreFecha(fecha)}</b>
        {esHoy && <span className="globo ok" style={{ marginLeft: 8 }}>hoy</span>}
        <div><input type="date" className="fecha" value={fecha} min={limite(-31)} max={limite(31)}
          onChange={e => e.target.value && setFecha(e.target.value)} /></div>
      </div>
      <button className="mini" onClick={() => mover(1)} title="Día siguiente">›</button>
    </div>
    {!esHoy && <button className="btn linea chico" style={{ marginBottom: 14 }}
      onClick={() => setFecha(hoyISO())}>Volver a hoy</button>}

    {!clientes.length && <div className="vacio"><p>Primero cargá alumnos para poder darles horario.</p></div>}

    {!!choques.length &&
      <div className="recordatorio alerta">
        <h3>Se te juntan alumnos este día</h3>
        <p className="suave">Hay horarios con más gente de la que atendés a la vez. Podés ajustar ese número en Ayuda.</p>
      </div>}

    {!turnos.length && !!clientes.length &&
      <div className="vacio"><p>Este día está libre.</p>
        <button className="btn chico" onClick={() => setForm({ cliente_id: clientes[0].id,
          dia_semana: new Date(fecha + 'T00:00:00').getDay(), hora: '09:00', duracion: 60, nota: '' })}>
          Sumar uno</button></div>}

    {turnos.map(t => (
      <div className="card turno" key={t.id}>
        <div className="horario">{t.hora}</div>
        <div className="quien">
          <b>{t.alumno}</b>
          <div className="chico">{t.duracion} min, hasta {finDe(t)}{t.nota ? '. ' + t.nota : ''}</div>
          {t.choca && <span className="globo alerta" style={{ marginTop: 6 }}>Se pisa con otro turno</span>}
        </div>
        <div className="acciones">
          <button className={'asist' + (asistencias[t.cliente_id] === 'presente' ? ' vino' : '')}
            onClick={() => marcar(t, 'presente')}>Vino</button>
          <button className={'asist' + (asistencias[t.cliente_id] === 'ausente' ? ' falto' : '')}
            onClick={() => marcar(t, 'ausente')}>Faltó</button>
          <button className="btn linea chico" onClick={() => setForm(t)}>Editar</button>
          <button className="btn riesgo chico" onClick={() => borrar(t)}>Quitar</button>
        </div>
      </div>))}

    </div>}

    {form &&
      <Modal titulo={form.id ? 'Editar turno' : 'Nuevo turno'}
        sub="Es el horario fijo semanal del alumno." cerrar={() => setForm(null)}>
        {!form.id &&
          <label>Alumno
            <select value={form.cliente_id} onChange={e => setForm({ ...form, cliente_id: e.target.value })}>
              {clientes.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
            </select></label>}
        <label>Día
          <select value={form.dia_semana} onChange={e => setForm({ ...form, dia_semana: +e.target.value })}>
            {[1, 2, 3, 4, 5, 6, 0].map(d => <option key={d} value={d}>{DIAS[d]}</option>)}
          </select></label>
        <div className="dos">
          <label>Hora<input type="time" value={form.hora} onChange={e => setForm({ ...form, hora: e.target.value })} /></label>
          <label>Duración (min)<input type="number" value={form.duracion}
            onChange={e => setForm({ ...form, duracion: +e.target.value })} /></label>
        </div>
        <label>Nota<input value={form.nota || ''} placeholder="Opcional"
          onChange={e => setForm({ ...form, nota: e.target.value })} /></label>
        <button className="btn" onClick={guardar}>Guardar turno</button>
      </Modal>}
  </div>);
}

/* ---------- plantillas ---------- */
function EditorPlantilla({ id, volver, ejercicios, grupos, recargarEjercicios, recargar }) {
  const [p, setP] = useState(null);
  const [busq, setBusq] = useState({});
  const [form, setForm] = useState(null);
  const [diaForm, setDiaForm] = useState(null);
  const [nombreForm, setNombreForm] = useState(null);
  const arrastrando = useRef(null);
  const { avisar, confirmar } = usarAviso();

  const cargar = useCallback(async () => {
    try { setP(await api('/plantillas/' + id)); } catch (e) { avisar(e.message, 'mal'); }
  }, [id, avisar]);
  useEffect(() => { cargar(); }, [cargar]);
  if (!p) return <p className="suave">Cargando...</p>;

  async function guardarNombre() {
    const limpio = (nombreForm || '').trim();
    if (!limpio) { avisar('Poné un nombre a la plantilla.', 'mal'); return; }
    if (limpio === p.nombre) { setNombreForm(null); return; }
    try {
      await api('/plantillas/' + id, { method: 'PATCH', body: { nombre: limpio } });
      setNombreForm(null); cargar(); await recargar(); avisar('Nombre actualizado');
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function guardarItem() {
    try {
      if (form.item_id) {
        await api('/plantilla-items/' + form.item_id, { method: 'PATCH',
          body: { series: form.series, reps: form.reps, nota: form.nota } });
      } else {
        let ejId = form.ejercicio_id;
        if (!ejId) {
          const e = await api('/ejercicios', { method: 'POST',
            body: { nombre: form.nombreNuevo, grupo: form.grupo, video_url: form.video } });
          ejId = e.id; await recargarEjercicios();
        }
        await api('/plantilla-dias/' + form.diaId + '/items', { method: 'POST',
          body: { ejercicio_id: ejId, series: form.series, reps: form.reps, nota: form.nota } });
        setBusq({ ...busq, [form.diaId]: '' });
      }
      setForm(null); cargar(); await recargar(); avisar('Guardado');
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function quitar(it) {
    if (!await confirmar('¿Sacamos este ejercicio?', it.ejercicio, 'Sí, sacarlo')) return;
    try {
      await api('/plantilla-items/' + it.id, { method: 'DELETE' });
      setForm(null); cargar(); await recargar(); avisar('Ejercicio sacado');
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function guardarDia() {
    try {
      if (diaForm.id) await api('/plantilla-dias/' + diaForm.id, { method: 'PATCH', body: diaForm });
      else await api('/plantillas/' + id + '/dias', { method: 'POST', body: diaForm });
      setDiaForm(null); cargar(); await recargar(); avisar('Día guardado');
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function borrarDia(d) {
    if (!await confirmar('¿Eliminamos este día?', `"${d.nombre}" y sus ejercicios.`, 'Sí, eliminar')) return;
    try { await api('/plantilla-dias/' + d.id, { method: 'DELETE' }); setDiaForm(null); cargar(); await recargar(); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  async function reordenar(dia, desde, hacia) {
    if (hacia < 0 || hacia >= dia.items.length || desde === hacia) return;
    const ids = dia.items.map(i => i.id);
    const [m] = ids.splice(desde, 1); ids.splice(hacia, 0, m);
    setP({ ...p, dias: p.dias.map(d => d.id !== dia.id ? d
      : { ...d, items: ids.map(i => d.items.find(x => x.id === i)) }) });
    try { await api('/plantilla-dias/' + dia.id + '/orden', { method: 'PATCH', body: { ids } }); }
    catch (e) { avisar(e.message, 'mal'); cargar(); }
  }

  return (<div>
    <button className="volver" onClick={volver}>← Tus plantillas</button>
    <div className="row" style={{ marginBottom: 4 }}>
      <h2 style={{ margin: 0 }}>{p.nombre}</h2>
      <button className="btn linea chico" onClick={() => setNombreForm(p.nombre)}>Cambiar nombre</button>
    </div>
    <p className="suave" style={{ marginBottom: 18 }}>
      Armala una vez y usala con cualquier alumno, ahora o más adelante.
    </p>

    {p.dias.map((d, i) => {
      const q = busq[d.id] || '';
      const hits = q ? ejercicios.filter(e => e.nombre.toLowerCase().includes(q.toLowerCase())).slice(0, 5) : [];
      return (
        <div className="dia" key={d.id}>
          <div className="row">
            <h3>{d.nombre || 'Día ' + (i + 1)}</h3>
            <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
              {d.dia_sugerido && <span className="globo">{d.dia_sugerido}</span>}
              <button className="btn linea chico" onClick={() => setDiaForm(d)}>Editar día</button>
            </div>
          </div>
          {!d.items.length && <p className="suave" style={{ margin: '10px 0' }}>Sin ejercicios todavía.</p>}
          {d.items.map((it, idx) => (
            <div className="ej" key={it.id} draggable
              onDragStart={() => { arrastrando.current = { dia: d.id, idx }; }}
              onDragOver={e => e.preventDefault()}
              onDrop={e => { e.preventDefault();
                if (arrastrando.current && arrastrando.current.dia === d.id) reordenar(d, arrastrando.current.idx, idx);
                arrastrando.current = null; }}>
              <div className="ej-top">
                <div style={{ display: 'flex', gap: 4 }}>
                  <span className="mango">⠿</span>
                  <div><b>{it.ejercicio}</b>{it.nota && <div className="chico">{it.nota}</div>}</div>
                </div>
                <div style={{ textAlign: 'right' }}>
                  <div className="series">{it.series}×{it.reps}</div>
                  <div style={{ display: 'flex', gap: 4, marginTop: 6, justifyContent: 'flex-end' }}>
                    <button className="mini" onClick={() => reordenar(d, idx, idx - 1)}
                      disabled={idx === 0} title="Subir">↑</button>
                    <button className="mini" onClick={() => reordenar(d, idx, idx + 1)}
                      disabled={idx === d.items.length - 1} title="Bajar">↓</button>
                    <button className="btn linea chico" style={{ padding: '5px 10px', fontSize: 12.5 }}
                      onClick={() => setForm({ item_id: it.id, titulo: it.ejercicio, series: it.series || '',
                        reps: it.reps || '', nota: it.nota || '' })}>Cambiar</button>
                    <button className="btn riesgo chico" style={{ padding: '5px 10px', fontSize: 12.5 }}
                      onClick={() => quitar(it)}>Quitar</button>
                  </div>
                </div>
              </div>
            </div>))}

          <label style={{ marginTop: 14 }}>Buscar en tu banco
            <input value={q} placeholder="Escribí el nombre..." autoComplete="off"
              onChange={e => setBusq({ ...busq, [d.id]: e.target.value })} /></label>
          {q &&
            <div className="lista">
              {hits.map(e => (
                <button className="op" key={e.id} onClick={() => setForm({ diaId: d.id, ejercicio_id: e.id,
                  titulo: e.nombre, series: '4', reps: '10', nota: '' })}>
                  <b>{e.nombre}</b> <span className="chico">{e.grupo || ''}</span></button>))}
              <button className="op" style={{ color: 'var(--verde)' }}
                onClick={() => setForm({ diaId: d.id, ejercicio_id: null, nombreNuevo: q, titulo: q,
                  series: '4', reps: '10', nota: '', grupo: '', video: '' })}>
                <b>Crear "{q}"</b> y sumarlo al banco</button>
            </div>}
        </div>);
    })}

    <button className="btn linea" onClick={() => setDiaForm({ nombre: 'Día ' + (p.dias.length + 1), dia_sugerido: '' })}>
      Agregar otro día</button>

    {form &&
      <Modal titulo={form.titulo} cerrar={() => setForm(null)}>
        {form.ejercicio_id === null && !form.item_id && (<div>
          <label>Link del video<input value={form.video} placeholder="Opcional"
            onChange={e => setForm({ ...form, video: e.target.value })} /></label>
          <label>Grupo muscular
            <select value={form.grupo} onChange={e => setForm({ ...form, grupo: e.target.value })}>
              <option value="">Sin grupo</option>
              {grupos.map(g => <option key={g.id} value={g.nombre}>{g.nombre}</option>)}
            </select></label>
        </div>)}
        <div className="dos">
          <label>Series<input value={form.series} onChange={e => setForm({ ...form, series: e.target.value })} /></label>
          <label>Repeticiones<input value={form.reps} onChange={e => setForm({ ...form, reps: e.target.value })} /></label>
        </div>
        <label>Nota<input value={form.nota} placeholder="Opcional"
          onChange={e => setForm({ ...form, nota: e.target.value })} /></label>
        <button className="btn" onClick={guardarItem}>{form.item_id ? 'Guardar cambios' : 'Agregar'}</button>
        {form.item_id &&
          <button className="btn riesgo" style={{ marginTop: 10 }}
            onClick={() => quitar({ id: form.item_id, ejercicio: form.titulo })}>Sacar de la plantilla</button>}
      </Modal>}

    {nombreForm !== null &&
      <Modal titulo="Cambiar nombre" cerrar={() => setNombreForm(null)}>
        <label>Nombre de la plantilla
          <input autoFocus value={nombreForm} maxLength={80}
            onChange={e => setNombreForm(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') guardarNombre(); }} /></label>
        <button className="btn" onClick={guardarNombre} disabled={!nombreForm.trim()}>Guardar</button>
      </Modal>}

    {diaForm &&
      <Modal titulo={diaForm.id ? 'Editar día' : 'Nuevo día'} cerrar={() => setDiaForm(null)}>
        <label>Nombre<input autoFocus value={diaForm.nombre || ''}
          onChange={e => setDiaForm({ ...diaForm, nombre: e.target.value })} /></label>
        <label>Día sugerido<input value={diaForm.dia_sugerido || ''} placeholder="Lunes (opcional)"
          onChange={e => setDiaForm({ ...diaForm, dia_sugerido: e.target.value })} /></label>
        <button className="btn" onClick={guardarDia}>Guardar</button>
        {diaForm.id &&
          <button className="btn riesgo" style={{ marginTop: 10 }} onClick={() => borrarDia(diaForm)}>Eliminar este día</button>}
      </Modal>}
  </div>);
}

function Plantillas({ plantillas, recargar, clientes, ejercicios, grupos, recargarEjercicios, irAAyuda }) {
  const [editando, setEditando] = useState(null);
  const [nueva, setNueva] = useState(null);
  const [usar, setUsar] = useState(null);
  const [tope, setTope] = useState(null);
  const { avisar, confirmar } = usarAviso();

  if (editando) return <EditorPlantilla id={editando} volver={() => setEditando(null)}
    ejercicios={ejercicios} grupos={grupos} recargarEjercicios={recargarEjercicios} recargar={recargar} />;

  async function crear() {
    try {
      const dias = [];
      for (let i = 0; i < nueva.cantidad; i++) dias.push({ nombre: `Día ${i + 1}` });
      const p = await api('/plantillas', { method: 'POST', body: { nombre: nueva.nombre, dias } });
      setNueva(null); await recargar(); avisar('Plantilla creada'); setEditando(p.id);
    } catch (e) {
      if (e.status === 402) { setNueva(null); setTope(e.message); } else avisar(e.message, 'mal');
    }
  }
  async function aplicar(clienteId) {
    try { await api('/plantillas/' + usar + '/usar', { method: 'POST', body: { cliente_id: clienteId } });
      setUsar(null); avisar('Rutina creada para el alumno'); }
    catch (e) { avisar(e.message, 'mal'); }
  }
  async function borrar(p) {
    if (!await confirmar('¿Eliminamos esta plantilla?', p.nombre, 'Sí, eliminar')) return;
    try { await api('/plantillas/' + p.id, { method: 'DELETE' }); await recargar(); avisar('Plantilla eliminada'); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  return (<div>
    <div className="row" style={{ marginBottom: 8 }}>
      <h2>Tus plantillas</h2>
      <button className="btn chico" onClick={() => setNueva({ nombre: '', cantidad: 3 })}>Crear plantilla</button>
    </div>
    <p className="suave" style={{ marginBottom: 18 }}>
      Rutinas base listas para asignar. Podés armarlas ahora, aunque todavía no tengas alumnos cargados.
    </p>

    {!plantillas.length &&
      <div className="vacio"><p>Una plantilla es una rutina base que después asignás a quien quieras.</p>
        <button className="btn chico" onClick={() => setNueva({ nombre: '', cantidad: 3 })}>Crear la primera</button></div>}

    <div className="columnas">
    {plantillas.map(p => (
      <div className="card" key={p.id}>
        <div className="row"><h3>{p.nombre}</h3><span className="globo">{p.dias} días</span></div>
        <div className="acciones" style={{ marginTop: 12 }}>
          <button className="btn linea chico" onClick={() => setEditando(p.id)}>Editar</button>
          <button className="btn chico" onClick={() => setUsar(p.id)} disabled={!clientes.length}>Asignar a alumno</button>
          <button className="btn riesgo chico" onClick={() => borrar(p)}>Eliminar</button>
        </div>
      </div>))}
    </div>

    {nueva &&
      <Modal titulo="Nueva plantilla" sub="Después le cargás los ejercicios." cerrar={() => setNueva(null)}>
        <label>Nombre<input autoFocus value={nueva.nombre} placeholder="Full body principiantes"
          onChange={e => setNueva({ ...nueva, nombre: e.target.value })} /></label>
        <label>¿Cuántos días?
          <select value={nueva.cantidad} onChange={e => setNueva({ ...nueva, cantidad: +e.target.value })}>
            {[1, 2, 3, 4, 5, 6].map(n => <option key={n} value={n}>{n} días</option>)}
          </select></label>
        <button className="btn" onClick={crear} disabled={!nueva.nombre.trim()}>Crear y armar</button>
      </Modal>}

    {usar &&
      <Modal titulo="¿Para qué alumno?" cerrar={() => setUsar(null)}>
        <div className="lista">
          {clientes.map(c => <button className="op" key={c.id} onClick={() => aplicar(c.id)}>{c.nombre}</button>)}
        </div>
      </Modal>}

    {tope && <Tope texto={tope} cerrar={() => setTope(null)} irAAyuda={irAAyuda} />}
  </div>);
}

/* ---------- cuenta pausada ---------- */
function Pausada({ perfil, salir }) {
  const [texto, setTexto] = useState('');
  const [enviado, setEnviado] = useState(false);
  const { avisar } = usarAviso();

  async function enviar() {
    try {
      await api('/mensajes', { method: 'POST', body: { tipo: 'pregunta', texto } });
      setEnviado(true); setTexto('');
    } catch (e) { avisar(e.message, 'mal'); }
  }

  return (
    <div className="centro">
      <div className="portada"><span className="cifra">||</span><h1>Cuenta pausada</h1>
        <p>Tus datos están guardados. Escribinos y la reactivamos.</p></div>
      <div className="card">
        {enviado
          ? <p className="suave">Recibimos tu mensaje. Te contestamos al mail {perfil.email}.</p>
          : (<div>
              <label>¿Qué necesitás?
                <textarea rows="4" value={texto} onChange={e => setTexto(e.target.value)}
                  placeholder="Contanos y lo resolvemos" /></label>
              <button className="btn" onClick={enviar} disabled={!texto.trim()}>Enviar mensaje</button>
            </div>)}
        <button className="btn linea" style={{ marginTop: 10 }} onClick={salir}>Salir</button>
      </div>
    </div>);
}

/* ---------- ayuda: plan, uso y consultas ---------- */
function Ayuda({ perfil, recargarPerfil }) {
  const [mensajes, setMensajes] = useState([]);
  const [tipo, setTipo] = useState('pregunta');
  const [texto, setTexto] = useState('');
  const [claves, setClaves] = useState(null);
  const [bajando, setBajando] = useState(false);
  const { avisar } = usarAviso();

  // Arma el Excel en el navegador con lo que devuelve el servidor.
  async function exportar() {
    setBajando(true);
    try {
      const d = await api('/exportar');
      const libro = XLSX.utils.book_new();
      const hoja = (nombre, filas) => {
        if (!filas || !filas.length) return;
        XLSX.utils.book_append_sheet(libro, XLSX.utils.json_to_sheet(filas), nombre);
      };
      hoja('Alumnos', d.clientes);
      hoja('Ejercicios', d.ejercicios);
      hoja('Rutinas', d.rutinas);
      hoja('Agenda', (d.turnos || []).map(t => ({ ...t, dia: DIAS[t.dia_semana] })));
      hoja('Registros', d.registros);
      hoja('Peso corporal', d.seguimiento);
      if (!libro.SheetNames.length) { avisar('Todavía no hay datos para exportar', 'mal'); return; }
      XLSX.writeFile(libro, 'apptrainner-' + d.generado.slice(0, 10) + '.xlsx');
      avisar('Listo, se descargó tu archivo');
    } catch (e) { avisar(e.message, 'mal'); } finally { setBajando(false); }
  }

  async function guardarCapacidad(capacidad) {
    try { await api('/perfil', { method: 'PATCH', body: { capacidad } }); await recargarPerfil();
      avisar('Listo, ajustamos los avisos de la agenda'); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  async function cambiarClave() {
    try {
      const r = await api('/cambiar-clave', { method: 'POST', body: claves });
      // El servidor devuelve una sesión nueva: sin esto quedaríamos afuera al instante.
      if (r.token) { sesion = r.token; localStorage.setItem(CLAVE, r.token); }
      setClaves(null); avisar('Contraseña cambiada');
    } catch (e) { avisar(e.message, 'mal'); }
  }

  const cargar = useCallback(async () => {
    try { setMensajes(await api('/mensajes')); } catch (e) { avisar(e.message, 'mal'); }
  }, [avisar]);
  useEffect(() => { cargar(); }, [cargar]);

  async function enviar() {
    try {
      await api('/mensajes', { method: 'POST', body: { tipo, texto } });
      setTexto(''); await cargar();
      avisar('Mensaje enviado. Te respondemos por acá.');
    } catch (e) { avisar(e.message, 'mal'); }
  }

  const lim = perfil.limites || {}, uso = perfil.uso || {};
  const gratis = perfil.plan === 'prueba';
  const barra = (usado, tope) => Math.min(100, tope ? (usado / tope) * 100 : 0);
  const fila = (etiqueta, usado, tope) => (
    <div className="uso" key={etiqueta}>
      <div className="row">
        <span>{etiqueta}</span>
        <b>{usado} de {tope}</b>
      </div>
      <div className="cinta" style={{ height: 8 }}>
        <i className="lleno" style={{ width: Math.max(barra(usado, tope), 2) + '%' }} />
      </div>
    </div>);

  return (<div>
    <h2>Tu plan</h2>
    <div className="card" style={{ marginTop: 12 }}>
      <div className="row" style={{ marginBottom: 14 }}>
        <h3>Plan {perfil.plan_nombre}</h3>
        <span className={'globo ' + (gratis ? '' : 'ok')}>{gratis ? 'gratis' : 'activo'}</span>
      </div>
      {fila('Alumnos', uso.alumnos || 0, lim.alumnos)}
      {fila('Ejercicios', uso.ejercicios || 0, lim.ejercicios)}
      {fila('Plantillas', uso.plantillas || 0, lim.plantillas)}
    </div>

    {gratis &&
      <div className="card">
        <h3>Con el plan completo</h3>
        <ul className="beneficios">
          <li><b>Hasta 150 alumnos</b>, en vez de 3</li>
          <li><b>Carga desde Excel</b>: pasás tu planilla entera de una vez, con alumnos, rutinas y horarios</li>
          <li><b>25 plantillas</b> de rutina para reutilizar, en vez de una</li>
          <li><b>600 ejercicios</b> en tu banco, en vez de 25</li>
        </ul>
        <button className="btn" onClick={() => { setTipo('pregunta');
          setTexto('Quiero pasar al plan completo.');
          document.getElementById('consulta').scrollIntoView({ behavior: 'smooth' }); }}>
          Quiero pasar al plan completo</button>
      </div>}

    <div className="card">
      <div className="row">
        <h3>Tus datos</h3>
        <button className="btn linea chico" onClick={exportar} disabled={bajando}>
          {bajando ? 'Preparando...' : 'Bajar todo en Excel'}</button>
      </div>
      <p className="suave" style={{ marginTop: 6 }}>
        Un archivo con tus alumnos, ejercicios, rutinas, agenda y todo lo que registraron. Es tuyo, llevátelo cuando quieras.
      </p>
    </div>

    <div className="card">
      <div className="row">
        <h3>¿A cuántos alumnos atendés a la vez?</h3>
        <select value={perfil.capacidad || 1} style={{ marginTop: 0, width: 90 }}
          onChange={e => guardarCapacidad(+e.target.value)}>
          {[1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20].map(n => <option key={n} value={n}>{n}</option>)}
        </select>
      </div>
      <p className="suave" style={{ marginTop: 6 }}>
        La agenda solo te avisa de horarios superpuestos cuando pasás de ese número.
      </p>
    </div>

    <div className="card">
      <div className="row">
        <h3>Tu contraseña</h3>
        <button className="btn linea chico" onClick={() => setClaves(claves ? null : { actual: '', nueva: '' })}>
          {claves ? 'Cancelar' : 'Cambiar'}</button>
      </div>
      {claves && (<div style={{ marginTop: 14 }}>
        <label>Contraseña actual<input type="password" value={claves.actual}
          onChange={e => setClaves({ ...claves, actual: e.target.value })} /></label>
        <label>Contraseña nueva<input type="password" value={claves.nueva}
          onChange={e => setClaves({ ...claves, nueva: e.target.value })} />
          <span className="chico">Mínimo 8 caracteres. Se cierran las sesiones abiertas en otros dispositivos.</span>
        </label>
        <button className="btn" onClick={cambiarClave}
          disabled={!claves.actual || claves.nueva.length < 8}>Guardar contraseña</button>
      </div>)}
    </div>

    <h2 style={{ marginTop: 26 }}>Consultas y sugerencias</h2>
    <p className="suave" style={{ marginBottom: 14 }}>
      Contanos qué te falta o qué no funciona. Te respondemos por acá.
    </p>

    <div className="card" id="consulta">
      <label>¿De qué se trata?
        <select value={tipo} onChange={e => setTipo(e.target.value)}>
          <option value="pregunta">Tengo una duda</option>
          <option value="idea">Se me ocurre algo</option>
          <option value="problema">Algo no funciona</option>
        </select></label>
      <label>Contanos
        <textarea rows="4" value={texto} onChange={e => setTexto(e.target.value)}
          placeholder="Escribí con confianza, lo lee una persona" /></label>
      <button className="btn" onClick={enviar} disabled={!texto.trim()}>Enviar</button>
    </div>

    {mensajes.map(m => (
      <div className="card" key={m.id}>
        <div className="row" style={{ marginBottom: 6 }}>
          <span className={'globo ' + (m.estado === 'abierto' ? 'aviso' : 'ok')}>
            {m.estado === 'abierto' ? 'esperando respuesta' : 'respondida'}</span>
          <span className="chico">{fmt((m.creado || '').slice(0, 10))}</span>
        </div>
        <p>{m.texto}</p>
        {m.respuesta &&
          <div className="respuesta"><b>Respuesta</b><p>{m.respuesta}</p></div>}
      </div>))}
  </div>);
}

/* ---------- administración ---------- */
function Admin({ perfil }) {
  const [cuentas, setCuentas] = useState(null);
  const { avisar, confirmar } = usarAviso();

  const cargar = useCallback(async () => {
    try { setCuentas(await api('/admin/cuentas')); } catch (e) { avisar(e.message, 'mal'); setCuentas([]); }
  }, [avisar]);
  useEffect(() => { cargar(); }, [cargar]);

  if (cuentas === null) return <p className="suave">Cargando...</p>;

  async function cambiarPlan(c, plan) {
    try { await api('/admin/cuentas/' + c.id, { method: 'PATCH', body: { plan } }); await cargar(); avisar('Plan actualizado'); }
    catch (e) { avisar(e.message, 'mal'); }
  }
  async function borrar(c) {
    if (!await confirmar('¿Eliminar la cuenta de ' + c.nombre + '?',
      'Se borran sus alumnos, rutinas y ejercicios. No hay vuelta atrás.', 'Sí, eliminar')) return;
    try { await api('/admin/cuentas/' + c.id, { method: 'DELETE' }); await cargar(); avisar('Cuenta eliminada'); }
    catch (e) { avisar(e.message, 'mal'); }
  }

  return (<div>
    <h2>Cuentas del sistema</h2>
    <p className="suave" style={{ marginBottom: 18 }}>
      {cuentas.length} cuenta{cuentas.length === 1 ? '' : 's'} en el sistema. Desde acá las activás, pausás o eliminás.
    </p>
    <div className="columnas">
    {cuentas.map(c => (
      <div className="card" key={c.id}>
        <div className="row">
          <div>
            <h3>{c.nombre} {c.rol === 'admin' && <span className="globo">admin</span>}</h3>
            <p className="suave">{c.email}</p>
            <p className="chico">{c.alumnos} alumnos, {c.ejercicios} ejercicios. Desde {fmt(c.creada)}</p>
            {!!c.consultas && <span className="globo aviso" style={{ marginTop: 4 }}>
              {c.consultas} consulta{c.consultas === 1 ? '' : 's'} sin responder</span>}
          </div>
          <span className={'globo ' + (c.plan === 'activo' ? 'ok' : c.plan === 'pausado' ? 'aviso' : '')}>{c.plan}</span>
        </div>
        <div className="dos" style={{ marginTop: 12 }}>
          <select value={c.plan} onChange={e => cambiarPlan(c, e.target.value)} style={{ marginTop: 0 }}>
            <option value="prueba">En prueba</option>
            <option value="activo">Activo (paga)</option>
            <option value="pausado">Pausado</option>
          </select>
          {c.rol !== 'admin' && <button className="btn riesgo chico" onClick={() => borrar(c)}>Eliminar cuenta</button>}
        </div>
      </div>))}
    </div>
  </div>);
}

/* ---------- métricas del producto (admin) ---------- */
function Metricas() {
  const [m, setM] = useState(null);
  const { avisar } = usarAviso();
  useEffect(() => { api('/admin/metricas').then(setM).catch(e => avisar(e.message, 'mal')); }, [avisar]);
  if (!m) return <p className="suave">Cargando...</p>;

  const maxAlta = Math.max(1, ...m.altas.map(a => a.n));
  const dato = (etiqueta, valor, extra) => (
    <div className="dato-grande">
      <span className="cifra-dato">{valor}</span>
      <span className="etiqueta-dato">{etiqueta}</span>
      {extra && <span className="chico">{extra}</span>}
    </div>);

  return (<div>
    <h2>Cómo viene el producto</h2>
    <p className="suave" style={{ marginBottom: 18 }}>Todo lo que pasa en AppTrainner, de un vistazo.</p>

    <div className="tablero">
      {dato('Cuentas', m.cuentas.total, `${m.cuentas.pagas} pagas, ${m.cuentas.gratis} gratis`)}
      {dato('Alumnos cargados', m.volumen.alumnos)}
      {dato('Alumnos que entrenaron', m.uso.alumnos_activos_7, 'últimos 7 días')}
      {dato('Series anotadas', m.uso.series_ultimos_7, 'últimos 7 días')}
    </div>

    <div className="card">
      <h3>Cuentas nuevas por semana</h3>
      <div className="barras">
        {m.altas.map((a, i) => (
          <div className="barra-col" key={i} title={a.n + ' cuentas'}>
            <div className="col" style={{ height: Math.max(3, (a.n / maxAlta) * 90) + 'px' }} />
            <span className="chico">{a.n}</span>
          </div>))}
      </div>
      <p className="chico" style={{ marginTop: 6 }}>De hace 8 semanas hasta hoy.</p>
    </div>

    <div className="card">
      <h3>Qué hay cargado</h3>
      <table className="tabla">
        <tbody>
          <tr><td>Ejercicios</td><td><b>{m.volumen.ejercicios}</b></td></tr>
          <tr><td>Rutinas</td><td><b>{m.volumen.rutinas}</b></td></tr>
          <tr><td>Plantillas</td><td><b>{m.volumen.plantillas}</b></td></tr>
          <tr><td>Turnos en agendas</td><td><b>{m.volumen.turnos}</b></td></tr>
          <tr><td>Series registradas</td><td><b>{m.volumen.series}</b></td></tr>
          <tr><td>Alumnos activos (30 días)</td><td><b>{m.uso.alumnos_activos_30}</b></td></tr>
          <tr><td>Consultas sin responder</td><td><b>{m.uso.consultas_abiertas}</b></td></tr>
        </tbody>
      </table>
    </div>

    {!!m.dormidas.length &&
      <div className="card peligro">
        <h3>Cuentas dormidas</h3>
        <p className="suave" style={{ marginBottom: 8 }}>
          Sin actividad de sus alumnos hace más de 15 días. Son las que están por irse.
        </p>
        {m.dormidas.map((c, i) => (
          <p className="suave" key={i} style={{ marginTop: 4 }}>
            <b style={{ color: 'var(--tinta)' }}>{c.nombre}</b> — {c.email}
            {c.ultima_serie ? `, última actividad el ${fmt(c.ultima_serie)}` : ', nunca registró nada'}
          </p>))}
      </div>}

    <div className="card">
      <h3>Quién le saca más jugo</h3>
      <table className="tabla">
        <thead><tr><th>Entrenador</th><th>Plan</th><th>Alumnos</th><th>Última actividad</th></tr></thead>
        <tbody>
          {m.ranking.map((c, i) => (
            <tr key={i}>
              <td>{c.nombre}</td>
              <td><span className={'globo ' + (c.plan === 'activo' ? 'ok' : '')}>{c.plan}</span></td>
              <td><b>{c.alumnos}</b></td>
              <td className="chico">{c.ultima_serie ? fmt(c.ultima_serie) : '—'}</td>
            </tr>))}
        </tbody>
      </table>
    </div>
  </div>);
}

/* ---------- consultas recibidas (admin) ---------- */
function Consultas() {
  const [lista, setLista] = useState(null);
  const [respondiendo, setRespondiendo] = useState(null);
  const { avisar } = usarAviso();

  const cargar = useCallback(async () => {
    try { setLista(await api('/admin/mensajes')); } catch (e) { avisar(e.message, 'mal'); setLista([]); }
  }, [avisar]);
  useEffect(() => { cargar(); }, [cargar]);
  if (lista === null) return <p className="suave">Cargando...</p>;

  async function responder() {
    try {
      await api('/admin/mensajes/' + respondiendo.id, { method: 'PATCH',
        body: { respuesta: respondiendo.respuesta, estado: 'respondido' } });
      setRespondiendo(null); await cargar(); avisar('Respuesta enviada');
    } catch (e) { avisar(e.message, 'mal'); }
  }
  async function cerrar(m) {
    try { await api('/admin/mensajes/' + m.id, { method: 'PATCH', body: { estado: 'cerrado' } });
      await cargar(); } catch (e) { avisar(e.message, 'mal'); }
  }

  const etiqueta = { pregunta: 'Duda', idea: 'Idea', problema: 'Problema' };
  const abiertas = lista.filter(m => m.estado === 'abierto');

  return (<div>
    <h2>Consultas</h2>
    <p className="suave" style={{ marginBottom: 18 }}>
      {abiertas.length ? abiertas.length + ' sin responder' : 'No hay consultas sin responder'}
    </p>
    {!lista.length && <div className="vacio"><p>Todavía no te escribió nadie.</p></div>}
    {lista.map(m => (
      <div className="card" key={m.id}>
        <div className="row" style={{ marginBottom: 6 }}>
          <div>
            <b>{m.entrenador}</b>
            <div className="chico">{m.email}, plan {m.plan}</div>
          </div>
          <span className={'globo ' + (m.estado === 'abierto' ? 'aviso' : 'ok')}>
            {etiqueta[m.tipo] || m.tipo}</span>
        </div>
        <p>{m.texto}</p>
        {m.respuesta && <div className="respuesta"><b>Respondiste</b><p>{m.respuesta}</p></div>}
        <div className="acciones" style={{ marginTop: 12 }}>
          <button className="btn linea chico"
            onClick={() => setRespondiendo({ id: m.id, respuesta: m.respuesta || '', texto: m.texto })}>
            {m.respuesta ? 'Editar respuesta' : 'Responder'}</button>
          {m.estado !== 'cerrado' && <button className="btn linea chico" onClick={() => cerrar(m)}>Cerrar</button>}
        </div>
      </div>))}

    {respondiendo &&
      <Modal titulo="Responder" sub={respondiendo.texto} cerrar={() => setRespondiendo(null)}>
        <label>Tu respuesta
          <textarea rows="5" autoFocus value={respondiendo.respuesta}
            onChange={e => setRespondiendo({ ...respondiendo, respuesta: e.target.value })} /></label>
        <button className="btn" onClick={responder} disabled={!respondiendo.respuesta.trim()}>Enviar respuesta</button>
      </Modal>}
  </div>);
}

/* ---------- vista del alumno ---------- */
// Cuántas series pidió el profe: "4" -> 4, "3-4" -> 4, texto libre -> 1.
function cuantasSeries(series) {
  const nums = String(series || '').match(/\d+/g);
  if (!nums) return 1;
  return Math.min(12, Math.max(1, Math.max(...nums.map(Number))));
}

function FilaSerie({ n, objetivo, guardada, onGuardar, onBorrar }) {
  const [kg, setKg] = useState(guardada ? String(guardada.kg) : '');
  const [reps, setReps] = useState(guardada ? String(guardada.reps) : '');
  const [editando, setEditando] = useState(false);

  useEffect(() => {
    setKg(guardada ? String(guardada.kg) : '');
    setReps(guardada ? String(guardada.reps) : '');
  }, [guardada]);

  if (guardada && !editando)
    return (
      <div className="serie hecha">
        <span className="n">{n}</span>
        <span className="dato"><b>{guardada.kg}</b> kg</span>
        <span className="dato"><b>{guardada.reps}</b> reps</span>
        <button className="mini" title="Corregir" onClick={() => setEditando(true)}>✎</button>
      </div>);

  return (
    <div className="serie">
      <span className="n">{n}</span>
      <input type="number" inputMode="decimal" placeholder="kg" value={kg}
        onChange={e => setKg(e.target.value)} aria-label={'Peso de la serie ' + n} />
      <input type="number" inputMode="numeric" placeholder={objetivo || 'reps'} value={reps}
        onChange={e => setReps(e.target.value)} aria-label={'Repeticiones de la serie ' + n} />
      <button className="btn chico" disabled={!kg || !reps}
        onClick={() => { onGuardar(n, kg, reps); setEditando(false); }}>Guardar</button>
      {guardada &&
        <button className="mini" title="Borrar" onClick={() => { onBorrar(guardada.id); setEditando(false); }}>✕</button>}
    </div>);
}

function EjercicioAlumno({ item, series, observacion, soloLectura, onGuardar, onBorrar, onObservar }) {
  const [abierta, setAbierta] = useState(!!observacion);
  const [nota, setNota] = useState(observacion || '');
  const [guardandoNota, setGuardandoNota] = useState(false);

  useEffect(() => { setNota(observacion || ''); }, [observacion]);

  const pedidas = cuantasSeries(item.series);
  const hechas = series.filter(s => s.item_id === item.id);
  const porNumero = {};
  hechas.forEach(s => { porNumero[s.numero || 1] = s; });
  const extras = hechas.filter(s => (s.numero || 1) > pedidas).length;
  const filas = [];
  for (let n = 1; n <= pedidas + extras + (hechas.length >= pedidas ? 1 : 0); n++) filas.push(n);

  async function guardarNota() {
    setGuardandoNota(true);
    await onObservar(item, nota);
    setGuardandoNota(false);
  }

  return (
    <div className="ej">
      <div className="ej-top">
        <div>
          <b>{item.ejercicio}</b>
          {item.video_url &&
            <div><a className="video" href={item.video_url} target="_blank" rel="noopener">Ver el video</a></div>}
          {item.nota && <div className="chico">{item.nota}</div>}
        </div>
        <div className="series">{item.series}×{item.reps}</div>
      </div>

      {item.peso_sugerido &&
        <p className="referencia">Arrancá con <b>{item.peso_sugerido} kg</b>, que es lo que venías levantando.</p>}

      <div className="planilla">
        {soloLectura
          ? (hechas.length
              ? hechas.sort((a, b) => (a.numero || 1) - (b.numero || 1)).map(x => (
                  <div className="serie hecha" key={x.id}>
                    <span className="n">{x.numero || 1}</span>
                    <span className="dato"><b>{x.kg}</b> kg</span>
                    <span className="dato"><b>{x.reps}</b> reps</span>
                  </div>))
              : <p className="chico">Sin registros de esta semana.</p>)
          : filas.map(n => (
              <FilaSerie key={n} n={n} objetivo={item.reps} guardada={porNumero[n]}
                onGuardar={onGuardar.bind(null, item)} onBorrar={onBorrar} />))}
      </div>

      {soloLectura
        ? (observacion ? <div className="nota-alumno" style={{ marginTop: 8 }}><p>{observacion}</p></div> : null)
        : !abierta
        ? <button className="agregar-nota" onClick={() => setAbierta(true)}>
            {observacion ? 'Ver mi observación' : '+ Anotar cómo te fue'}</button>
        : (<div className="nota-alumno">
            <label>Tu observación de hoy
              <textarea rows="2" value={nota} maxLength={500} onChange={e => setNota(e.target.value)}
                placeholder="Ej: la última serie me costó, sentí molestia en el hombro" /></label>
            <div className="acciones">
              <button className="btn chico" onClick={guardarNota} disabled={guardandoNota}>Guardar</button>
              <button className="btn linea chico" onClick={() => { setNota(observacion || ''); setAbierta(false); }}>
                Cerrar</button>
            </div>
          </div>)}
    </div>);
}

function VistaAlumno({ token }) {
  const [d, setD] = useState(null);
  const [error, setError] = useState('');
  const [peso, setPeso] = useState('');
  const [verIndicacion, setVerIndicacion] = useState(false);
  const { avisar } = usarAviso();

  const [semana, setSemana] = useState(null);   // null = la que estoy entrenando

  const cargar = useCallback(() => {
    fetch('/api/alumno/' + token + (semana ? '?semana=' + semana : ''))
      .then(r => r.json())
      .then(x => {
        if (x.error) { setError(x.error); return; }
        setD(x);
        if (x.indicacion && !x.indicacion.leida) setVerIndicacion(true);
        if (x.peso_hoy) setPeso(String(x.peso_hoy));
      })
      .catch(() => setError('No pudimos cargar tu rutina.'));
  }, [token, semana]);
  useEffect(cargar, [cargar]);

  async function pedir(ruta, opciones = {}) {
    const r = await fetch('/api/alumno/' + token + ruta, Object.assign(
      { headers: { 'Content-Type': 'application/json' } }, opciones));
    const datos = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(datos.error || 'No pudimos guardarlo. Probá de nuevo.');
    return datos;
  }

  async function guardarSerie(item, numero, kg, reps) {
    try {
      const r = await pedir('/series', { method: 'POST',
        body: JSON.stringify({ item_id: item.id, numero, kg, reps }) });
      setD(prev => ({ ...prev, series: r.series }));
      avisar('Serie ' + numero + ' anotada');
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function borrarSerie(id) {
    try {
      const r = await pedir('/series/' + id, { method: 'DELETE' });
      setD(prev => ({ ...prev, series: r.series }));
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function observar(item, texto) {
    try {
      const r = await pedir('/observacion', { method: 'POST',
        body: JSON.stringify({ item_id: item.id, texto }) });
      setD(prev => ({ ...prev, observaciones: r.observaciones }));
      avisar(texto.trim() ? 'Observación guardada' : 'Observación borrada');
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function guardarPeso() {
    if (!peso) { avisar('Cargá tu peso', 'mal'); return; }
    try {
      await pedir('/seguimiento', { method: 'POST', body: JSON.stringify({ peso }) });
      avisar('Peso del día guardado'); cargar();
    } catch (e) { avisar(e.message, 'mal'); }
  }

  async function entendido() {
    try { await pedir('/indicacion-leida', { method: 'POST', body: JSON.stringify({ id: d.indicacion.id }) }); }
    catch { /* si falla, la vuelve a ver la próxima vez */ }
    setVerIndicacion(false);
    setD(prev => ({ ...prev, indicacion: { ...prev.indicacion, leida: new Date().toISOString() } }));
  }

  if (error) return <div className="wrap angosto"><div className="vacio"><p>{error}</p></div></div>;
  if (!d) return <div className="wrap angosto"><p className="suave">Cargando...</p></div>;

  const obsDe = item => {
    const o = (d.observaciones || []).find(x => x.item_id === item.id && x.fecha === hoyISO());
    return o ? o.texto : '';
  };

  return (<div>
    <div className="topbar"><div className="brand"><h1>AppTrainner</h1><span className="hola">tu rutina</span>
      <div className="derecha"><BotonTema /></div></div></div>
    <div className="wrap angosto">
      <h2>Hola, {(d.nombre || '').split(' ')[0]}</h2>

      {d.indicacion &&
        <div className="indicacion">
          <div className="row">
            <h3>Indicación de tu profe</h3>
            <span className="chico">{fmt((d.indicacion.creado || '').slice(0, 10))}</span>
          </div>
          <p style={{ marginTop: 6 }}>{d.indicacion.texto}</p>
        </div>}

      <div className="card peso-dia">
        <div className="row">
          <div>
            <h3>Tu peso de hoy</h3>
            <p className="chico">{d.peso_hoy ? 'Ya lo cargaste. Podés corregirlo.' : 'Cargalo antes de entrenar.'}</p>
          </div>
          <div className="anotar" style={{ marginTop: 0 }}>
            <input type="number" inputMode="decimal" placeholder="kg" value={peso}
              onChange={e => setPeso(e.target.value)} aria-label="Tu peso corporal de hoy" />
            <button className="btn chico" onClick={guardarPeso}>Guardar</button>
          </div>
        </div>
      </div>

      {!d.rutina
        ? <div className="vacio" style={{ marginTop: 16 }}><p>Tu profe todavía no cargó tu rutina. Escribile y avisale.</p></div>
        : (<div>
          <div className="navsemana">
            <button className="mini" onClick={() => setSemana(Math.max(1, d.semana - 1))}
              disabled={d.semana <= 1} title="Semana anterior">‹</button>
            <div className="centro-sem">
              <b>Semana {d.semana}</b>
              {d.semana === d.semana_en_curso
                ? <span className="globo ok">la que estás haciendo</span>
                : d.semana < d.semana_en_curso
                  ? <span className="globo">ya pasó</span>
                  : <span className="globo aviso">todavía no</span>}
            </div>
            <button className="mini" onClick={() => setSemana(Math.min(d.semanas_totales, d.semana + 1))}
              disabled={d.semana >= d.semanas_totales} title="Semana siguiente">›</button>
          </div>
          {d.semana !== d.semana_en_curso &&
            <button className="btn linea chico" style={{ marginBottom: 14 }}
              onClick={() => setSemana(null)}>Volver a mi semana</button>}
          <p className="suave" style={{ marginBottom: 18 }}>{d.rutina.nombre}</p>
          {d.rutina.dias.map((dia, i) => (
            <div className="dia" key={dia.id}>
              <div className="row">
                <h3>{dia.nombre || 'Día ' + (i + 1)}</h3>
                {dia.dia_sugerido && <span className="globo">{dia.dia_sugerido}</span>}
              </div>
              {dia.items.map(it => (
                <EjercicioAlumno key={it.id} item={it} series={d.series || []}
                  observacion={obsDe(it)} soloLectura={d.semana !== d.semana_en_curso}
                  onGuardar={guardarSerie} onBorrar={borrarSerie} onObservar={observar} />))}
            </div>))}
        </div>)}

      <div className="card">
        <h3>Tu evolución</h3>
        <p className="suave" style={{ marginBottom: 8 }}>El peso que fuiste cargando día a día.</p>
        <LineaPeso puntos={d.seguimiento} />
        {(d.seguimiento || []).slice(0, 6).map(s =>
          <p className="suave" key={s.id} style={{ marginTop: 6 }}>
            <b style={{ fontFamily: "'Archivo',sans-serif" }}>{s.peso} kg</b>{' el ' + fmt(s.fecha)}</p>)}
      </div>
    </div>

    {verIndicacion && d.indicacion &&
      <Modal titulo="Tu profe te dejó una indicación" cerrar={entendido}>
        <p style={{ marginBottom: 18 }}>{d.indicacion.texto}</p>
        <button className="btn" onClick={entendido}>Entendido</button>
      </Modal>}
  </div>);
}

/* ---------- app ---------- */
function App() {
  const ruta = location.pathname.match(/^\/r\/([A-Za-z0-9]+)/);
  const params = new URLSearchParams(location.search);
  const tokenAlumno = ruta ? ruta[1] : params.get('alumno');
  const [tokenRecuperar, setTokenRecuperar] = useState(params.get('recuperar'));

  const [entrado, setEntrado] = useState(!!sesion);
  const [perfil, setPerfil] = useState(null);
  const [tab, setTab] = useState('alumnos');
  const [clientes, setClientes] = useState([]);
  const [ejercicios, setEjercicios] = useState([]);
  const [grupos, setGrupos] = useState([]);
  const [ejemplos, setEjemplos] = useState(0);
  const [plantillas, setPlantillas] = useState([]);
  const [clienteId, setClienteId] = useState(null);
  const [rutinaId, setRutinaId] = useState(null);
  const [progresoId, setProgresoId] = useState(null);
  const [mas, setMas] = useState(false);
  const { avisar } = usarAviso();

  const recargarClientes = useCallback(async () => {
    try { setClientes(await api('/clientes')); } catch (e) { avisar(e.message, 'mal'); }
  }, [avisar]);
  const recargarEjercicios = useCallback(async () => {
    try { const r = await api('/ejercicios'); setEjercicios(r.ejercicios); setGrupos(r.grupos); setEjemplos(r.ejemplos || 0); }
    catch (e) { avisar(e.message, 'mal'); }
  }, [avisar]);
  const recargarPlantillas = useCallback(async () => {
    try { setPlantillas(await api('/plantillas')); } catch (e) { avisar(e.message, 'mal'); }
  }, [avisar]);
  const [versionTurnos, setVersionTurnos] = useState(0);
  const recargarTurnos = useCallback(async () => setVersionTurnos(v => v + 1), []);

  const recargarPerfil = useCallback(async () => {
    try { setPerfil(await api('/perfil')); } catch (e) { /* la sesión ya se maneja en api() */ }
  }, []);

  useEffect(() => {
    if (!entrado || tokenAlumno) return;
    recargarPerfil();
    recargarClientes(); recargarEjercicios(); recargarPlantillas();
  }, [entrado, tokenAlumno, recargarPerfil, recargarClientes, recargarEjercicios, recargarPlantillas]);

  function salir() { localStorage.removeItem(CLAVE); sesion = null; location.href = '/'; }

  if (tokenAlumno) return <VistaAlumno token={tokenAlumno} />;
  if (tokenRecuperar)
    return <Recuperar token={tokenRecuperar} listo={() => { setTokenRecuperar(null); history.replaceState({}, '', '/'); }} />;
  if (!entrado) return <Entrar onEntrar={() => setEntrado(true)} />;
  if (perfil && perfil.plan === 'pausado') return <Pausada perfil={perfil} salir={salir} />;

  const esAdmin = perfil && perfil.rol === 'admin';
  const tabs = [['alumnos', 'Alumnos'], ['agenda', 'Agenda'], ['ejercicios', 'Ejercicios'],
                ['plantillas', 'Plantillas'], ['ayuda', 'Ayuda']];
  if (esAdmin) tabs.push(['admin', 'Cuentas'], ['consultas', 'Consultas'], ['metricas', 'Métricas']);

  // Al cambiar de pestaña se refrescan los datos que esa vista necesita.
  function irA(k) {
    setClienteId(null); setRutinaId(null); setProgresoId(null); setTab(k);
    if (k === 'alumnos') recargarClientes();
    if (k === 'ejercicios') recargarEjercicios();
    if (k === 'plantillas') recargarPlantillas();
    if (k === 'ayuda') recargarPerfil();
  }

  // Las listas aprovechan el ancho; las pantallas de detalle no.
  const anchoCompleto = !clienteId && !rutinaId && !progresoId &&
    ['alumnos', 'ejercicios', 'plantillas', 'admin'].includes(tab);

  let contenido;
  if (tab === 'metricas' && esAdmin) contenido = <Metricas />;
  else if (tab === 'consultas' && esAdmin) contenido = <Consultas />;
  else if (tab === 'ayuda') contenido = perfil
    ? <Ayuda perfil={perfil} recargarPerfil={recargarPerfil} /> : <p className="suave">Cargando...</p>;
  else if (tab === 'admin' && esAdmin) contenido = <Admin perfil={perfil} />;
  else if (tab === 'agenda') contenido =
    <Agenda key={versionTurnos} clientes={clientes} recargarTurnos={recargarTurnos} />;
  else if (tab === 'plantillas') contenido =
    <Plantillas plantillas={plantillas} recargar={recargarPlantillas} clientes={clientes}
      ejercicios={ejercicios} grupos={grupos} recargarEjercicios={recargarEjercicios}
      irAAyuda={() => irA('ayuda')} />;
  else if (tab === 'ejercicios') contenido =
    <Ejercicios ejercicios={ejercicios} grupos={grupos} ejemplos={ejemplos}
      recargar={recargarEjercicios} irAAyuda={() => irA('ayuda')} />;
  else if (progresoId) contenido =
    <Progresograma clienteId={progresoId} ejercicios={ejercicios}
      nombre={(clientes.find(c => c.id === progresoId) || {}).nombre || 'tu alumno'}
      volver={() => setProgresoId(null)} />;
  else if (rutinaId) contenido =
    <Editor id={rutinaId} volver={() => setRutinaId(null)} ejercicios={ejercicios} grupos={grupos}
      recargarEjercicios={recargarEjercicios} />;
  else if (clienteId) contenido =
    <Ficha id={clienteId} clientes={clientes} plantillas={plantillas} recargarPlantillas={recargarPlantillas}
      recargarTurnos={recargarTurnos} irAAyuda={() => irA('ayuda')} perfil={perfil}
      volver={() => { setClienteId(null); recargarClientes(); }} abrirRutina={setRutinaId}
      abrirProgreso={setProgresoId} />;
  else contenido = <Alumnos clientes={clientes} recargar={recargarClientes} abrir={setClienteId}
    recargarTurnos={recargarTurnos} irAAyuda={() => irA('ayuda')} />;

  // En el celular entran cinco accesos abajo. Si la cuenta es admin y hay más,
  // los últimos se agrupan en "Más" para que ninguno quede escondido.
  const principales = tabs.length > 5 ? tabs.slice(0, 4) : tabs;
  const restantes = tabs.slice(principales.length);

  return (<div>
    <div className="topbar">
      <div className="brand">
        <h1>AppTrainner</h1>
        <span className="hola">{perfil ? perfil.nombre : ''}</span>
        <div className="derecha">
          <BotonTema />
          <button onClick={salir}>Salir</button>
        </div>
      </div>
      <div className="tabs">
        {tabs.map(([k, t]) => (
          <button key={k} className={'tab ' + (tab === k ? 'on' : '')} onClick={() => irA(k)}>{t}</button>))}
      </div>
    </div>
    <div className={'wrap' + (anchoCompleto ? '' : ' angosto')}>
      <Escudo clave={tab + (clienteId || '') + (rutinaId || '') + (progresoId || '')}>{contenido}</Escudo>
    </div>

    <nav className="barra-abajo" aria-label="Secciones">
      {principales.map(([k, t]) => (
        <button key={k} className={tab === k ? 'on' : ''} onClick={() => irA(k)}>{t}</button>))}
      {!!restantes.length &&
        <button className={restantes.some(([k]) => k === tab) ? 'on' : ''}
          onClick={() => setMas(true)}>Más</button>}
    </nav>

    {mas &&
      <Modal titulo="Ir a" cerrar={() => setMas(false)}>
        <div className="lista">
          {restantes.map(([k, t]) => (
            <button key={k} className="op" onClick={() => { setMas(false); irA(k); }}>{t}</button>))}
        </div>
      </Modal>}
  </div>);
}

ReactDOM.createRoot(document.getElementById('root'))
  .render(<ProveedorAviso><App /></ProveedorAviso>);
</script>
</body>
</html>
